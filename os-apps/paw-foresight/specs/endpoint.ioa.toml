# Endpoint — a sampled future, materialized as documents native to the
# target date.
#
# An endpoint writer (house soul or external agent) produces a document
# bundle — postmortems, filings, reviews dated at the world's target date —
# under a driver configuration assigned by sample_endpoints. The bundle is
# what repair connects backward to the skeleton; its weight is earned, not
# asserted: it comes from the repair costs of its paths.

[automaton]
name = "Endpoint"
states = ["Sampled", "Written", "UnderRepair", "Scored", "Weighted", "Discarded", "Failed"]
initial = "Sampled"

# ADR-0050/ADR-006/ADR-007: Sampled (writer running) self-heals via the
# state_timeout below — a writer that dies, or a server restart that orphans its
# in-flight provider call, re-spawns the writer rather than wedging the endpoint
# (observed live, prod world en-019ed392, 2026-06-16: 3 writers hung on their
# first model call, and the diversity-gate barrier never fired because one
# sibling bundle was never written). Written (awaiting the gate) and UnderRepair
# stay indefinite — Written is bounded by the gate barrier that fires once every
# sibling reaches it (now guaranteed by the Sampled self-heal), UnderRepair by
# the decomposer/Claim session timeouts. Scored and Weighted persist for the
# life of the world (re-weighed on update).
allow_indefinite_states = ["Written", "UnderRepair", "Scored", "Weighted"]

# Self-heal (ADR-007): when every claim on this endpoint is terminal but the
# endpoint is still UnderRepair (world aggregate missed or ScoreComplete failed),
# re-derive weight and dispatch ScoreComplete. reset_on progress actions.
[[state_timeout]]
state = "UnderRepair"
after_seconds = 600
on_timeout = "ResumeEndpointScoring"
reset_on = ["ScoreComplete", "Discard", "Fail"]

# Self-heal (ADR-0050/ADR-007), mirroring Path's Solving/Repaired/Challenged: if
# the endpoint is still Sampled after a writer's healthy wall-clock (~3 min
# observed), re-spawn the writer. Budget sits well above a live writer so a
# working session is never double-spawned; whichever writer reports BundleWritten
# first wins and a late duplicate's report no-ops (endpoint no longer Sampled).
[[state_timeout]]
state = "Sampled"
after_seconds = 900
on_timeout = "ResumeWriter"

# --- State Variables ---

[[state]]
name = "world_id"
type = "string"
initial = ""

# JSON object of driver values assigned by the solver (anti-modal spread),
# e.g. {"ai_capability_slope": "p85", "rates_regime": "tightening"}.
[[state]]
name = "driver_config"
type = "string"
initial = "{}"

[[state]]
name = "bundle_file_id"
type = "string"
initial = ""

[[state]]
name = "summary"
type = "string"
initial = ""

[[state]]
name = "author_agent_id"
type = "string"
initial = ""

# JSON array of Path entity ids repairing this endpoint.
[[state]]
name = "path_ids"
type = "string"
initial = "[]"

# Decomposition working state (ADR-004): the decomposer's claims, the Claim
# entity ids created from them, and the fan-out cursor for the bounded
# SpawnNextBridge self-loop.
[[state]]
name = "claims_json"
type = "string"
initial = "[]"

[[state]]
name = "claim_ids"
type = "string"
initial = "[]"

[[state]]
name = "check_count"
type = "string"
initial = "0"

[[state]]
name = "weight"
type = "string"
initial = ""

[[state]]
name = "discard_reason"
type = "string"
initial = ""

# ADR-006: the differentiate brief the diversity gate hands a re-steered writer
# — which sibling future this endpoint collapsed onto, and to diverge from it.
[[state]]
name = "revision_brief"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Actions ---

# ADR-006: the writer self-reports its bundle here — NOT straight to repair.
# The endpoint parks in Written until the diversity gate has seen every world's
# bundle; the gate then releases the diverse ones via SubmitForRepair and
# re-steers the collapsed ones via ReSteer. The trigger re-enters
# sample_endpoints to run the all-written barrier check.
[[action]]
name = "BundleWritten"
kind = "input"
from = ["Sampled"]
to = "Written"
params = ["bundle_file_id", "summary", "author_agent_id"]
hint = "Writer self-reports the bundle. Parks in Written for the diversity gate (ADR-006); the gate, not the writer, starts repair."

[[action.triggers]]
name = "check_diversity_barrier"
kind = "entity"
principal = "system"
target_entity = "Endpoint"
target_action = "CheckDiversityBarrier"
[action.triggers.resolve_target]
type = "same_id"

# The session reports its bundle; only this declared system reaction enters
# deterministic cross-entity work with system authority.
[[action]]
name = "CheckDiversityBarrier"
kind = "input"
from = ["Written"]
to = "Written"
params = []
hint = "Check the all-written diversity barrier under the declared system principal."

[[action.triggers]]
name = "sample_endpoints"
kind = "wasm"
module = "sample_endpoints"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
embedding_endpoint = "{secret:embedding_endpoint}"
embedding_model = "{secret:embedding_model}"


# ADR-006: the diversity gate releases a world that survived the gate into
# repair. System-only (the gate dispatches it; the writer no longer does). The
# bundle was already recorded by BundleWritten.
[[action]]
name = "SubmitForRepair"
kind = "input"
from = ["Written"]
to = "UnderRepair"
params = []
hint = "Diversity gate released this endpoint into repair (ADR-006). Spawns decomposer then repairer sessions. System principals only."
effect = [{ type = "trigger", name = "decompose_endpoint" }]

[[action.triggers]]
name = "decompose_endpoint"
kind = "wasm"
module = "decompose_endpoint"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


# ADR-006: the diversity gate found this world too close to a sibling and sends
# it back to be rewritten with a brief to diverge. System-only. Re-enters
# sample_endpoints to re-spawn the writer with the differentiate brief.
[[action]]
name = "ReSteer"
kind = "input"
from = ["Written"]
to = "Sampled"
params = ["revision_brief"]
hint = "Diversity gate re-steers a collapsed world (ADR-006): rewrite to diverge from the named sibling. System principals only."
effect = [{ type = "trigger", name = "sample_endpoints" }]

[[action.triggers]]
name = "sample_endpoints"
kind = "wasm"
module = "sample_endpoints"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
embedding_endpoint = "{secret:embedding_endpoint}"
embedding_model = "{secret:embedding_model}"


# Self-heal (ADR-0050/ADR-007): the Sampled state_timeout fires this when a
# writer died mid-write. A self-loop (Sampled -> Sampled) that re-spawns the
# writer with the endpoint's existing stance and any revision_brief — the same
# spawn the gate's ReSteer uses, so it serves both the gate re-steer and the
# dead-writer recovery. System principals only (timeout-dispatched).
[[action]]
name = "ResumeWriter"
kind = "input"
from = ["Sampled"]
to = "Sampled"
params = []
hint = "Self-heal: re-spawn a dead/orphaned endpoint writer. Fires on the Sampled state_timeout. System principals only."

[[action.triggers]]
name = "enter_StartWriter"
kind = "entity"
principal = "system"
target_entity = "Endpoint"
target_action = "StartWriter"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "StartWriter"
kind = "input"
from = ["Sampled"]
to = "Sampled"
params = []
hint = "Protected deterministic recovery entry; invoked by the declared system trigger."

effect = [{ type = "trigger", name = "sample_endpoints" }]

[[action.triggers]]
name = "sample_endpoints"
kind = "wasm"
module = "sample_endpoints"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
embedding_endpoint = "{secret:embedding_endpoint}"
embedding_model = "{secret:embedding_model}"


# Self-heal (ADR-007): the UnderRepair state_timeout fires this when all claims
# on the endpoint are terminal but scoring never landed. System principals only.
[[action]]
name = "ResumeEndpointScoring"
kind = "input"
from = ["UnderRepair"]
to = "UnderRepair"
params = []
hint = "Self-heal: re-score an endpoint whose claims are all terminal but ScoreComplete never fired. Fires on the UnderRepair state_timeout."

[[action.triggers]]
name = "enter_EvaluateEndpointScoring"
kind = "entity"
principal = "system"
target_entity = "Endpoint"
target_action = "EvaluateEndpointScoring"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "EvaluateEndpointScoring"
kind = "input"
from = ["UnderRepair"]
to = "UnderRepair"
params = []
hint = "Protected deterministic recovery entry; invoked by the declared system trigger."

effect = [{ type = "trigger", name = "aggregate_costs_endpoint_scoring" }]

[[action.triggers]]
name = "aggregate_costs_endpoint_scoring"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "DecompositionComplete"
kind = "input"
from = ["UnderRepair"]
params = ["claims_json"]
hint = "Decomposer self-reports 3-8 separable load-bearing claims. Re-enters decompose_endpoint to create Claim entities and start the chunked bridge fan-out."

[[action.triggers]]
name = "enter_PrepareClaims"
kind = "entity"
principal = "system"
target_entity = "Endpoint"
target_action = "PrepareClaims"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "PrepareClaims"
kind = "input"
from = ["UnderRepair"]
to = "UnderRepair"
params = []
hint = "Enter deterministic corridor work through the declared system reaction."

[[action.triggers]]
name = "decompose_endpoint"
kind = "wasm"
module = "decompose_endpoint"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "SpawnNextBridge"
kind = "input"
from = ["UnderRepair"]
params = ["check_count"]
hint = "Bounded self-loop: dispatch SubmitForBridge for the next chunk of claims under session admission caps (ADR-0005: no Rust loops over sessions)."
effect = [{ type = "trigger", name = "decompose_endpoint" }]

[[action.triggers]]
name = "decompose_endpoint"
kind = "wasm"
module = "decompose_endpoint"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "ClaimsAttached"
kind = "input"
from = ["UnderRepair"]
params = ["claim_ids"]
hint = "Callback after Claim entities are created from claims_json. Starts the chunked bridge fan-out."
effect = [{ type = "trigger", name = "decompose_endpoint" }]

[[action.triggers]]
name = "decompose_endpoint"
kind = "wasm"
module = "decompose_endpoint"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "PathsAttached"
kind = "input"
from = ["UnderRepair"]
params = ["path_ids"]
hint = "Callback after repairer sessions are spawned and Path entities created."

[[action]]
name = "ScoreComplete"
kind = "input"
from = ["UnderRepair"]
to = "Scored"
params = ["weight"]
hint = "All paths for this endpoint scored; weight derived by aggregate_costs. System principals only."

[[action]]
name = "MarkWeighted"
kind = "input"
from = ["Scored"]
to = "Weighted"
params = []
hint = "Endpoint carries probability mass in the world's current solution."

[[action]]
name = "Reweigh"
kind = "input"
from = ["Weighted"]
to = "Scored"
params = ["weight"]
hint = "World update re-derived this endpoint's weight. System principals only."

[[action]]
name = "Discard"
kind = "input"
from = ["Sampled", "Written", "UnderRepair", "Scored", "Weighted"]
to = "Discarded"
params = ["discard_reason"]
hint = "Repair cost too high, the world moved away from this future, or the diversity gate gave up re-steering a persistent near-duplicate (ADR-006)."

[[action]]
name = "Fail"
kind = "input"
from = ["Sampled", "UnderRepair"]
to = "Failed"
params = ["error_message"]
hint = "Unrecoverable error during writing or repair."

# --- Invariants ---

[[invariant]]
name = "DiscardedIsFinal"
when = ["Discarded"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"
