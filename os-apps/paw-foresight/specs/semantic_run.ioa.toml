type = 'string'
initial = ''

[[state]]
name = 'gen_ai_parent_span_id'
type = 'string'
initial = ''

# App-owned bounded retries preserve the exploration checkpoint and prompt.
[[state]]
name = "reasoning_retry_count"
type = "counter"
initial = "0"

[[state]]
name = "last_retry_error"
type = "string"
initial = ""

[[state]]
name = "last_retry_session_id"
type = "string"
initial = ""

[[state]]
name = "resume_run_id"
type = "string"
initial = ""

[[action]]
name = "ReasoningRetry"
kind = "input"
from = ["Reasoning"]
to = "ReasoningSetup"
params = ["last_retry_error", "last_retry_session_id"]
guard = [{type="max_count",var="reasoning_retry_count",max=3}]
effect = [{type="increment",var="transition_count"},{type="increment",var="reasoning_retry_count"},{type="schedule",action="SpawnReasoning",delay_seconds=15}]

# Consume a trusted saved child's completed result without spawning another.
[[action]]
name = "ResumeReasoned"
kind = "input"
from = ["Preparing"]
to = "Expanding"
params = ["transition_count", "reasoning_phase_polls", "reasoning_retry_count", "reasoning_session_id", "reasoning_result", "world_id", "snapshot_json", "program_json", "trace_json", "started_at_ms", "agent_id", "model", "provider", "provider_options_json", "phase"]
effect = [{type="set_counter_from_param",var="transition_count",param="transition_count"},{type="set_counter_from_param",var="reasoning_phase_polls",param="reasoning_phase_polls"},{type="set_counter_from_param",var="reasoning_retry_count",param="reasoning_retry_count"},{type="increment",var="transition_count"}]
[[action.triggers]]
name = "semantic_expand"
kind = "wasm"
module = "semantic_expand"
on_failure = "Fail"
[action.triggers.config]
max_memory = "268435456"
max_fuel = "10000000000"

[[action]]
name = "ResumePrepared"
kind = "input"
from = ["Preparing"]
to = "Choosing"
params = ["reasoning_phase_polls", "world_id", "snapshot_json", "program_json", "trace_json", "started_at_ms", "agent_id", "model", "provider", "provider_options_json", "phase"]
effect = [{type="set_counter_from_param",var="reasoning_phase_polls",param="reasoning_phase_polls"},{type="increment",var="transition_count"}]
[[action.triggers]]
name = "semantic_step"
kind = "wasm"
module = "semantic_step"
on_failure = "Fail"
[action.triggers.config]
max_memory = "268435456"
max_fuel = "10000000000"


# Invalid composition is returned to the composer without repeating evaluation.
[[action]]
name = "CompositionRejected"
kind = "input"
from = ["Expanding"]
to = "ReasoningSetup"
params = ["program_json"]
effect = [{type="increment",var="transition_count"}]
[[action.triggers]]
name = "semantic_reasoning"
kind = "wasm"
module = "semantic_reasoning"
on_failure = "Fail"
[action.triggers.config]
max_memory = "268435456"
max_fuel = "10000000000"

# Conservative bound on this run's native causal chain; never reset on model retry.
[[state]]
name = "transition_count"
type = "counter"
initial = "0"

[[state]]
name = "reasoning_phase_polls"
type = "counter"
initial = "0"

[[state]]
name = "reasoning_progress_session_id"
type = "string"
initial = ""

[[state]]
name = "reasoning_progress_token"
type = "string"
initial = ""
