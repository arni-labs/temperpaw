# World — root of a scored world: one domain, one horizon, one living future.
#
# A World is built by the corridor (ADR-002): a surveyor records determined
# facts as EventNodes (the skeleton), endpoint writers produce documents
# native to the target date, repairers connect them backward to the skeleton,
# adversaries attack the repairs, and aggregate_costs weighs the surviving
# paths. Near-term claims implied by weighted paths are registered as
# Forecast entities; as reality resolves them the world updates and its
# artifacts are retconned.
#
# Lifecycle:
#   Configure (self-loop on Created) → Seed → (seed_world) → Seeding
#   → surveyor/bookmaker self-report SeedComplete → Active
#   → SampleEndpoints → (sample_endpoints) → endpoint writers spawn
#   → paths repair/challenge/score per Endpoint/Path machinery
#   → PathsScored → (register_forecasts) → forecasts preregistered
#   → IngestEvidence (event-driven; feeds resolve EventNodes)
#   → BeginUpdate when drift demands re-solving → Updating → UpdateComplete

[automaton]
name = "World"
states = ["Created", "Seeding", "Active", "Updating", "OpeningReplay", "RegisteringForecasts", "Archived", "Failed"]
initial = "Created"
strict_action_params = true

# ADR-0050/ADR-007: Created awaits human/agent configuration (no deadline by
# design). Active is the steady state of a living world — indefinite by
# definition, with the reconcile timeout below guarding missed aggregate flow.
# Seeding self-heals: a surveyor that completes or stalls without SeedComplete
# re-enters seed_world instead of wedging the world.
allow_indefinite_states = ["Created", "Active", "Updating"]

[[state_timeout]]
state = "Seeding"
after_seconds = 1200
on_timeout = "CheckResearchSession"
reset_on = ["SeedComplete", "Fail", "ResumeSeed", "ResearchSessionStarted", "ResearchPending", "ResearchIncomplete"]

# Self-heal (ADR-007): when every claim is terminal but canonical_path_id is still
# empty — e.g. the last claim resolved off the Bridging settle path (operator
# MarkUnreachable, or a wedged route) — re-run the world aggregate. reset_on
# PathsScored so a scored world is not re-polled.
[[state_timeout]]
state = "Active"
after_seconds = 600
on_timeout = "ResumeWorldCascade"
reset_on = ["PathsScored", "BeginUpdate"]

# --- State Variables ---

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "domain"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "horizon_months"
type = "string"
initial = ""

[[state]]
name = "target_date"
type = "string"
initial = ""

# Claims resolving before this date are scoreable (registered as Forecasts);
# beyond it the world is structured speculation. Maintained by evidence_ingest.
[[state]]
name = "frontier_date"
type = "string"
initial = ""

[[state]]
name = "corpus_file_id"
type = "string"
initial = ""

[[state]]
name = "graph_snapshot_file_id"
type = "string"
initial = ""

# Driver basis for endpoint sampling: paw-fs JSON of named drivers and the
# value spread the solver assigns across endpoint writers (anti-modal).
[[state]]
name = "driver_config_file_id"
type = "string"
initial = ""

# Lag-distribution table consulted by aggregate_costs (clock data).
[[state]]
name = "lag_table_file_id"
type = "string"
initial = ""

[[state]]
name = "endpoint_budget"
type = "string"
initial = "3"

[[state]]
name = "token_budget_cents"
type = "string"
initial = ""

[[state]]
name = "agent_model"
type = "string"
initial = ""

[[state]]
name = "agent_provider"
type = "string"
initial = ""

# Current surveyor session, recorded only by seed_world's trusted callback.
[[state]]
name = "research_session_id"
type = "string"
initial = ""

[[state]]
name = "research_session_attempt"
type = "string"
initial = ""

# Correlate callbacks with the Seed/ResumeSeed invocation that created them.
[[state]]
name = "research_attempt"
type = "counter"
initial = "0"

# Hindcast worlds run from a frozen past vantage: web tools are stripped from
# every spawned session and evidence_ingest reads only the frozen corpus.
[[state]]
name = "hindcast_mode"
type = "string"
initial = "false"

[[state]]
name = "skeleton_node_count"
type = "string"
initial = "0"

# ADR-006: the surveyor's named uncertainty axes — JSON array of
# {"axis": "...", "consensus_pole": "..."}. sample_endpoints assigns each
# anti-modal world a different named axis to invert, so the diverse worlds are
# distinct by construction (not just generic percentile stances).
[[state]]
name = "uncertainty_axes"
type = "string"
initial = "[]"

[[state]]
name = "canonical_path_id"
type = "string"
initial = ""

# The as-of date of the most recent evidence ingest. Supplied by the caller
# of IngestEvidence: WASM has no clock, so the date is data, not ambient time.
[[state]]
name = "last_ingest_date"
type = "string"
initial = ""

[[state]]
name = "update_cause_node_id"
type = "string"
initial = ""

# Living-worlds state (ADR-004 C4): cast personas, created dweller ids, and
# the bounded fan-out cursor for SpawnNextDweller.
[[state]]
name = "personas_json"
type = "string"
initial = "[]"

[[state]]
name = "dweller_ids"
type = "string"
initial = "[]"

[[state]]
name = "check_count"
type = "string"
initial = "0"

# ADR-006: how many diversity-gate rounds this pass has run. Bounds the
# re-steer loop — after the cap, the gate discards persistent near-duplicates
# rather than re-steering forever.
[[state]]
name = "gate_rounds"
type = "string"
initial = "0"

[[state]]
name = "last_adjudication_date"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["name", "domain", "description", "horizon_months", "target_date", "frontier_date", "corpus_file_id", "driver_config_file_id", "lag_table_file_id", "endpoint_budget", "token_budget_cents", "agent_model", "agent_provider", "hindcast_mode", "last_ingest_date"]
hint = "Configure world parameters. Self-loop on Created."

[[action]]
name = "Seed"
kind = "input"
from = ["Created"]
to = "Seeding"
params = []
hint = "Begin skeleton construction. Spawns surveyor and bookmaker sessions."
effect = [{ type = "increment", var = "research_attempt" }]

[[action.triggers]]
name = "start_seed_as_system"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartSeed"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "StartSeed"
kind = "input"
from = ["Seeding"]
params = []
hint = "The declared system flow creates the researcher after an operator requests Seed."

[[action.triggers]]
name = "seed_world"
kind = "wasm"
module = "seed_world"
on_success = "ResearchSessionStarted"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


# The configured session may already have completed before its spawn callback
# arrives. Preserve the current state, including terminal states.
[[action]]
name = "ResearchSessionStarted"
kind = "input"
from = ["Seeding", "Active", "Updating", "RegisteringForecasts", "Archived", "Failed"]
params = [{ name = "research_session_id", type = "string" }, { name = "expected_research_attempt", type = "counter" }, { name = "research_session_attempt", type = "string" }]
hint = "Record the exact surveyor Session returned by seed_world without changing world progress."
effect = [{type="schedule",action="CheckResearchSession",delay_seconds=15}]

[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_attempt"
field = "research_attempt"

[[action.constraints]]
kind = "param_nonempty"
param = "research_session_id"


[[action]]
name = "SeedComplete"
kind = "input"
from = ["Seeding"]
to = "Active"
params = ["skeleton_node_count", "graph_snapshot_file_id", "uncertainty_axes"]
hint = "Surveyor self-reports the skeleton is recorded plus the named uncertainty axes (ADR-006). World becomes active."

[[action.triggers]]
name = "start_requested_semantic_exploration"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartSemanticExploration"
guard = {type="bool_true",field="semantic_exploration_requested"}
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "ResumeSeed"
kind = "input"
from = ["Seeding", "Failed"]
to = "Seeding"
params = []
hint = "Explicitly continue saved research after an unfinished or failed attempt. Automatic terminal retries are bounded separately; Failed never retries itself. System principals only."
effect = [{type="set_bool",var="research_monitor_unavailable",value=false},{ type = "increment", var = "research_attempt" }, { type = "trigger", name = "seed_world" }]

[[action.triggers]]
name = "seed_world"
kind = "wasm"
module = "seed_world"
on_success = "ResearchSessionStarted"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "SampleEndpoints"
kind = "input"
from = ["Active"]
params = []
hint = "Start a corridor pass: spawn endpoint-writer sessions under assigned driver configurations."
effect = [{ type = "trigger", name = "sample_endpoints" }]

[[action.triggers]]
name = "sample_endpoints"
kind = "wasm"
module = "sample_endpoints"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


# ADR-006: the diversity gate. Dispatched by the all-written barrier (in
# sample_endpoints, on Endpoint.BundleWritten) once every endpoint has a
# bundle. Re-enters sample_endpoints to embed the written worlds, release the
# diverse ones into repair (Endpoint.SubmitForRepair) and re-steer the
# collapsed ones (Endpoint.ReSteer). gate_rounds bounds the loop. System only.
[[action]]
name = "GateDiversity"
kind = "input"
from = ["Active"]
params = ["gate_rounds"]
hint = "Run the diversity gate over the written worlds (ADR-006). System principals only."
effect = [{ type = "trigger", name = "sample_endpoints" }]

[[action.triggers]]
name = "sample_endpoints"
kind = "wasm"
module = "sample_endpoints"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
embedding_endpoint = "{secret:embedding_endpoint}"
embedding_model = "{secret:embedding_model}"


[[action]]
name = "EndpointsSampled"
kind = "input"
from = ["Active"]
params = []
hint = "Callback after endpoint writers are spawned. Corridor proceeds per Endpoint/Path machinery."

# Self-heal (ADR-007): the Active state_timeout fires this when all claims are
# terminal but canonical_path_id is still empty. Re-runs aggregate_costs'
# world cascade (ScoreComplete per endpoint + PathsScored). System principals
# only (timeout-dispatched).
[[action]]
name = "ResumeWorldCascade"
kind = "input"
from = ["Active", "RegisteringForecasts"]
params = []
hint = "Self-heal: re-run world aggregate when claims are settled but canonical_path_id is unset. Fires on the Active state_timeout."

[[action.triggers]]
name = "evaluate_world_after_recovery"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "EvaluateWorldCascade"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "EvaluateWorldCascade"
kind = "input"
from = ["Active", "RegisteringForecasts"]
params = []

[[action.triggers]]
name = "aggregate_costs_world_cascade"
kind = "wasm"
module = "aggregate_costs"
# A stale phase-fenced report must not fail newer exploration.
# Host failures remain recorded and the world timer can retry.

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "PathsScored"
kind = "input"
from = ["Active", "RegisteringForecasts"]
params = ["canonical_path_id", "exploration_phase", "expected_exploration_phase"]
constraints = [{kind="param_equals_field",param="expected_exploration_phase",field="exploration_phase"}]
hint = "The pass is evaluated. Publish its pending predictions before background deepening."
effect = [{type="set_bool",var="first_pass_complete",value=true},{type="set_bool",var="forecast_registration_pending",value=true}]

[[action.triggers]]
name = "start_requested_registration"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartForecastRegistration"
to_state = "Active"
guard = {type="bool_true", field="forecast_registration_pending"}
params = {forecast_registration_key=""}
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "IngestEvidence"
kind = "input"
from = ["Active"]
params = ["last_ingest_date"]
hint = "Pull evidence feeds, snapshot them to paw-fs, update EventNode probabilities, resolve due nodes, grade forecasts. The caller supplies the as-of date (last_ingest_date): WASM has no clock — the date is data."
effect = [{ type = "trigger", name = "evidence_ingest" }]

[[action.triggers]]
name = "evidence_ingest"
kind = "wasm"
module = "evidence_ingest"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "Render"
kind = "input"
from = ["Active"]
params = []
hint = "Spawn renderer/dweller sessions to draft artifacts from canonical and tail paths."
effect = [{ type = "trigger", name = "render_artifacts" }]

[[action.triggers]]
name = "render_artifacts"
kind = "wasm"
module = "render_artifacts"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "AnimateDwellers"
kind = "input"
from = ["Active"]
params = []
hint = "Spawn the casting session: 2-3 personas grounded in the settled claims. Dwellers traverse the canonical routes, file contradictions, and write first-person stories through the gate."
effect = [{ type = "trigger", name = "animate_dwellers" }]

[[action.triggers]]
name = "animate_dwellers"
kind = "wasm"
module = "animate_dwellers"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "DwellersCast"
kind = "input"
from = ["Active"]
params = ["personas_json"]
hint = "Casting session self-reports the proposed personas. Re-enters animate_dwellers to create Dweller entities and start the chunked traversal fan-out."
effect = [{ type = "trigger", name = "animate_dwellers" }]

[[action.triggers]]
name = "animate_dwellers"
kind = "wasm"
module = "animate_dwellers"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "SpawnNextDweller"
kind = "input"
from = ["Active"]
params = ["dweller_ids", "check_count"]
hint = "Bounded self-loop: spawn the next chunk of dweller sessions under admission caps (ADR-0005). dweller_ids is set on the first tick (from DwellersCast) and persists across re-ticks; Cedar permits this action but not a raw World PATCH, so the roster rides as a param."
effect = [{ type = "trigger", name = "animate_dwellers" }]

[[action.triggers]]
name = "animate_dwellers"
kind = "wasm"
module = "animate_dwellers"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "AdjudicateNodes"
kind = "input"
from = ["Active"]
params = ["last_adjudication_date"]
hint = "Judged resolution for overdue authored nodes (ADR-004 commitment 2): spawn adjudicator sessions with snapshotted evidence; the module validates verdicts and owns Resolve. The caller supplies the as-of date — WASM has no clock."
effect = [{ type = "trigger", name = "adjudicate_nodes" }]

[[action.triggers]]
name = "adjudicate_nodes"
kind = "wasm"
module = "adjudicate_nodes"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "BeginUpdate"
kind = "input"
from = ["Active"]
to = "Updating"
params = ["update_cause_node_id"]
hint = "Probability mass moved enough to demand re-solving. Cites the resolved EventNode that caused it."

[[action]]
name = "UpdateComplete"
kind = "input"
from = ["Updating"]
to = "Active"
params = ["canonical_path_id", "graph_snapshot_file_id"]
hint = "Re-solve finished: paths rescored, retcons dispatched, snapshot refreshed."

[[action]]
name = "Archive"
kind = "input"
from = ["Active"]
to = "Archived"
params = []
hint = "Retire the world. Read-only thereafter."

[[action]]
name = "Fail"
kind = "input"
from = ["Created", "Seeding", "Active", "Updating", "OpeningReplay", "RegisteringForecasts"]
to = "Failed"
params = ["error_message"]
hint = "Unrecoverable error."

# --- Invariants ---

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

[[state]]
name = "learning_mode"
type = "string"
initial = "observed"

[[state]]
name = "model_json"
type = "string"
initial = ""

[[state]]
name = "adopted_learning_run_id"
type = "string"
initial = ""

[[action]]
name = "ConfigureLearning"
kind = "input"
from = ["Created"]
to = "Created"
params = ["learning_mode"]

[[action]]
name = "OpenReplay"
kind = "input"
from = ["Created"]
to = "OpeningReplay"
params = ["learning_mode","domain","frontier_date","last_ingest_date"]

[[action.triggers]]
name = "replay_open"
kind = "wasm"
module = "replay_open"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ReplayOpened"
kind = "input"
from = ["OpeningReplay"]
to = "Active"
params = []

[[state_timeout]]
state="OpeningReplay"
after_seconds=120
on_timeout="Fail"
params={error_message="Replay world initialization did not complete within 120 seconds."}

# Multiple evaluated paths coalesce into one follow-up batch. World remains
# the sole registration writer; no worker can overlap its immutable commit loop.
[[state]]
name = "forecast_registration_pending"
type = "bool"
initial = "false"

[[state]]
name = "registration_attempt"
type = "counter"
initial = "0"

[[action]]
name = "RegisterForecasts"
kind = "input"
from = ["Active", "RegisteringForecasts"]
params = ["last_ingest_date"]
effect = [{type="set_bool",var="forecast_registration_pending",value=true}]

[[action.triggers]]
name = "start_requested_registration"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartForecastRegistration"
to_state = "Active"
guard = {type="bool_true", field="forecast_registration_pending"}
params = {forecast_registration_key=""}
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "RequestForecastRegistration"
kind = "input"
from = ["Active", "RegisteringForecasts"]
effect = [{type="set_bool",var="forecast_registration_pending",value=true}]

[[action.triggers]]
name = "start_requested_registration"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartForecastRegistration"
to_state = "Active"
guard = {type="bool_true", field="forecast_registration_pending"}
params = {forecast_registration_key=""}
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "StartForecastRegistration"
kind = "input"
from = ["Active"]
to = "RegisteringForecasts"
params = ["forecast_registration_key"]
guard = "is_true forecast_registration_pending"
effect = [{type="set_bool",var="forecast_registration_pending",value=false},{type="increment",var="registration_attempt"}]

[[action.triggers]]
name = "learning_register_forecasts"
kind = "wasm"
module = "register_forecasts"
# Module errors return an attempt-fenced callback. Host traps are handled by
# the state timeout: stale callback rejection must not compensate a newer batch.
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "AdoptModel"
kind = "input"
from = ["Active", "Updating", "RegisteringForecasts"]
params = ["expected_model_json","model_json","adopted_learning_run_id","learning_mode"]

[[action.constraints]]
kind="param_equals_field"
param="expected_model_json"
field="model_json"
[[action.constraints]]
kind="param_equals_field"
param="learning_mode"
field="learning_mode"

[[action.triggers]]
name = "confirm_model_adoption"
kind = "entity"
principal = "system"
target_entity = "LearningRun"
target_action = "ConfirmAdoption"

[action.triggers.resolve_target]
type = "field"
field = "adopted_learning_run_id"
[action.triggers.params_from]

# One durable pending registration; each committed Forecast advances the loop.

[[state]]
name = "forecast_id"
type = "string"
initial = ""

[[state]]
name = "forecast_registration_key"
type = "string"
initial = ""

[[state]]
name = "forecast_world_id"
type = "string"
initial = ""

[[state]]
name = "forecast_event_node_id"
type = "string"
initial = ""

[[state]]
name = "forecast_question"
type = "string"
initial = ""

[[state]]
name = "forecast_probability"
type = "string"
initial = ""

[[state]]
name = "forecast_base_probability"
type = "string"
initial = ""

[[state]]
name = "forecast_model_version"
type = "string"
initial = ""

[[state]]
name = "forecast_learning_run_id"
type = "string"
initial = ""

[[state]]
name = "forecast_previous_forecast_id"
type = "string"
initial = ""

[[state]]
name = "forecast_evidence_kind"
type = "string"
initial = ""

[[state]]
name = "forecast_resolve_by"
type = "string"
initial = ""

[[state]]
name = "forecast_market_ref"
type = "string"
initial = ""

[[state]]
name = "forecast_engine_version"
type = "string"
initial = ""

[[state]]
name = "forecast_registered_at"
type = "string"
initial = ""

# Candidate selection commits before the observed preregistration clock starts.
[[action]]
name = "RegistrationSnapshotPrepared"
kind = "input"
from = ["RegisteringForecasts"]
params = ["registration_nodes_json","registration_model_json","forecast_learning_run_id","forecast_registered_at","learning_mode","expected_registration_attempt"]
constraints = [{kind="param_equals_field",param="expected_registration_attempt",field="registration_attempt"}]
[[action.triggers]]
name = "commit_frozen_forecast_snapshot"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "CommitForecastSnapshot"
[action.triggers.resolve_target]
type = "same_id"
[action.triggers.params_from]
expected_registration_attempt = "registration_attempt"

[[action]]
name = "CommitForecastSnapshot"
kind = "input"
from = ["RegisteringForecasts"]
params = ["expected_registration_attempt"]
constraints = [{kind="param_equals_field",param="expected_registration_attempt",field="registration_attempt"}]
[[action.triggers]]
name = "prepare_frozen_forecasts"
kind = "wasm"
module = "register_forecasts"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ForecastPrepared"
kind = "input"
from = ["RegisteringForecasts"]
to = "RegisteringForecasts"
params = ["forecast_id", "forecast_registration_key", "forecast_world_id", "forecast_event_node_id", "forecast_question", "forecast_probability", "forecast_base_probability", "forecast_model_version", "forecast_learning_run_id", "forecast_previous_forecast_id", "forecast_evidence_kind", "forecast_resolve_by", "forecast_market_ref", "forecast_engine_version", "forecast_registered_at", "registration_model_json", "registration_nodes_json", "learning_mode", "expected_registration_attempt"]
constraints = [{kind="param_nonempty",param="forecast_id"},{kind="param_equals_field",param="expected_registration_attempt",field="registration_attempt"}]

[[action.triggers]]
name = "commit_forecast_registration"
kind = "entity"
principal = "system"
target_entity = "Forecast"
target_action = "Register"
[action.triggers.resolve_target]
type = "create_if_missing"
id_field = "forecast_id"
[action.triggers.params_from]
registration_key = "forecast_registration_key"
world_id = "forecast_world_id"
event_node_id = "forecast_event_node_id"
question = "forecast_question"
probability = "forecast_probability"
base_probability = "forecast_base_probability"
model_version = "forecast_model_version"
learning_run_id = "forecast_learning_run_id"
previous_forecast_id = "forecast_previous_forecast_id"
evidence_kind = "forecast_evidence_kind"
resolve_by = "forecast_resolve_by"
market_ref = "forecast_market_ref"
engine_version = "forecast_engine_version"
registered_at = "forecast_registered_at"

[[action]]
name = "ForecastRegistered"
kind = "input"
from = ["RegisteringForecasts"]
to = "RegisteringForecasts"
params = ["registration_key"]
constraints = [{kind="param_equals_field",param="registration_key",field="forecast_registration_key"}]

[[action.triggers]]
name = "prepare_next_forecast"
kind = "wasm"
module = "register_forecasts"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ForecastRegistrationComplete"
kind = "input"
from = ["RegisteringForecasts"]
to = "Active"
params = ["error_message", "learning_mode", "expected_registration_attempt"]
constraints = [{kind="param_equals_field",param="expected_registration_attempt",field="registration_attempt"}]

[[action.triggers]]
name = "start_requested_registration"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartForecastRegistration"
to_state = "Active"
guard = {type="bool_true", field="forecast_registration_pending"}
params = {forecast_registration_key=""}
[action.triggers.resolve_target]
type = "same_id"

[[action.triggers]]
name = "consider_background_deepening"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "MaybeDeepen"
guard = {type="all_of",guards=[{type="bool_false",field="forecast_registration_pending"},{type="bool_true",field="first_pass_complete"},{type="bool_false",field="deepening_started"}]}
[action.triggers.resolve_target]
type = "same_id"

[[state_timeout]]
state = "RegisteringForecasts"
after_seconds = 120
on_timeout = "ForecastRegistrationTimedOut"
reset_on = ["RegistrationSnapshotPrepared", "CommitForecastSnapshot", "ForecastPrepared", "ForecastRegistered"]
params = {error_message="Forecast registration did not complete within 120 seconds."}

# Frozen before the first Forecast.Register and retained throughout this batch.
[[state]]
name = "registration_model_json"
type = "string"
initial = ""

[[action]]
name = "ForecastRegistrationFailed"
kind = "input"
from = ["RegisteringForecasts"]
to = "Active"
params = ["error_message", "expected_registration_attempt"]
hint = "Registration did not finish; inspect the error, correct the replay clock or retry. Existing revisions are retained."
constraints = [{kind="param_equals_field",param="expected_registration_attempt",field="registration_attempt"}]


[[action.triggers]]
name = "start_queued_registration_after_recovery"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartForecastRegistration"
to_state = "Active"
guard = {type="bool_true", field="forecast_registration_pending"}
params = {forecast_registration_key=""}
[action.triggers.resolve_target]
type = "same_id"


# The host's sequence-checked state timer interrupts a trapped batch.
[[action]]
name = "ForecastRegistrationTimedOut"
kind = "input"
from = ["RegisteringForecasts"]
to = "Active"
params = ["error_message"]

[[action.triggers]]
name = "start_queued_registration_after_recovery"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "StartForecastRegistration"
to_state = "Active"
guard = {type="bool_true", field="forecast_registration_pending"}
params = {forecast_registration_key=""}
[action.triggers.resolve_target]
type = "same_id"


[[state]]
name = "first_pass_complete"
type = "bool"
initial = "false"

[[state]]
name = "exploration_phase"
type = "string"
initial = "first_pass"

[[state]]
name = "deepening_started"
type = "bool"
initial = "false"

[[state]]
name = "deepening_claim_ids"
type = "string"
initial = "[]"

[[state]]
name = "deepening_cursor"
type = "string"
initial = "0"

[[state]]
name = "deepening_claim_id"
type = "string"
initial = ""

[[action]]
name = "MaybeDeepen"
kind = "input"
from = ["Active"]
guard = [{type="is_false",var="forecast_registration_pending"},{type="is_true",var="first_pass_complete"},{type="is_false",var="deepening_started"}]
[[action.triggers]]
name = "check_first_pass_predictions"
kind = "wasm"
module = "aggregate_costs"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "BeginDeepening"
kind = "input"
from = ["Active"]
params = ["deepening_claim_ids","deepening_cursor","exploration_phase"]
guard = [{type="is_false",var="forecast_registration_pending"},{type="is_true",var="first_pass_complete"},{type="is_false",var="deepening_started"}]
effect = [{type="set_bool",var="deepening_started",value=true}]
[[action.triggers]]
name = "start_deepening"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "ContinueDeepening"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "ContinueDeepening"
kind = "input"
from = ["Active","RegisteringForecasts"]
guard = "is_true deepening_started"
[[action.triggers]]
name = "prepare_background_claim"
kind = "wasm"
module = "aggregate_costs"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "DeepeningClaimPrepared"
kind = "input"
from = ["Active","RegisteringForecasts"]
params = ["deepening_claim_id","deepening_cursor","expected_deepening_cursor"]
guard = "is_true deepening_started"
constraints = [{kind="param_nonempty",param="deepening_claim_id"},{kind="param_equals_field",param="expected_deepening_cursor",field="deepening_cursor"}]
[[action.triggers]]
name = "deepen_claim"
kind = "entity"
principal = "system"
target_entity = "Claim"
target_action = "BeginDeepening"
params = {settled_route_id=""}
[action.triggers.resolve_target]
type = "field"
field = "deepening_claim_id"
[[action.triggers]]
name = "next_deepening_claim"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "ContinueDeepening"
[action.triggers.resolve_target]
type = "same_id"

[[state]]
name = "registration_nodes_json"
type = "string"
initial = "[]"

# Chosen before research so comparison runs have explicit evaluator provenance.
[[state]]
name = "semantic_evaluation_mode"
type = "string"
initial = "off"

[[action]]
name = "ConfigureSemanticEvaluation"
kind = "input"
from = ["Created"]
to = "Created"
params = ["semantic_evaluation_mode"]
constraints = [{kind="param_nonempty",param="semantic_evaluation_mode"}]

[[state]]
name = "semantic_exploration_requested"
type = "bool"
initial = "false"

[[action]]
name = "RequestSemanticExploration"
kind = "input"
from = ["Created"]
params = []
effect = [{type="set_bool",var="semantic_exploration_requested",value=true}]

[[action]]
name = "StartSemanticExploration"
kind = "input"
from = ["Active"]
params = []
guard = "is_true semantic_exploration_requested"
effect = [{type="spawn",entity_type="SemanticRun",entity_id_source="{uuid}",initial_action="Start",copy_fields=""},{type="set_bool",var="semantic_exploration_requested",value=false}]

# Research terminal replies are not proof of the application's completion callback.
[[action]]
name = "CheckResearchSession"
kind = "input"
from = ["Seeding"]
guard = "is_false research_monitor_unavailable"
params = []
[[action.triggers]]
name = "seed_session"
kind = "wasm"
module = "seed_session"
on_failure = "ResearchMonitorInvocationFailed"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ResearchPending"
kind = "input"
from = ["Seeding"]
params = [{name="expected_research_attempt",type="counter"},{name="expected_research_session_id",type="string"},{name="error_message",type="string"}]
effect = [{type="schedule",action="CheckResearchSession",delay_seconds=15}]
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_attempt"
field = "research_attempt"
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_session_id"
field = "research_session_id"

[[action]]
name = "ResearchIncomplete"
kind = "input"
from = ["Seeding"]
to = "Seeding"
params = [{name="expected_research_attempt",type="counter"},{name="expected_research_session_id",type="string"},{name="error_message",type="string"},{name="research_session_attempt",type="string"}]
effect = [{type="increment",var="research_attempt"},{type="trigger",name="seed_world"}]
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_attempt"
field = "research_attempt"
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_session_id"
field = "research_session_id"
[[action.triggers]]
name = "seed_world"
kind = "wasm"
module = "seed_world"
on_success = "ResearchSessionStarted"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ResearchFailed"
kind = "input"
from = ["Seeding"]
to = "Failed"
params = [{name="expected_research_attempt",type="counter"},{name="expected_research_session_id",type="string"},{name="error_message",type="string"}]
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_attempt"
field = "research_attempt"
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_session_id"
field = "research_session_id"

# Losing observation is not evidence that the researcher failed.
[[state]]
name = "research_monitor_unavailable"
type = "bool"
initial = "false"

[[action]]
name = "ResearchMonitorUnavailable"
kind = "input"
from = ["Seeding"]
params = [{name="expected_research_attempt",type="counter"},{name="expected_research_session_id",type="string"},{name="error_message",type="string"}]
effect = [{type="set_bool",var="research_monitor_unavailable",value=true}]
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_attempt"
field = "research_attempt"
[[action.constraints]]
kind = "param_equals_field"
param = "expected_research_session_id"
field = "research_session_id"

# Host denials/traps precede the guest's fenced callback; they only disable observation.
[[action]]
name = "ResearchMonitorInvocationFailed"
kind = "input"
from = ["Seeding"]
params = ["error_message"]
effect = [{type="set_bool",var="research_monitor_unavailable",value=true}]
