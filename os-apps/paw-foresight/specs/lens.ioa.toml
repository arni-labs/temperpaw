# Lens — a projection of a world onto a consumer's concern surface.
#
# Deliberately minimal in 0.2: the vision-mode product (worlds → lens →
# decision diffs) is a later consumer of this engine. The entity exists now
# so the world graph is queried through a stable surface rather than ad hoc,
# and so decision injection has a governed home when it arrives.

[automaton]
name = "Lens"
states = ["Configured", "Live", "Archived"]
initial = "Configured"

# ADR-0050: a lens is a standing subscription — Live is indefinite by design.
allow_indefinite_states = ["Configured", "Live"]
terminal = ["Archived"]

# --- State Variables ---

[[state]]
name = "world_id"
type = "string"
initial = ""

[[state]]
name = "owner"
type = "string"
initial = ""

# paw-fs JSON: which strata, event families, and node neighborhoods this
# consumer cares about, at what resolution.
[[state]]
name = "concern_config_file_id"
type = "string"
initial = ""

[[state]]
name = "archive_reason"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Activate"
kind = "input"
from = ["Configured"]
to = "Live"
params = ["concern_config_file_id"]
hint = "Lens goes live; brief artifacts render against it."

[[action]]
name = "Reconfigure"
kind = "input"
from = ["Live"]
params = ["concern_config_file_id"]
hint = "Concern surface changed."

[[action]]
name = "Archive"
kind = "input"
from = ["Configured", "Live"]
to = "Archived"
params = ["archive_reason"]
hint = "Consumer is done with this lens."
