# Path — a corridor solution: the repaired history connecting one endpoint
# back to the world's skeleton.
#
# A repairer derives the intermediate events the endpoint requires (proposed
# as EventNodes), flagging every place it had to bend an actor against its
# incentives, compress a lag, or contradict the skeleton. An adversary then
# attacks the repair. aggregate_costs turns both sides' flags into a single
# deterministic repair cost — sessions never compute their own score.
#
# Repair → challenge loop:
#   (spawn_repairers creates Path in Solving)
#   → repairer self-reports RepairComplete with flags → (spawn_adversaries)
#   → adversary self-reports ChallengeComplete with flags → (aggregate_costs)
#   → Score (system) → ClassifyCanonical | ClassifyTail | Reject

[automaton]
name = "Path"
states = ["Solving", "Repaired", "Challenged", "Scored", "Canonical", "Tail", "Rejected", "Pruned", "Failed"]
initial = "Solving"

# ADR-0050: Solving/Repaired/Challenged now carry state_timeouts (below) that
# re-drive a dead session's work — self-healing corridors (ADR-007, Track D0):
# if a repairer/adversary session dies (or the server restarts mid-run), the
# timeout re-spawns rather than leaving the route orphaned. Scored/Canonical/
# Tail persist for the world's life and are re-scored on update (Rescore).
allow_indefinite_states = ["Scored", "Canonical", "Tail"]

# Self-heal timeouts. Budgets sit above a healthy session's wall-clock so a
# live route is never double-spawned; on restart the hydration re-arm
# (ADR-0056) fires overdue ones on the next dispatch.
[[state_timeout]]
state = "Solving"
after_seconds = 1200
on_timeout = "ResumeRepair"
reset_on = ["RevisionRequested"]

[[state_timeout]]
state = "Repaired"
after_seconds = 600
on_timeout = "RequestChallenge"

[[state_timeout]]
state = "Challenged"
after_seconds = 600
on_timeout = "ResumeCosting"

# --- State Variables ---

[[state]]
name = "world_id"
type = "string"
initial = ""

[[state]]
name = "endpoint_id"
type = "string"
initial = ""

# ADR-004: a Path is one ROUTE for one claim. route_index orders the routes
# a claim has tried; round_count counts revision rounds on this route;
# revision_brief carries the prior objections a search step must beat.
[[state]]
name = "claim_id"
type = "string"
initial = ""

[[state]]
name = "route_index"
type = "string"
initial = "0"

[[state]]
name = "round_count"
type = "string"
initial = "0"

[[state]]
name = "revision_brief"
type = "string"
initial = ""

[[state]]
name = "repairer_agent_id"
type = "string"
initial = ""

[[state]]
name = "adversary_agent_id"
type = "string"
initial = ""

[[state]]
name = "repair_log_file_id"
type = "string"
initial = ""

[[state]]
name = "challenge_log_file_id"
type = "string"
initial = ""

# JSON array of EventNode ids this path requires (proposed during repair).
[[state]]
name = "required_node_ids"
type = "string"
initial = "[]"

# JSON array of cost flags raised by the repairer during backward repair:
# [{"kind": "contradiction|incentive|lag|miracle", "severity": "low|medium|high", "note": "..."}]
[[state]]
name = "cost_flags"
type = "string"
initial = "[]"

# JSON array of cost flags raised by the adversary's attack (same shape).
# Kept separate so neither side can overwrite the other's flags; costing
# reads the union.
[[state]]
name = "challenge_flags"
type = "string"
initial = "[]"

[[state]]
name = "repair_cost"
type = "string"
initial = ""

[[state]]
name = "classification_note"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Actions ---

# Self-heal (ADR-007): re-spawn a dead repairer for this same route. Fired by
# the Solving state_timeout; spawns a fresh repairer session against the
# existing Path (no new route, no claim bookkeeping).
[[action]]
name = "ResumeRepair"
kind = "input"
from = ["Solving"]
to = "Solving"
params = []
hint = "Repairer session died or the server restarted; re-spawn for this route. System principals only."

[[action.triggers]]
name = "enter_StartRepair"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "StartRepair"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "ResumeCosting"
kind = "input"
from = ["Challenged"]
to = "Challenged"
params = []
hint = "Costing did not run after the challenge; re-trigger it. System principals only."

[[action.triggers]]
name = "enter_EvaluateChallenge"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "EvaluateChallenge"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "RepairComplete"
kind = "input"
from = ["Solving"]
to = "Repaired"
params = ["repair_log_file_id", "required_node_ids", "cost_flags"]
hint = "Repairer self-reports the backward route with its flags. Triggers the prune gate: routes already too expensive are cut before any adversary session is spent (ADR-004)."

[[action.triggers]]
name = "enter_evaluaterepair"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "EvaluateRepair"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "RequestChallenge"
kind = "input"
from = ["Repaired"]
params = []
hint = "Prune gate passed: spawn the adversary. System principals only."

[[action.triggers]]
name = "enter_startchallenge"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "StartChallenge"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "Prune"
kind = "input"
from = ["Repaired"]
to = "Pruned"
params = ["classification_note"]
hint = "Repairer-phase cost already exceeds what the claim's best route allows; cut before adversary spend. System principals only."

[[action.triggers]]
name = "enter_relayprunedroute"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "RelayPrunedRoute"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "RevisionRequested"
kind = "input"
from = ["Challenged"]
to = "Solving"
params = ["revision_brief", "round_count"]
hint = "An adversary objection was expensive and the round budget allows a revision: the repairer answers the specific objections on this same route. System principals only."

[[action.triggers]]
name = "enter_resumerepair"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "ResumeRepair"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "ChallengeComplete"
kind = "input"
from = ["Repaired"]
to = "Challenged"
params = ["challenge_log_file_id", "challenge_flags"]
hint = "Adversary self-reports its attack flags. Triggers deterministic costing over the union of both sides' flags."

[[action.triggers]]
name = "enter_evaluatechallenge"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "EvaluateChallenge"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "Score"
kind = "input"
from = ["Challenged"]
to = "Scored"
params = ["repair_cost"]
hint = "Deterministic cost from aggregate_costs. System principals only (Cedar). Triggers the world-wide classification check."

[[action.triggers]]
name = "enter_relayscoredroute"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "RelayScoredRoute"
[action.triggers.resolve_target]
type = "same_id"


[[action]]
name = "ClassifyCanonical"
kind = "input"
from = ["Scored", "Canonical", "Tail"]
to = "Canonical"
params = ["classification_note"]
hint = "Path carries the world's main probability mass. System principals only."


[[action.triggers]]
name = "publish_evaluated_path"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "RequestForecastRegistration"
[action.triggers.resolve_target]
type = "field"
field = "world_id"

[[action]]
name = "ClassifyTail"
kind = "input"
from = ["Scored", "Canonical", "Tail"]
to = "Tail"
params = ["classification_note"]
hint = "Coherent but improbable — fiction territory, with the receipts attached. System principals only."


[[action.triggers]]
name = "publish_evaluated_path"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "RequestForecastRegistration"
[action.triggers.resolve_target]
type = "field"
field = "world_id"

[[action]]
name = "Reject"
kind = "input"
from = ["Scored", "Canonical", "Tail"]
to = "Rejected"
params = ["classification_note"]
hint = "Repair cost beyond the world's tolerance. The endpoint loses this path."

[[action]]
name = "Rescore"
kind = "input"
from = ["Canonical", "Tail"]
to = "Scored"
params = ["repair_cost"]
hint = "World update re-derived this path's cost (a resolved EventNode moved the graph). System principals only."

[[action]]
name = "Fail"
kind = "input"
from = ["Solving", "Repaired", "Challenged"]
to = "Failed"
params = ["error_message"]
hint = "Unrecoverable error during repair or challenge."

# --- Invariants ---

[[invariant]]
name = "RejectedIsFinal"
when = ["Rejected"]
assert = "no_further_transitions"

# Pruned is a terminal route decision, but its protected RelayPrunedRoute
# action must still report that decision to the claim. That action preserves
# Pruned. The corridor contract test rejects any outgoing state change here;
# no_further_transitions would incorrectly forbid the required report itself.

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

# Entered only by the declared system trigger after its recorded predecessor.
[[action]]
name = "EvaluateRepair"
kind = "input"
from = ["Repaired"]
params = []
hint = "Evaluate the reported repair under the declared system principal."
effect = [{ type = "trigger", name = "aggregate_costs" }]

[[action.triggers]]
name = "aggregate_costs"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

# Entered only by the declared system trigger after its recorded predecessor.
[[action]]
name = "EvaluateChallenge"
kind = "input"
from = ["Challenged"]
params = []
hint = "Price the reported challenge under the declared system principal."
effect = [{ type = "trigger", name = "aggregate_costs" }]

[[action.triggers]]
name = "aggregate_costs"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

# Entered only by the declared system trigger after its recorded predecessor.
[[action]]
name = "RelayScoredRoute"
kind = "input"
from = ["Scored"]
params = []
hint = "Report the scored route to its claim under the declared system principal."
effect = [{ type = "trigger", name = "aggregate_costs" }]

[[action.triggers]]
name = "aggregate_costs"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

# Entered only by the declared system trigger after its recorded predecessor.
[[action]]
name = "RelayPrunedRoute"
kind = "input"
from = ["Pruned"]
params = []
hint = "Report the pruned route to its claim under the declared system principal."
effect = [{ type = "trigger", name = "aggregate_costs" }]

[[action.triggers]]
name = "aggregate_costs"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

# Entered only by the declared system trigger after its recorded predecessor.
[[action]]
name = "StartChallenge"
kind = "input"
from = ["Repaired"]
params = []
hint = "Freeze complete evidence before starting either evaluator."
[[action.triggers]]
name = "prepare_challenge"
kind = "wasm"
module = "prepare_challenge"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ChallengePrepared"
kind = "input"
from = ["Repaired"]
params = ["challenge_packet_json","challenge_packet_sha256","expected_repair_log_file_id"]
constraints = [{kind="param_equals_field",param="expected_repair_log_file_id",field="repair_log_file_id"},{kind="param_nonempty",param="challenge_packet_json"},{kind="param_nonempty",param="challenge_packet_sha256"}]
[[action.triggers]]
name = "enter_launchchallenge"
kind = "entity"
principal = "system"
target_entity = "Path"
target_action = "LaunchChallenge"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "LaunchChallenge"
kind = "input"
from = ["Repaired"]
params = []
effect = [
  { type = "trigger", name = "spawn_adversaries" },
  { type = "spawn", entity_type = "SemanticEvaluation", entity_id_source = "{uuid}", initial_action = "Evaluate", copy_fields = "world_id,endpoint_id,repair_log_file_id,required_node_ids,round_count,challenge_packet_json,challenge_packet_sha256" },
]
[[action.triggers]]
name = "spawn_adversaries"
kind = "wasm"
module = "spawn_adversaries"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "StartRepair"
kind = "input"
from = ["Solving"]
to = "Solving"
params = []
[[action.triggers]]
name = "spawn_repairers"
kind = "wasm"
module = "spawn_repairers"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[state]]
name = "challenge_packet_json"
type = "string"
initial = ""

[[state]]
name = "challenge_packet_sha256"
type = "string"
initial = ""
