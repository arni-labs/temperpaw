# Claim — one separable, load-bearing assertion of an imagined future.
#
# A decomposer session splits an endpoint's document bundle into three key claims
# (ADR-004). Each claim gets its own backward bridge: one or more Path
# routes, searched until a route settles cheap enough or the budget is
# spent. The claim's verdict is the cost of its cheapest surviving route.
#
# Amendment is never silent: the only way a claim's text changes is the
# AmendText action carrying the diff, and the amending repairer must flag
# the move as "deformation" so drifting back to consensus is priced
# (ADR-004 commitment 4). original_text is frozen at creation for audit.

[automaton]
name = "Claim"
states = ["Proposed", "Bridging", "Settled", "Unreachable", "Failed"]
initial = "Proposed"

# ADR-0050: Proposed and Bridging are bounded in practice by the session
# timeouts of decomposer/repairer agents plus the route/round counters that
# cap how much search a claim may consume; Settled persists for the life of
# the world (re-priced on evidence updates). Same posture as Endpoint;
# revisit with state_timeout once 0.3 run-time envelopes are measured.
allow_indefinite_states = ["Proposed", "Settled"]

# Self-heal (ADR-007): a Bridging claim whose routes all died gets re-evaluated
# so it settles or opens an alternate rather than hanging forever.
[[state_timeout]]
state = "Bridging"
after_seconds = 1800
on_timeout = "ResumeBridge"
reset_on = ["RouteSettled", "RoutesAttached", "AmendText"]

# --- State Variables ---

[[state]]
name = "world_id"
type = "string"
initial = ""

[[state]]
name = "endpoint_id"
type = "string"
initial = ""

# The claim as the decomposer extracted it. Never mutated after creation.
[[state]]
name = "original_text"
type = "string"
initial = ""

# The claim as currently bridged; differs from original_text only through
# AmendText. Empty means "same as original_text".
[[state]]
name = "current_text"
type = "string"
initial = ""

# JSON array of {old, new, justification, agent_id} entries, one per
# AmendText — the drift audit trail.
[[state]]
name = "amendment_log"
type = "string"
initial = "[]"

# Route bookkeeping (search budget guards, enforced by aggregate_costs).
[[state]]
name = "route_count"
type = "string"
initial = "0"

# JSON array of Path entity ids bridging this claim.
[[state]]
name = "path_ids"
type = "string"
initial = "[]"

# Alternate-route brief: when the costing module spawns another route, the
# standing objections the new repairer must beat (PATCHed by aggregate_costs
# before SubmitForBridge).
[[state]]
name = "revision_brief"
type = "string"
initial = ""

# Single-writer guard: set exactly once, by the costing module, when the
# claim settles (the per-claim analogue of World.canonical_path_id).
[[state]]
name = "settled_route_id"
type = "string"
initial = ""

[[state]]
name = "best_route_cost"
type = "string"
initial = ""

# "reachable" | "strained" | "unreachable" — deterministic classification
# of best_route_cost against the per-claim acceptability bound.
[[state]]
name = "classification"
type = "string"
initial = ""

[[state]]
name = "unreachable_reason"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "SubmitForBridge"
kind = "input"
from = ["Proposed", "Bridging"]
to = "Bridging"
params = ["revision_brief"]
hint = "Dispatched by decompose_endpoint for the first route, and by aggregate_costs for alternate routes (revision_brief carries the standing objections). Spawns a repairer route."

[[action.triggers]]
name = "enter_PrepareBridge"
kind = "entity"
principal = "system"
target_entity = "Claim"
target_action = "PrepareBridge"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "PrepareBridge"
kind = "input"
from = ["Bridging"]
to = "Bridging"
params = []
hint = "Enter deterministic corridor work through the declared system reaction."

[[action.triggers]]
name = "spawn_repairers"
kind = "wasm"
module = "spawn_repairers"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "RoutesAttached"
kind = "input"
from = ["Bridging"]
params = ["path_ids", "route_count"]
hint = "Callback after a repairer route is spawned and its Path entity created. System principals only."

[[action]]
name = "AmendText"
kind = "input"
from = ["Bridging"]
params = ["old_text", "new_text", "justification", "agent_id"]
hint = "The ONLY way a claim's text changes. Carries the diff; the amending repairer must also flag deformation on its route (ADR-004). Relayed session principals."

[[action]]
name = "ResumeBridge"
kind = "input"
from = ["Bridging"]
to = "Bridging"
params = []
hint = "Self-heal: re-evaluate this claim (routes may have died). Re-runs the claim decision deterministically. System principals only."

[[action.triggers]]
name = "enter_route_evaluation"
kind = "entity"
principal = "system"
target_entity = "Claim"
target_action = "EvaluateRoutes"
[action.triggers.resolve_target]
type = "same_id"

[[action]]
name = "RouteSettled"
kind = "input"
from = ["Bridging"]
params = ["path_id", "route_cost"]
hint = "A route finished costing. aggregate_costs decides: settle the claim, spawn an alternate route, or mark unreachable. System principals only."
effect = [{ type = "trigger", name = "aggregate_costs" }]

[[action.triggers]]
name = "aggregate_costs"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "Settle"
kind = "input"
from = ["Bridging"]
to = "Settled"
params = ["settled_route_id", "best_route_cost", "classification"]
hint = "Cheapest surviving route accepted. Single writer: aggregate_costs only."


[[action.triggers]]
name = "report_settled_claim"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "ResumeWorldCascade"
[action.triggers.resolve_target]
type = "field"
field = "world_id"

[[action]]
name = "Reprice"
kind = "input"
from = ["Settled"]
params = ["best_route_cost", "classification"]
hint = "Evidence invalidated a bridge node; costing re-ran from recorded flags. System principals only."

[[action]]
name = "MarkUnreachable"
kind = "input"
from = ["Bridging"]
to = "Unreachable"
params = ["unreachable_reason"]
hint = "Route budget exhausted with no route under the acceptability bound. An honest verdict, not an error."


[[action.triggers]]
name = "report_settled_claim"
kind = "entity"
principal = "system"
target_entity = "World"
target_action = "ResumeWorldCascade"
[action.triggers.resolve_target]
type = "field"
field = "world_id"

[[action]]
name = "Fail"
kind = "input"
from = ["Proposed", "Bridging"]
to = "Failed"
params = ["error_message"]
hint = "Unrecoverable error during decomposition or bridging."

# --- Invariants ---

# First-pass verdicts may reopen exactly once for bounded background exploration.
[[state]]
name = "deepening_started"
type = "bool"
initial = "false"

[[action]]
name = "BeginDeepening"
kind = "input"
from = ["Settled", "Unreachable"]
to = "Bridging"
params = ["settled_route_id"]
guard = "is_false deepening_started"
effect = [{ type = "set_bool", var = "deepening_started", value = true }]

[[action.triggers]]
name = "enter_background_bridge"
kind = "entity"
principal = "system"
target_entity = "Claim"
target_action = "PrepareBridge"
[action.triggers.resolve_target]
type = "same_id"


[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

[[action]]
name = "EvaluateRoutes"
kind = "input"
from = ["Bridging"]
params = []
[[action.triggers]]
name = "aggregate_costs"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
