# Brief -- Synthesized multi-perspective output.
#
# Produced by the synthesizer agent after all perspectives complete.
# Contains the synthesized content, surfacing emergent insights and tensions.
#
# Lifecycle: Draft -> Published -> Archived

[automaton]
name = "Brief"
states = ["Draft", "Published", "Archived"]
initial = "Draft"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Draft", "Published"]
terminal = ["Archived"]

# Parent deliberation
[[state]]
name = "deliberation_id"
type = "string"
initial = ""

# paw-fs File GUID of the brief content
[[state]]
name = "content_file_id"
type = "string"
initial = ""

# Short summary
[[state]]
name = "summary"
type = "string"
initial = ""

# How many perspectives were synthesized
[[state]]
name = "perspective_count"
type = "string"
initial = "0"

# --- Draft ---

[[action]]
name = "Draft"
kind = "input"
from = ["Draft"]
params = ["deliberation_id", "content_file_id", "summary", "perspective_count"]
hint = "Set brief content."

[[action]]
name = "Publish"
kind = "input"
from = ["Draft"]
to = "Published"
params = []
hint = "Publish the brief."

# --- Published ---

[[action]]
name = "Archive"
kind = "input"
from = ["Published"]
to = "Archived"
params = []
hint = "Archive the brief."
