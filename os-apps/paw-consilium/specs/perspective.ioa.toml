# Perspective -- Context-isolated viewpoint in a deliberation.
#
# Each perspective is generated independently — no perspective sees another's
# output during generation. This isolation is architecturally required.
#
# Lifecycle: Created -> Generating -> Complete | Failed

[automaton]
name = "Perspective"
states = ["Created", "Generating", "Complete", "Failed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Generating"]
terminal = ["Complete", "Failed"]

# Parent deliberation
[[state]]
name = "deliberation_id"
type = "string"
initial = ""

# What lens/role this perspective examines from
[[state]]
name = "role"
type = "string"
initial = ""

# LLM model for this perspective
[[state]]
name = "model"
type = "string"
initial = ""

# LLM provider
[[state]]
name = "provider"
type = "string"
initial = ""

# Temperature
[[state]]
name = "temperature"
type = "string"
initial = "1.0"

# Interpretive lens description
[[state]]
name = "lens"
type = "string"
initial = ""

# Session ID of the perspective agent
[[state]]
name = "session_id"
type = "string"
initial = ""

# paw-fs File GUID of the perspective output
[[state]]
name = "output_file_id"
type = "string"
initial = ""

# Error details
[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Created ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["deliberation_id", "role", "model", "provider", "temperature", "lens"]
hint = "Set perspective parameters."

[[action]]
name = "Begin"
kind = "input"
from = ["Created"]
to = "Generating"
params = ["session_id"]
hint = "Perspective agent has been spawned and is generating."

# --- Generating ---

[[action]]
name = "Complete"
kind = "input"
from = ["Generating"]
to = "Complete"
params = ["output_file_id"]
hint = "Perspective generation finished."

[[action]]
name = "Fail"
kind = "input"
from = ["Generating"]
to = "Failed"
params = ["error_message"]
hint = "Perspective generation failed."
