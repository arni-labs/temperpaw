# Deliberation -- Multi-perspective examination orchestrator.
#
# Convene creates N Perspective entities and N agent sessions from config_json.
# Each perspective agent gets the deliberate skill with its role+lens+knowledge.
# When all perspectives complete, a synthesizer agent produces the Brief.
#
# Config supports cross-model diversity: different entries can specify
# different providers (anthropic, openai, google, openrouter).
#
# Lifecycle: Created -> Convened -> Generating -> Synthesizing -> Complete | Failed

[automaton]
name = "Deliberation"
states = ["Created", "Convened", "Generating", "Synthesizing", "Complete", "Failed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Convened", "Generating", "Synthesizing"]
terminal = ["Complete", "Failed"]

# What the deliberation is about
[[state]]
name = "intent"
type = "string"
initial = ""

# paw-fs File GUID of the knowledge material to deliberate on
[[state]]
name = "knowledge_file_id"
type = "string"
initial = ""

# JSON array of perspective configs: [{ role, model, provider, temperature, lens }]
[[state]]
name = "config_json"
type = "string"
initial = "[]"

# How many perspectives were created
[[state]]
name = "perspective_count"
type = "string"
initial = "0"

# How many perspectives have completed
[[state]]
name = "perspectives_complete"
type = "string"
initial = "0"

# ID of the resulting Brief entity
[[state]]
name = "brief_id"
type = "string"
initial = ""

[[state]]
name = "synthesis_model"
type = "string"
initial = ""

[[state]]
name = "synthesis_provider"
type = "string"
initial = ""

# Error details
[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Created ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["intent", "knowledge_file_id", "config_json", "synthesis_model", "synthesis_provider"]
hint = "Set deliberation parameters."

[[action]]
name = "Convene"
kind = "input"
from = ["Created"]
to = "Convened"
params = []
hint = "Begin deliberation — triggers perspective fan-out."

# --- Convened (perspectives being spawned) ---

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "spawn_perspectives"
kind = "wasm"
module = "spawn_perspectives"
on_failure = "SpawnFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
odata_namespace = "Consilium"


[[action]]
name = "AllSpawned"
kind = "input"
from = ["Convened"]
to = "Generating"
params = ["perspective_count"]
hint = "All perspective agents have been spawned."

[[action]]
name = "SpawnFailed"
kind = "input"
from = ["Convened"]
to = "Failed"
params = ["error_message"]
hint = "Failed to spawn perspectives."

# --- Generating (perspectives working in parallel) ---

[[action]]
name = "PerspectiveComplete"
kind = "input"
from = ["Generating"]
params = ["perspectives_complete"]
hint = "A perspective finished. Triggers fan-in check."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "check_and_synthesize"
kind = "wasm"
module = "check_and_synthesize"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
odata_namespace = "Consilium"


[[action]]
name = "PerspectiveFailed"
kind = "input"
from = ["Generating"]
params = ["error_message"]
hint = "A perspective failed. Deliberation continues with remaining."

[[action]]
name = "BeginSynthesis"
kind = "input"
from = ["Generating"]
to = "Synthesizing"
params = []
hint = "All perspectives complete — synthesis agent spawned."

# --- Synthesizing ---

[[action]]
name = "SynthesisComplete"
kind = "input"
from = ["Synthesizing"]
to = "Complete"
params = ["brief_id"]
hint = "Brief has been produced."

[[action]]
name = "SynthesisFailed"
kind = "input"
from = ["Synthesizing"]
to = "Failed"
params = ["error_message"]
hint = "Synthesis failed."

# --- Integrations ---
