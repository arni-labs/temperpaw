# WebQuery — Execute web search or URL fetch as a governed, auditable entity.
#
# One entity type, two WASM modules:
#   - web_search: Exa API search (triggered by Execute when query_type = "search")
#   - web_fetch:  URL fetch + HTML stripping (triggered by Execute when query_type = "fetch")
#
# Agent usage (via dispatch wrappers):
#   temper.web_search("rust async patterns")
#   temper.web_fetch("https://docs.rs/serde_json/latest/serde_json/")

[automaton]
name = "WebQuery"
states = ["Created", "Executing", "Complete", "Failed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Executing"]
terminal = ["Complete", "Failed"]

# --- State Variables ---

[[state]]
name = "query_type"
type = "string"
initial = ""

[[state]]
name = "query"
type = "string"
initial = ""

[[state]]
name = "url"
type = "string"
initial = ""

[[state]]
name = "results"
type = "string"
initial = ""
overflow_ttl_seconds = 3600

[[state]]
name = "truncated_bytes"
type = "string"
initial = ""
# When web_fetch hits its 10MB upstream cap (WEB_FETCH_MAX_BYTES), the
# original response size is recorded here for observability. Empty means
# no truncation. temperpaw ADR-0033.

[[state]]
name = "error"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "ExecuteSearch"
kind = "input"
from = ["Created"]
to = "Executing"
params = ["query"]
hint = "Begin a web search query via Exa API."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "execute_search"
kind = "wasm"
module = "web_search"
on_failure = "RecordError"

[action.triggers.config]
exa_api_key = "{secret:exa_api_key}"


[[action]]
name = "ExecuteFetch"
kind = "input"
from = ["Created"]
to = "Executing"
params = ["url"]
hint = "Begin fetching a URL and extracting text content."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "execute_fetch"
kind = "wasm"
module = "web_fetch"
on_failure = "RecordError"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "RecordResults"
kind = "input"
from = ["Executing"]
to = "Complete"
params = ["results", "truncated_bytes"]
hint = "WASM module completed successfully; store results. `truncated_bytes` is non-empty when web_fetch hit its 10MB upstream cap."

[[action]]
name = "RecordError"
kind = "input"
from = ["Executing"]
to = "Failed"
params = ["error"]
hint = "WASM module encountered an error."

# --- Integrations ---
