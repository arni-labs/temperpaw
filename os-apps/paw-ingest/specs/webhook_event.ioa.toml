# WebhookEvent — Ingest, validate, route, and process an incoming webhook.
#
# Each authenticated event flows: Created → Routing → Processing → Processed.
# Failure at any stage transitions to Rejected.

[automaton]
name = "WebhookEvent"
states = ["Created", "Routing", "Processing", "Processed", "Rejected"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Routing", "Processing"]
terminal = ["Processed", "Rejected"]

[[state]]
name = "route_key"
type = "string"
initial = ""

[[state]]
name = "raw_payload"
type = "string"
initial = ""

[[state]]
name = "source_type"
type = "string"
initial = ""

[[state]]
name = "normalized_payload"
type = "string"
initial = ""

[[state]]
name = "authentication_scheme"
type = "string"
initial = ""

[[state]]
name = "delivery_id"
type = "string"
initial = ""

[[state]]
name = "payload_digest"
type = "string"
initial = ""

[[state]]
name = "route_snapshot_digest"
type = "string"
initial = ""

[[state]]
name = "target_entity_type"
type = "string"
initial = ""

[[state]]
name = "target_entity_id"
type = "string"
initial = ""

[[state]]
name = "target_action"
type = "string"
initial = ""

[[state]]
name = "webhook_route_id"
type = "string"
initial = ""

[[state]]
name = "monitor_resolution_enabled"
type = "string"
initial = "false"

[[state]]
name = "dedup_enabled"
type = "string"
initial = "false"

[[state]]
name = "dedup_window_minutes"
type = "string"
initial = "60"

[[state]]
name = "validation_error"
type = "string"
initial = ""

[[action]]
name = "Received"
kind = "input"
from = ["Created"]
to = "Routing"
params = ["raw_payload", "normalized_payload", "route_key", "source_type", "target_entity_type", "target_action", "webhook_route_id", "route_snapshot_digest", "payload_digest", "delivery_id", "authentication_scheme", "monitor_resolution_enabled", "dedup_enabled", "dedup_window_minutes"]
hint = "Record an authenticated immutable webhook envelope and begin routing."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "route_webhook"
kind = "wasm"
module = "route_webhook"
on_failure = "RouteFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "Routed"
kind = "input"
from = ["Routing"]
to = "Processing"
params = ["target_entity_type", "target_entity_id", "target_action", "webhook_route_id"]
hint = "Route resolved. Begin processing the webhook against the target entity."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "process_webhook"
kind = "wasm"
module = "process_webhook"
on_failure = "ProcessFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "Processed"
kind = "input"
from = ["Processing"]
to = "Processed"
hint = "Webhook processing completed successfully."

[[action]]
name = "RouteFailed"
kind = "input"
from = ["Routing"]
to = "Rejected"
params = ["validation_error"]
hint = "No matching route found or routing logic failed."

[[action]]
name = "ProcessFailed"
kind = "input"
from = ["Processing"]
to = "Rejected"
params = ["validation_error"]
hint = "Target entity action dispatch failed."
