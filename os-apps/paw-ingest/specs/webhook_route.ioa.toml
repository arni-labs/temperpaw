# WebhookRoute — Configuration entity mapping route keys to target entities.
#
# Each route defines how a specific webhook source is validated and
# which entity + action receives the normalized payload.

[automaton]
name = "WebhookRoute"
states = ["Active", "Disabled"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active", "Disabled"]

# Public route names are capability addresses and must be unique. The key also
# makes admission lookup bounded instead of falling back to a broad scan.
[[key]]
name = "route_key"
properties = ["RouteKey"]

[[state]]
name = "route_key"
type = "string"
initial = ""

[[state]]
name = "source_type"
type = "string"
initial = ""

[[state]]
name = "event_filter"
type = "string"
initial = ""

[[state]]
name = "target_entity_type"
type = "string"
initial = ""

[[state]]
name = "target_action"
type = "string"
initial = ""

[[state]]
name = "auth_scheme"
type = "string"
initial = "hmac-sha256"

[[state]]
name = "secret_ref"
type = "string"
initial = ""

[[state]]
name = "signature_header"
type = "string"
initial = "x-temper-signature"

[[state]]
name = "delivery_id_header"
type = "string"
initial = "x-temper-delivery-id"

[[state]]
name = "max_body_bytes"
type = "string"
initial = "262144"

[[state]]
name = "max_deliveries_per_minute"
type = "string"
initial = "120"

[[state]]
name = "monitor_resolution_enabled"
type = "string"
initial = "false"

[[state]]
name = "dedup_enabled"
type = "string"
initial = "false"

[[state]]
name = "dedup_window_minutes"
type = "string"
initial = "60"

[[action]]
name = "Register"
kind = "input"
from = ["Active"]
params = ["route_key", "source_type", "event_filter", "target_entity_type", "target_action", "auth_scheme", "secret_ref", "signature_header", "delivery_id_header", "max_body_bytes", "max_deliveries_per_minute", "monitor_resolution_enabled", "dedup_enabled", "dedup_window_minutes"]
hint = "Register or fully configure a webhook route."

[[action]]
name = "Update"
kind = "input"
from = ["Active"]
params = ["source_type", "event_filter", "target_entity_type", "target_action", "auth_scheme", "secret_ref", "signature_header", "delivery_id_header", "max_body_bytes", "max_deliveries_per_minute", "monitor_resolution_enabled", "dedup_enabled", "dedup_window_minutes"]
hint = "Update mutable fields on an active route."

[[action]]
name = "Disable"
kind = "input"
from = ["Active"]
to = "Disabled"
hint = "Disable the route so incoming webhooks are no longer matched."

[[action]]
name = "Enable"
kind = "input"
from = ["Disabled"]
to = "Active"
hint = "Re-enable a previously disabled route."
