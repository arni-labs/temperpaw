[automaton]
name = "SessionEvent"
states = ["Active"]
initial = "Active"

[[state]]
name = "session_id"
type = "string"
initial = ""

[[state]]
name = "sequence"
type = "counter"
initial = 0

[[state]]
name = "kind"
type = "string"
initial = ""

[[state]]
name = "content"
type = "string"
initial = ""

[[state]]
name = "observability_event"
type = "string"
initial = ""

[[state]]
name = "managed_session_id"
type = "string"
initial = ""

[[state]]
name = "inner_session_id"
type = "string"
initial = ""

[[state]]
name = "inner_agent_id"
type = "string"
initial = ""

[[state]]
name = "managed_agent_id"
type = "string"
initial = ""

[[state]]
name = "parent_session_id"
type = "string"
initial = ""

[[state]]
name = "environment_id"
type = "string"
initial = ""

[[state]]
name = "action_name"
type = "string"
initial = ""

[[state]]
name = "input"
type = "string"
initial = ""

[[state]]
name = "tool_use_id"
type = "string"
initial = ""

[[state]]
name = "confirmation_result"
type = "string"
initial = ""

[[state]]
name = "deny_message"
type = "string"
initial = ""

[[state]]
name = "custom_tool_use_id"
type = "string"
initial = ""

[[state]]
name = "tool_name"
type = "string"
initial = ""

[[state]]
name = "evaluated_permission"
type = "string"
initial = ""

[[state]]
name = "mcp_server_name"
type = "string"
initial = ""

[[state]]
name = "mcp_tool_use_id"
type = "string"
initial = ""

[[state]]
name = "stop_reason"
type = "string"
initial = ""

[[state]]
name = "termination_reason"
type = "string"
initial = ""

[[state]]
name = "stop_reason_event_ids"
type = "string"
initial = "[]"

[[state]]
name = "error_kind"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[field_invariant]]
name = "KindMustBeKnown"
message = "SessionEvent.Kind must be one of the managed-agents event kinds"
assert = "Kind != null => Kind in ['user.message', 'user.interrupt', 'user.tool_confirmation', 'user.custom_tool_result', 'agent.message', 'agent.thinking', 'agent.tool_use', 'agent.tool_result', 'agent.mcp_tool_use', 'agent.mcp_tool_result', 'agent.custom_tool_use', 'session.status_rescheduling', 'session.status_running', 'session.status_idle', 'session.status_terminated']"

[[field_invariant]]
name = "UserToolConfirmationRequiresToolUseId"
message = "user.tool_confirmation must reference ToolUseId"
assert = "Kind == 'user.tool_confirmation' => !empty(ToolUseId)"

[[field_invariant]]
name = "UserToolConfirmationRequiresResult"
message = "user.tool_confirmation must set ConfirmationResult"
assert = "Kind == 'user.tool_confirmation' => !empty(ConfirmationResult)"

[[field_invariant]]
name = "UserCustomToolResultRequiresCustomToolUseId"
message = "user.custom_tool_result must reference CustomToolUseId"
assert = "Kind == 'user.custom_tool_result' => !empty(CustomToolUseId)"

[[field_invariant]]
name = "AgentToolUseRequiresName"
message = "agent.tool_use must set ToolName"
assert = "Kind == 'agent.tool_use' => !empty(ToolName)"

[[field_invariant]]
name = "AgentToolResultRequiresToolUseId"
message = "agent.tool_result must reference ToolUseId"
assert = "Kind == 'agent.tool_result' => !empty(ToolUseId)"

[[field_invariant]]
name = "AgentMcpToolUseRequiresServerAndTool"
message = "agent.mcp_tool_use must set McpServerName and ToolName"
assert = "Kind == 'agent.mcp_tool_use' => !empty(McpServerName) && !empty(ToolName)"

[[field_invariant]]
name = "AgentMcpToolResultRequiresMcpToolUseId"
message = "agent.mcp_tool_result must reference McpToolUseId"
assert = "Kind == 'agent.mcp_tool_result' => !empty(McpToolUseId)"

[[field_invariant]]
name = "AgentCustomToolUseRequiresName"
message = "agent.custom_tool_use must set ToolName"
assert = "Kind == 'agent.custom_tool_use' => !empty(ToolName)"

[[field_invariant]]
name = "ConfirmationResultMustBeKnown"
message = "ConfirmationResult must be allow or deny"
assert = "ConfirmationResult != null => ConfirmationResult in ['allow', 'deny']"

[[field_invariant]]
name = "EvaluatedPermissionMustBeKnown"
message = "EvaluatedPermission must be allow, ask, or deny"
assert = "EvaluatedPermission != null => EvaluatedPermission in ['allow', 'ask', 'deny']"

[[field_invariant]]
name = "IdleRequiresStopReason"
message = "session.status_idle must set StopReason"
assert = "Kind == 'session.status_idle' => !empty(StopReason)"

[[field_invariant]]
name = "StopReasonMustBeKnown"
message = "SessionEvent.StopReason must be one of the documented idle reasons"
assert = "StopReason != null => StopReason in ['user_input_required', 'tool_confirmation_required', 'custom_tool_required']"

[[field_invariant]]
name = "ConfirmationOrCustomIdleRequiresEventIds"
message = "session.status_idle with confirmation/custom tool stop reason must set StopReasonEventIds"
assert = "Kind == 'session.status_idle' && StopReason in ['tool_confirmation_required', 'custom_tool_required'] => !empty(StopReasonEventIds)"

[[field_invariant]]
name = "TerminatedRequiresTerminationReason"
message = "session.status_terminated must set TerminationReason"
assert = "Kind == 'session.status_terminated' => !empty(TerminationReason)"

[[field_invariant]]
name = "TerminationReasonMustBeKnown"
message = "SessionEvent.TerminationReason must be cancelled or error"
assert = "TerminationReason != null => TerminationReason in ['cancelled', 'error']"

[[field_invariant]]
name = "ErrorFieldsRequireSessionEventKinds"
message = "ErrorKind is currently only used on idle error events"
assert = "!empty(ErrorKind) => Kind == 'session.status_idle'"
