[automaton]
name = "AgentTool"
states = ["Active"]
initial = "Active"

[[state]]
name = "agent_id"
type = "string"
initial = ""

[[state]]
name = "kind"
type = "string"
initial = ""

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "input_schema"
type = "string"
initial = ""

[[state]]
name = "input"
type = "string"
initial = ""

[[state]]
name = "mcp_server_name"
type = "string"
initial = ""

[[field_invariant]]
name = "KindMustBeKnown"
message = "AgentTool.Kind must be agent_toolset_20260401, mcp_toolset, or custom"
assert = "Kind != null => Kind in ['agent_toolset_20260401', 'mcp_toolset', 'custom']"

[[field_invariant]]
name = "CustomToolRequiresName"
message = "custom AgentTool rows must define Name"
assert = "Kind == 'custom' => !empty(Name)"

[[field_invariant]]
name = "CustomToolRequiresDescription"
message = "custom AgentTool rows must define Description"
assert = "Kind == 'custom' => !empty(Description)"

[[field_invariant]]
name = "CustomToolRequiresInputSchema"
message = "custom AgentTool rows must define InputSchema"
assert = "Kind == 'custom' => !empty(InputSchema)"

[[field_invariant]]
name = "McpToolsetRequiresServerName"
message = "mcp_toolset AgentTool rows must define McpServerName"
assert = "Kind == 'mcp_toolset' => !empty(McpServerName)"

[[field_invariant]]
name = "AgentToolsetForbidsKindSpecificFields"
message = "agent_toolset_20260401 rows must not set custom or MCP-only fields"
assert = "Kind == 'agent_toolset_20260401' => Name == null && Description == null && InputSchema == null && McpServerName == null"
