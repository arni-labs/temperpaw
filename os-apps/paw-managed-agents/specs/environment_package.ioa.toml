[automaton]
name = "EnvironmentPackage"
states = ["Active"]
initial = "Active"

[[state]]
name = "environment_id"
type = "string"
initial = ""

[[state]]
name = "manager"
type = "string"
initial = ""

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "version"
type = "string"
initial = ""

[[field_invariant]]
name = "ManagerMustBeKnown"
message = "EnvironmentPackage.Manager must be one of the supported package managers"
assert = "Manager != null => Manager in ['pip', 'npm', 'apt', 'cargo', 'gem', 'go']"
