[automaton]
name = "AgentMcpServer"
states = ["Active"]
initial = "Active"

[[state]]
name = "agent_id"
type = "string"
initial = ""

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "server_type"
type = "string"
initial = "url"

[[state]]
name = "url"
type = "string"
initial = ""

[[field_invariant]]
name = "ServerTypeMustBeUrl"
message = "AgentMcpServer.ServerType must be url"
assert = "ServerType != null => ServerType == 'url'"
