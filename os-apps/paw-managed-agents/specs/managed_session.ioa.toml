[automaton]
name = "ManagedSession"
states = ["Rescheduling", "Running", "Idle", "Terminated"]
initial = "Rescheduling"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Rescheduling", "Running", "Idle", "Terminated"]

[[state]]
name = "title"
type = "string"
initial = ""

[[state]]
name = "agent_id"
type = "string"
initial = ""

[[state]]
name = "parent_session_id"
type = "string"
initial = ""

[[state]]
name = "environment_id"
type = "string"
initial = ""

[[state]]
name = "inner_session_id"
type = "string"
initial = ""

[[state]]
name = "inner_agent_id"
type = "string"
initial = ""

[[state]]
name = "vault_ids"
type = "string"
initial = "[]"

[[state]]
name = "stop_reason"
type = "string"
initial = ""

[[state]]
name = "termination_reason"
type = "string"
initial = ""

[[state]]
name = "stop_reason_event_ids"
type = "string"
initial = "[]"

[[state]]
name = "input_tokens"
type = "counter"
initial = 0

[[state]]
name = "output_tokens"
type = "counter"
initial = 0

[[state]]
name = "last_consumed_user_sequence"
type = "counter"
initial = 0

[[state]]
name = "last_emitted_result_hash"
type = "string"
initial = ""

[[state]]
name = "last_emitted_inner_session_id"
type = "string"
initial = ""

[[state]]
name = "last_emitted_tree_index"
type = "counter"
initial = 0

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "inner_session_check_count"
type = "counter"
initial = 0

[[state]]
name = "max_inner_session_checks"
type = "string"
initial = "180"

[[state]]
name = "metadata"
type = "string"
initial = "{}"

[[state]]
name = "archived_at"
type = "string"
initial = ""

[[action]]
name = "StartSession"
kind = "input"
from = ["Rescheduling"]
to = "Running"
hint = "Create or resume the bridged TemperPaw session and begin processing."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "orchestrate_start"
kind = "wasm"
module = "session_orchestrator"

[action.triggers.config]
mode = "start"
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "InnerSessionReady"
kind = "input"
from = ["Running"]
params = ["InnerSessionId", "InnerAgentId", "LastConsumedUserSequence", "InnerSessionCheckCount"]
hint = "Record the ids used for the bridged session."
effect = ["schedule('CheckInnerSession', 2)"]

[[action]]
name = "InnerSessionFailed"
kind = "input"
from = ["Running"]
to = "Terminated"
params = ["ErrorMessage", "TerminationReason"]
hint = "Record an inner-session failure and terminate the managed session."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "terminate_inner"
kind = "wasm"
module = "session_terminator"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "IdleSession"
kind = "input"
from = ["Running"]
to = "Idle"
params = ["StopReason"]
hint = "Mark the managed session idle and emit derived session events."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "emit_idle_event"
kind = "wasm"
module = "event_emitter"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "ResumeSession"
kind = "input"
from = ["Idle"]
to = "Running"
hint = "Resume an idle managed session with any pending user input."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "orchestrate_resume"
kind = "wasm"
module = "session_orchestrator"

[action.triggers.config]
mode = "resume"
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "InnerSessionPending"
kind = "input"
from = ["Running"]
hint = "The bridged TemperPaw session is still running. Re-check shortly."
effect = ["inner_session_check_count += 1", "schedule('CheckInnerSession', 2)"]

[[action]]
name = "CheckInnerSession"
kind = "input"
from = ["Running"]
hint = "Poll the bridged TemperPaw session state through a bounded self-loop."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "orchestrate_check"
kind = "wasm"
module = "session_orchestrator"

[action.triggers.config]
mode = "check"
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "UpdateUsage"
kind = "input"
from = ["Running", "Idle"]
params = ["InputTokens", "OutputTokens", "StopReason", "StopReasonEventIds", "LastEmittedResultHash", "LastEmittedInnerSessionId", "LastEmittedTreeIndex"]
hint = "Update token counters and derived event metadata."
effect = ["input_tokens += 1", "output_tokens += 1"]

[[action]]
name = "TerminateSession"
kind = "input"
from = ["Rescheduling", "Running", "Idle"]
to = "Terminated"
params = ["TerminationReason"]
hint = "Terminate the bridged session."

[[action.triggers]]
name = "terminate_inner"
kind = "wasm"
module = "session_terminator"
config = { temper_api_url = "{secret:temper_api_url}" }

[[action]]
name = "Archive"
kind = "input"
from = ["Terminated"]
to = "Terminated"
params = ["ArchivedAt"]
hint = "Soft-delete this managed session while retaining its status history."

[[field_invariant]]
name = "IdleRequiresStopReason"
message = "ManagedSession in Idle must set StopReason"
assert = "Status == 'Idle' => !empty(stop_reason) || !empty(StopReason)"

[[field_invariant]]
name = "StopReasonMustBeKnown"
message = "ManagedSession.StopReason must be one of the documented pause reasons"
assert = "stop_reason != null || StopReason != null => stop_reason == 'user_input_required' || stop_reason == 'tool_confirmation_required' || stop_reason == 'custom_tool_required' || StopReason == 'user_input_required' || StopReason == 'tool_confirmation_required' || StopReason == 'custom_tool_required'"

[[field_invariant]]
name = "TerminationReasonMustBeKnown"
message = "ManagedSession.TerminationReason must be cancelled or error"
assert = "termination_reason != null || TerminationReason != null => termination_reason == 'cancelled' || termination_reason == 'error' || TerminationReason == 'cancelled' || TerminationReason == 'error'"

[[field_invariant]]
name = "TerminatedRequiresTerminationReason"
message = "ManagedSession in Terminated must set TerminationReason"
assert = "Status == 'Terminated' => !empty(termination_reason) || !empty(TerminationReason)"

[[field_invariant]]
name = "ArchivedAtRequiresTerminatedStatus"
message = "ManagedSession.ArchivedAt may only be set once the session is Terminated"
assert = "!empty(archived_at) || !empty(ArchivedAt) => Status == 'Terminated'"
