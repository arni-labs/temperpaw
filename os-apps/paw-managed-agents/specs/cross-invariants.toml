version = 1
default_delete_policy = "restrict"

[[invariant]]
name = "SessionRequiresActiveManagedAgent"
kind = "hard"
on = "ManagedSession.*"
assert = 'related(ManagedAgent, AgentId).status not in ["Archived"]'

[[invariant]]
name = "SessionRequiresActiveEnvironment"
kind = "hard"
on = "ManagedSession.*"
assert = 'related(ManagedEnvironment, EnvironmentId).status not in ["Archived"]'

# Callers outside the kernel cannot add events to a terminated session. The
# session.status_terminated event itself is written by the session_terminator
# module after TerminateSession, and the kernel does not hold its own
# follow-ons to this rule, so the assertion needs no exception for it (the
# assertion grammar has no `or`).
[[invariant]]
name = "EventRequiresNonArchivedManagedSession"
kind = "hard"
on = "SessionEvent.*"
assert = 'related(ManagedSession, SessionId).status not in ["Terminated"]'

[[invariant]]
name = "ResourceRequiresNonArchivedManagedSession"
kind = "hard"
on = "SessionResource.*"
assert = 'related(ManagedSession, SessionId).status not in ["Terminated"]'

[[invariant]]
name = "McpServerRequiresActiveManagedAgent"
kind = "hard"
on = "AgentMcpServer.*"
assert = 'related(ManagedAgent, AgentId).status not in ["Archived"]'

[[invariant]]
name = "SkillRequiresActiveManagedAgent"
kind = "hard"
on = "AgentSkill.*"
assert = 'related(ManagedAgent, AgentId).status not in ["Archived"]'

[[invariant]]
name = "ToolRequiresActiveManagedAgent"
kind = "hard"
on = "AgentTool.*"
assert = 'related(ManagedAgent, AgentId).status not in ["Archived"]'

[[invariant]]
name = "PackageRequiresActiveEnvironment"
kind = "hard"
on = "EnvironmentPackage.*"
assert = 'related(ManagedEnvironment, EnvironmentId).status not in ["Archived"]'
