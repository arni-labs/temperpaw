[automaton]
name = "SessionResource"
states = ["Active"]
initial = "Active"

[[state]]
name = "session_id"
type = "string"
initial = ""

[[state]]
name = "kind"
type = "string"
initial = ""

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "mount_path"
type = "string"
initial = ""

[[state]]
name = "repository_url"
type = "string"
initial = ""

[[state]]
name = "branch"
type = "string"
initial = ""

[[state]]
name = "file_id"
type = "string"
initial = ""

[[state]]
name = "auth_token"
type = "string"
initial = ""

[[field_invariant]]
name = "KindMustBeKnown"
message = "SessionResource.Kind must be github_repository or file"
assert = "Kind != null => Kind in ['github_repository', 'file']"

[[field_invariant]]
name = "GitHubResourceRequiresUrl"
message = "github_repository SessionResource rows must set RepositoryUrl"
assert = "Kind == 'github_repository' => !empty(RepositoryUrl)"

[[field_invariant]]
name = "GitHubResourceRequiresMountPath"
message = "github_repository SessionResource rows must set MountPath"
assert = "Kind == 'github_repository' => !empty(MountPath)"

[[field_invariant]]
name = "FileResourceRequiresFileId"
message = "file SessionResource rows must set FileId"
assert = "Kind == 'file' => !empty(FileId)"

[[field_invariant]]
name = "FileResourceRequiresMountPath"
message = "file SessionResource rows must set MountPath"
assert = "Kind == 'file' => !empty(MountPath)"
