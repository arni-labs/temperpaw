# WikiJob -- Task queue entry for wiki agent sessions.
#
# Jobs represent discrete units of work dispatched by a consuming app's
# agent. The session does the semantic work; the WikiJob tracks durable
# workflow state, ownership, and outputs.
#
# Lifecycle: Queued -> Ready -> Running -> Completed | Failed
#
# Submit triggers the build_session_message WASM which constructs a
# domain-specific prompt and spawns an agent session.

[automaton]
name = "WikiJob"
states = ["Queued", "Ready", "Running", "Completed", "Failed"]
initial = "Queued"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Queued", "Ready", "Running"]
terminal = ["Completed", "Failed"]

# Job classification (consuming app decides values)
[[state]]
name = "job_type"
type = "string"
initial = ""

# Which scope's wiki this job operates on
[[state]]
name = "scope_id"
type = "string"
initial = ""

# Shared workspace root for this wiki run
[[state]]
name = "workspace_id"
type = "string"
initial = ""

# JSON: what to do (search queries, source IDs, page IDs, scope, etc.)
[[state]]
name = "input"
type = "string"
initial = "{}"

# JSON: what happened (pages created, issues found, sources indexed, etc.)
[[state]]
name = "output"
type = "string"
initial = "{}"

# JSON array of incremental progress entries
[[state]]
name = "progress_log"
type = "string"
initial = "[]"

# Error details if job failed
[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Session spawning fields ---

# Soul to use for the agent session (empty = consuming app decides)
[[state]]
name = "soul_id"
type = "string"
initial = ""

# LLM model identifier
[[state]]
name = "model"
type = "string"
initial = ""

# LLM provider
[[state]]
name = "provider"
type = "string"
initial = ""

# Temperature for LLM calls
[[state]]
name = "temperature"
type = "string"
initial = "1.0"

# Comma-separated tool list for the session
[[state]]
name = "tools_enabled"
type = "string"
initial = "temper_get,temper_list,temper_create,temper_action,temper_write,temper_read,temper_web_search,temper_web_fetch"

# Maximum conversation turns
[[state]]
name = "max_turns"
type = "string"
initial = "250"

# Constructed prompt for the session (built by WASM)
[[state]]
name = "user_message"
type = "string"
initial = ""

# ID of the spawned agent session
[[state]]
name = "session_id"
type = "string"
initial = ""

# --- Queued ---

[[action]]
name = "Configure"
kind = "input"
from = ["Queued"]
params = ["job_type", "scope_id", "workspace_id", "input", "soul_id", "model", "provider", "temperature", "tools_enabled", "max_turns"]
hint = "Set or update job parameters before execution."

[[action]]
name = "Submit"
kind = "input"
from = ["Queued"]
to = "Ready"
hint = "Validate and prepare job for execution. Triggers message builder WASM."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "build_session_message"
kind = "wasm"
module = "build_session_message"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
odata_namespace = "WikiCore"


[[action]]
name = "Start"
kind = "input"
from = ["Queued"]
to = "Running"
params = []
hint = "Begin executing this job (direct start without session spawning)."

# --- Ready (session spawned, waiting for confirmation) ---

[[action]]
name = "SessionSpawned"
kind = "input"
from = ["Ready"]
to = "Running"
params = ["session_id", "workspace_id"]
hint = "Session has been created, attached to the shared workspace, and is running."

# --- Running ---

[[action]]
name = "RecordProgress"
kind = "input"
from = ["Running"]
params = ["progress_log"]
hint = "Append incremental progress entries during execution."

[[action]]
name = "Complete"
kind = "input"
from = ["Running"]
to = "Completed"
params = ["output"]
hint = "Mark job as successfully completed with output summary."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "finalize_spawned_session"
kind = "wasm"
module = "finalize_spawned_session"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
odata_namespace = "WikiCore"


[[action]]
name = "Fail"
kind = "input"
from = ["Ready", "Running"]
to = "Failed"
params = ["error_message"]
hint = "Mark job as failed with error details."

[[action.triggers]]
name = "finalize_spawned_session"
kind = "wasm"
module = "finalize_spawned_session"
config = { temper_api_url = "{secret:temper_api_url}", odata_namespace = "WikiCore" }

# --- Integrations ---
