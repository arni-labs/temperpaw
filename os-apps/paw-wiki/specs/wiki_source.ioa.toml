# WikiSource -- Raw material submitted for processing into wiki pages.
#
# A source can be a web article, document, reference material, file
# download, or any raw input. The consuming app's agent indexes sources
# by extracting topics and tracking which wiki pages were derived.
#
# Lifecycle: Submitted -> Indexed | Failed
#
# No WASM integrations; the consuming app's agent dispatches all actions.

[automaton]
name = "WikiSource"
states = ["Submitted", "Indexed", "Failed"]
initial = "Submitted"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Submitted"]
terminal = ["Indexed", "Failed"]

# Which scope's wiki this source feeds
[[state]]
name = "scope_id"
type = "string"
initial = ""

# Human-readable source title
[[state]]
name = "title"
type = "string"
initial = ""

# Source classification: web_article, corpus_data, reference, file_download, etc.
[[state]]
name = "source_type"
type = "string"
initial = ""

# Origin URL (empty for non-web sources)
[[state]]
name = "source_url"
type = "string"
initial = ""

# paw-fs File GUID pointing to raw downloaded content
[[state]]
name = "file_id"
type = "string"
initial = ""

# Freeform JSON metadata; consuming app decides structure
[[state]]
name = "metadata"
type = "string"
initial = "{}"

# JSON array of topics extracted during indexing
[[state]]
name = "extracted_topics"
type = "string"
initial = "[]"

# JSON array of WikiPage IDs created or updated from this source
[[state]]
name = "derived_page_ids"
type = "string"
initial = "[]"

# Error details if indexing failed
[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Submitted ---

[[action]]
name = "Submit"
kind = "input"
from = ["Submitted"]
params = ["scope_id", "title", "source_type", "source_url", "file_id", "metadata"]
hint = "Populate or update source fields while in Submitted state."

[[action]]
name = "Index"
kind = "input"
from = ["Submitted"]
to = "Indexed"
params = ["extracted_topics", "derived_page_ids"]
hint = "Mark source as indexed after processing and creating wiki pages."

[[action]]
name = "IndexFailed"
kind = "input"
from = ["Submitted"]
to = "Failed"
params = ["error_message"]
hint = "Mark source as failed if indexing could not complete."
