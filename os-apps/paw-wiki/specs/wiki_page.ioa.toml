# WikiPage -- Synthesized, versioned knowledge article.
#
# Pages are scoped and linked to sources via source_ids. Content lives in
# paw-fs (referenced by file_id); the entity holds metadata, summary,
# cross-references, and linkage for OData queries.
#
# Lifecycle: Drafting -> Published <-> Revising -> Archived
#
# The version counter increments on each Publish/Republish. Archiving is
# terminal and requires human approval (enforced by Cedar policy).
#
# No WASM integrations; the consuming app's agent dispatches all actions.

[automaton]
name = "WikiPage"
states = ["Drafting", "Published", "Revising", "Archived"]
initial = "Drafting"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Drafting", "Published", "Revising"]
terminal = ["Archived"]

# Which scope's wiki this page belongs to
[[state]]
name = "scope_id"
type = "string"
initial = ""

# Stable, human-readable identifier for cross-refs and paw-fs path
[[state]]
name = "slug"
type = "string"
initial = ""

# Page title
[[state]]
name = "title"
type = "string"
initial = ""

# Organizational category
[[state]]
name = "category"
type = "string"
initial = ""

# paw-fs File GUID pointing to full markdown content
[[state]]
name = "file_id"
type = "string"
initial = ""

# 1-3 sentence abstract for LLM context injection
[[state]]
name = "summary"
type = "string"
initial = ""

# JSON array of cross-references: [{ page_id, slug, relationship }]
[[state]]
name = "cross_references"
type = "string"
initial = "[]"

# JSON array of WikiSource IDs that contributed to this page
[[state]]
name = "source_ids"
type = "string"
initial = "[]"

# JSON array of freeform tags
[[state]]
name = "tags"
type = "string"
initial = "[]"

# Increments on each Publish/Republish
[[state]]
name = "version"
type = "counter"
initial = 0

# Why this revision was initiated
[[state]]
name = "revision_rationale"
type = "string"
initial = ""

# JSON object with last lint results
[[state]]
name = "lint_status"
type = "string"
initial = "{}"

# --- Drafting ---

[[action]]
name = "Draft"
kind = "input"
from = ["Drafting"]
params = ["scope_id", "slug", "title", "category", "file_id", "summary", "cross_references", "source_ids", "tags"]
hint = "Populate or refine page fields during drafting."

[[action]]
name = "Publish"
kind = "input"
from = ["Drafting"]
to = "Published"
params = []
hint = "Publish the draft. Increments version counter."

# --- Published ---

[[action]]
name = "UpdateLintStatus"
kind = "input"
from = ["Published"]
params = ["lint_status"]
hint = "Record lint results without changing page state."

[[action]]
name = "BeginRevision"
kind = "input"
from = ["Published"]
to = "Revising"
params = ["revision_rationale"]
hint = "Pull a published page back into revision with a stated rationale."

[[action]]
name = "Archive"
kind = "input"
from = ["Published"]
to = "Archived"
params = []
hint = "Archive a published page. Terminal state. Requires human approval via Cedar."

# --- Revising ---

[[action]]
name = "Revise"
kind = "input"
from = ["Revising"]
params = ["file_id", "summary", "cross_references", "source_ids", "tags"]
hint = "Update page content and metadata during revision."

[[action]]
name = "Republish"
kind = "input"
from = ["Revising"]
to = "Published"
params = []
hint = "Republish revised page. Increments version counter."
