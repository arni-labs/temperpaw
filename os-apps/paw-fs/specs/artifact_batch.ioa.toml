# ArtifactBatch Entity — I/O Automaton Specification
#
# Temper-native workflow for applying a multi-file artifact manifest. The
# batch owns workflow progress while individual Directory/File/FileVersion
# entities own filesystem state.

[automaton]
name = "ArtifactBatch"
states = ["Submitted", "Applying", "Completed", "Failed"]
initial = "Submitted"
allow_indefinite_states = ["Submitted", "Applying"]
terminal = ["Completed", "Failed"]

[[state]]
name = "file_count"
type = "counter"
initial = 0

[[state]]
name = "applied_count"
type = "counter"
initial = 0

[[state]]
name = "failed_count"
type = "counter"
initial = 0

[[state]]
name = "total_bytes"
type = "counter"
initial = 0

[[state]]
name = "workspace_id"
type = "string"
initial = ""

[[state]]
name = "files_manifest"
type = "string"
initial = ""

[[state]]
name = "last_error"
type = "string"
initial = ""

[[action]]
name = "Submit"
kind = "input"
from = ["Submitted"]
to = "Submitted"
params = ["workspace_id", "files_manifest", "submitted_by", "file_count"]
effect = ["file_count = params.file_count"]
hint = "Submit a JSON file manifest for batch application."

[[action]]
name = "Apply"
kind = "input"
from = ["Submitted"]
to = "Applying"
hint = "Apply the submitted manifest using direct Directory/File/FileVersion operations."

[[action.triggers]]
name = "artifact_batch_apply"
kind = "wasm"
module = "artifact_batch_apply"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "RecordFileApplied"
kind = "input"
from = ["Applying"]
to = "Applying"
params = ["path", "file_id", "size_bytes"]
effect = ["applied_count += 1", "total_bytes += params.size_bytes"]
hint = "Record one file applied by the batch integration."

[[action]]
name = "RecordFileFailed"
kind = "input"
from = ["Applying"]
to = "Applying"
params = ["path", "error"]
effect = ["failed_count += 1"]
hint = "Record one failed file application."

[[action]]
name = "Complete"
kind = "input"
from = ["Applying"]
to = "Completed"
params = ["usage_bucket_id"]
hint = "Mark the batch completed after files and usage delta are recorded."

[[action]]
name = "Fail"
kind = "input"
from = ["Submitted", "Applying"]
to = "Failed"
params = ["error"]
hint = "Mark the batch failed with a diagnostic error."

[[invariant]]
name = "AppliedCountNonNegative"
assert = "status in ['Submitted', 'Applying', 'Completed', 'Failed'] => applied_count >= 0"
