# File Entity — I/O Automaton Specification
#
# Represents a single file within TemperFS. Models the lifecycle from creation
# through content upload, locking, and archival. Content is stored externally;
# StreamUpdated is fired by the $value PUT handler after WASM upload succeeds.

[automaton]
name = "File"
states = ["Created", "Ready", "Locked", "Archived"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Ready", "Locked"]
terminal = ["Archived"]

# --- Declared keys (ADR-0153) ---
# (WorkspaceId, Path) is the addressable identity of a file — a path is unique within a
# workspace. The finalization/read-back flow resolves files by full path (`Path eq … and
# WorkspaceId eq …`), a non-keyed shape that otherwise falls to the broad field index and
# full-scans → 413 at tenant scale (ARN-68). Both components are non-null: a plain unique
# composite key giving O(log n) present/absent, co-committed with the journal.
[[key]]
name = "ws_path"
properties = ["WorkspaceId", "Path"]

# --- State Variables ---

[[state]]
name = "version_count"
type = "counter"
initial = 0

[[state]]
name = "size_bytes"
type = "counter"
initial = 0

[[state]]
name = "has_content"
type = "bool"
initial = false

[[state]]
name = "content_hash"
type = "string"
initial = ""

[[state]]
name = "mime_type"
type = "string"
initial = ""

[[state]]
name = "last_version_id"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Create"
kind = "input"
from = ["Created"]
to = "Created"
params = ["name", "path", "directory_id", "workspace_id", "mime_type"]
hint = "Create a new file entry. Content is not yet uploaded."

[[action]]
name = "StreamUpdated"
kind = "input"
from = ["Created", "Ready"]
to = "Ready"
params = ["content_hash", "size_bytes", "mime_type", "version_number", "previous_version_id", "created_by"]
effect = ["version_count += 1", "size_bytes = params.size_bytes", "has_content = true"]
hint = "Fired by $value PUT handler after WASM upload succeeds. Updates content metadata and advances to Ready. Not callable from Locked."

# ADR-0046: inline triggers are the single source of truth for the
# File -> FileVersion cascade after StreamUpdated commits.
# ADR-0049: Workspace usage/file-count accounting is legacy and non-authoritative.
# Agent PawFS writes must not emit Workspace events on the hot file I/O path;
# quota admission will be redesigned separately.

[[action.triggers]]
name = "file_stream_updated_creates_version"
kind = "entity"
principal = "file-service"
target_entity = "FileVersion"
target_action = "Create"
guard = "status == 'Ready'"

[action.triggers.args]
file_id = "Id"
version_number = "version_count"
content_hash = "content_hash"
size_bytes = "size_bytes"
mime_type = "mime_type"
previous_version_id = "previous_version_id"
created_by = "created_by"

[action.triggers.resolve_target]
kind = "create"

[[action.triggers]]
name = "file_stream_updated_supersedes_old_version"
kind = "entity"
principal = "file-service"
target_entity = "FileVersion"
target_action = "Supersede"

[action.triggers.resolve_target]
kind = "field"
id_field = "last_version_id"

[[action]]
name = "RecordVersion"
kind = "internal"
from = ["Ready"]
to = "Ready"
params = ["last_version_id"]
hint = "Record the newest FileVersion entity after a successful version create cascade."

[[action]]
name = "Lock"
kind = "internal"
from = ["Ready"]
to = "Locked"
hint = "Lock the file to prevent content modifications."

[[action]]
name = "Unlock"
kind = "internal"
from = ["Locked"]
to = "Ready"
hint = "Unlock a locked file, re-enabling content modifications."

[[action]]
name = "Archive"
kind = "internal"
from = ["Ready", "Locked"]
to = "Archived"
hint = "Archive the file. Terminal state."

# --- Output Actions ---

[[action]]
name = "FileArchivedEvent"
kind = "output"
hint = "Emitted when file transitions to Archived."

[[action]]
name = "FileContentUpdatedEvent"
kind = "output"
hint = "Emitted when file content is updated via StreamUpdated."

[[invariant]]
name = "ReadyFilesHaveContent"
assert = "status in ['Ready', 'Locked'] => has_content"

[[invariant]]
name = "VersionCountNonNegative"
assert = "status in ['Created', 'Ready', 'Locked', 'Archived'] => version_count >= 0"

[[invariant]]
name = "SizeBytesNonNegative"
assert = "status in ['Created', 'Ready', 'Locked', 'Archived'] => size_bytes >= 0"
