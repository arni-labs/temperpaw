# FileVersion Entity — I/O Automaton Specification
#
# Immutable record of a specific file version. Created when content is uploaded
# and superseded when a newer version replaces it.

[automaton]
name = "FileVersion"
states = ["Current", "Superseded"]
initial = "Current"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Current"]
terminal = ["Superseded"]

# --- State Variables ---

[[state]]
name = "file_id"
type = "string"
initial = ""

[[state]]
name = "version_number"
type = "counter"
initial = 0

[[state]]
name = "content_hash"
type = "string"
initial = ""

[[state]]
name = "mime_type"
type = "string"
initial = ""

[[state]]
name = "size_bytes"
type = "counter"
initial = 0

[[state]]
name = "previous_version_id"
type = "string"
initial = ""

[[state]]
name = "created_by"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Create"
kind = "input"
from = ["Current"]
to = "Current"
params = ["file_id", "version_number", "content_hash", "mime_type", "size_bytes", "previous_version_id", "created_by"]
effect = ["version_number = params.version_number", "size_bytes = params.size_bytes"]
hint = "Create a new file version record with content metadata."

[[action.triggers]]
name = "record_newest_version_on_file"
kind = "entity"
principal = "file-service"
target_entity = "File"
target_action = "RecordVersion"

[action.triggers.args]
last_version_id = "Id"

[action.triggers.resolve_target]
kind = "field"
id_field = "file_id"

[[action]]
name = "Supersede"
kind = "internal"
from = ["Current"]
to = "Superseded"
hint = "Mark this version as superseded by a newer version."

# --- Output Actions ---

[[action]]
name = "FileVersionSupersededEvent"
kind = "output"
hint = "Emitted when a file version is superseded."

[[invariant]]
name = "VersionNumberNonNegative"
assert = "status in ['Current', 'Superseded'] => version_number >= 0"

[[invariant]]
name = "SizeBytesNonNegative"
assert = "status in ['Current', 'Superseded'] => size_bytes >= 0"
