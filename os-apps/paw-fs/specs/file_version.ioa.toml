# FileVersion Entity — I/O Automaton Specification
#
# Immutable record of a specific file version. Created when content is uploaded
# and superseded when a newer version replaces it.

[automaton]
name = "FileVersion"
states = ["Current", "Superseded", "Orphaned"]
initial = "Current"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
# Superseded is a kept version: it stays until its File is deleted, or until
# Orphan finds its File gone.
allow_indefinite_states = ["Current", "Superseded"]
terminal = ["Orphaned"]

# --- State Variables ---

[[state]]
name = "file_id"
type = "string"
initial = ""

[[state]]
name = "version_number"
type = "counter"
initial = 0

[[state]]
name = "content_hash"
type = "string"
initial = ""

[[state]]
name = "mime_type"
type = "string"
initial = ""

[[state]]
name = "size_bytes"
type = "counter"
initial = 0

[[state]]
name = "previous_version_id"
type = "string"
initial = ""

[[state]]
name = "created_by"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Create"
kind = "input"
from = ["Current"]
to = "Current"
params = ["file_id", "version_number", "content_hash", "mime_type", "size_bytes", "previous_version_id", "created_by"]
effect = ["version_number = params.version_number", "size_bytes = params.size_bytes"]
hint = "Create a new file version record with content metadata."

[[action.triggers]]
name = "record_newest_version_on_file"
kind = "entity"
principal = "file-service"
target_entity = "File"
target_action = "RecordVersion"

[action.triggers.args]
last_version_id = "Id"

[action.triggers.resolve_target]
kind = "field"
id_field = "file_id"

# StreamUpdated supersedes the File's last_version_id, which RecordVersion
# moves only after the new version exists: two writes close together both
# supersede the same version. A second Supersede of a Superseded version is
# a no-op; from Current alone the joint walk dropped it.
[[action]]
name = "Supersede"
kind = "internal"
from = ["Current", "Superseded"]
to = "Superseded"
hint = "Mark this version as superseded by a newer version."

# Files deleted before FileVersion.File cascaded (#590) left their versions
# behind. A version moves here only when its File reads as the kernel's
# tombstone of a deleted File (File has no Deleted state of its own), and the
# operator may delete only a version here (policies/file_version.cedar): Cedar
# sees a version's own fields alone, so it cannot ask whether its File still
# exists, and the kernel's delete has no guard. A File read that fails gives
# null, and a File id that was never created reads as Created, so neither
# moves a version.
[[action]]
name = "Orphan"
kind = "input"
from = ["Current", "Superseded"]
to = "Orphaned"
guard = "File[file_id].status == 'Deleted'"
hint = "Mark a version whose File no longer exists, so the operator can delete it."

# --- Output Actions ---

[[action]]
name = "FileVersionSupersededEvent"
kind = "output"
hint = "Emitted when a file version is superseded."

[[invariant]]
name = "VersionNumberNonNegative"
assert = "status in ['Current', 'Superseded'] => version_number >= 0"

[[invariant]]
name = "SizeBytesNonNegative"
assert = "status in ['Current', 'Superseded'] => size_bytes >= 0"
