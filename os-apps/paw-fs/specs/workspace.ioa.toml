# Workspace Entity — I/O Automaton Specification
#
# Top-level lifecycle/config container for TemperFS workspaces.
#
# ADR-0049: agent PawFS tools resolve Directory/File rows directly. The
# Workspace-bound filesystem actions below remain only for legacy FUSE
# compatibility, and Workspace usage counters are non-authoritative until a
# separate quota-accounting design lands.

[automaton]
name = "Workspace"
states = ["Active", "Frozen", "Archived"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active", "Frozen"]
terminal = ["Archived"]

# --- State Variables ---

[[state]]
name = "quota_limit"
type = "counter"
initial = 0

[[state]]
name = "used_bytes"
type = "counter"
initial = 0
# Legacy/non-authoritative. Do not use for agent-path admission or correctness.

[[state]]
name = "file_count"
type = "counter"
initial = 0
# Legacy/non-authoritative. Do not use for agent-path admission or correctness.

[[state]]
name = "last_file_id"
type = "string"
initial = ""

[[state]]
name = "last_file_path"
type = "string"
initial = ""

[[state]]
name = "last_dir_id"
type = "string"
initial = ""

[[state]]
name = "last_dir_path"
type = "string"
initial = ""

[[state]]
name = "last_listing"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Create"
kind = "input"
from = ["Active"]
to = "Active"
params = ["name", "quota_limit"]
effect = ["quota_limit = params.quota_limit"]
hint = "Create a new workspace with a name and storage quota."

[[action]]
name = "UpdateQuota"
kind = "input"
from = ["Active"]
to = "Active"
params = ["quota_limit"]
effect = ["quota_limit = params.quota_limit"]
hint = "Update the workspace storage quota limit."

[[action]]
name = "IncrementUsage"
kind = "input"
from = ["Active"]
to = "Active"
effect = ["used_bytes += params.size_bytes"]
params = ["size_bytes"]
hint = "Record additional storage usage. Rejected if it would exceed quota."

[[action]]
name = "DecrementUsage"
kind = "input"
from = ["Active"]
to = "Active"
effect = ["used_bytes -= params.size_bytes"]
params = ["size_bytes"]
hint = "Release storage usage when files are removed or shrink."

[[action]]
name = "IncrementFileCount"
kind = "input"
from = ["Active"]
to = "Active"
effect = ["file_count += 1"]
hint = "Increment the workspace file count when a new file is created."

[[action]]
name = "DecrementFileCount"
kind = "input"
from = ["Active"]
to = "Active"
effect = ["file_count -= 1"]
hint = "Decrement the workspace file count when a file is archived."

[[action]]
name = "Freeze"
kind = "internal"
from = ["Active"]
to = "Frozen"
hint = "Freeze the workspace. No new uploads or modifications allowed."

[[action]]
name = "Thaw"
kind = "internal"
from = ["Frozen"]
to = "Active"
hint = "Thaw a frozen workspace, re-enabling modifications."

[[action]]
name = "Archive"
kind = "internal"
from = ["Active", "Frozen"]
to = "Archived"
hint = "Archive the workspace. Terminal state."

# --- Filesystem Actions (legacy FUSE-mapped compatibility) ---
#
# Agent tools must not call these Workspace-bound actions. They are retained so
# older FUSE integrations keep their public surface while PawFS hot-path I/O
# goes through Directory/File metadata and Files('{id}')/$value directly.

[[action]]
name = "MkDir"
kind = "input"
from = ["Active"]
to = "Active"
params = ["path"]
hint = "Create directory hierarchy at path (mkdir -p)."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "fs_mkdir"
kind = "wasm"
module = "workspace_fs"
on_failure = "FsOperationFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
operation = "mkdir"


[[action]]
name = "DirCreated"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_dir_id", "last_dir_path"]
hint = "Directory hierarchy created by WASM."

[[action]]
name = "CreateFile"
kind = "input"
from = ["Active"]
to = "Active"
params = ["path", "mime_type"]
hint = "Create file entity at path (creat). Parent dir must exist."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "fs_create_file"
kind = "wasm"
module = "workspace_fs"
on_failure = "FsOperationFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
operation = "create_file"


[[action]]
name = "FileCreated"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_file_id", "last_file_path"]
hint = "File entity created/found by WASM."

[[action]]
name = "ResolvePath"
kind = "input"
from = ["Active"]
to = "Active"
params = ["path"]
hint = "Resolve path to file entity (stat)."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "fs_resolve_path"
kind = "wasm"
module = "workspace_fs"
on_failure = "FsOperationFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
operation = "resolve_path"


[[action]]
name = "PathResolved"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_file_id", "last_file_path"]
hint = "Path resolved to file entity by WASM."

[[action]]
name = "ListDir"
kind = "input"
from = ["Active"]
to = "Active"
params = ["path"]
hint = "List directory contents (readdir)."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "fs_list_dir"
kind = "wasm"
module = "workspace_fs"
on_failure = "FsOperationFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
operation = "list_dir"


[[action]]
name = "DirListed"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_listing"]
hint = "Directory listing returned by WASM."

[[action]]
name = "DeleteFile"
kind = "input"
from = ["Active"]
to = "Active"
params = ["path"]
hint = "Archive file at path (unlink)."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "fs_delete_file"
kind = "wasm"
module = "workspace_fs"
on_failure = "FsOperationFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
operation = "delete_file"


[[action]]
name = "FileDeleted"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_file_id", "last_file_path"]
hint = "File archived by WASM."

[[action]]
name = "Rename"
kind = "input"
from = ["Active"]
to = "Active"
params = ["path", "new_path"]
hint = "Rename/move file (FUSE: rename). Moves file from path to new_path, creating intermediate directories as needed."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "fs_rename"
kind = "wasm"
module = "workspace_fs"
on_failure = "FsOperationFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
operation = "rename"


[[action]]
name = "FileRenamed"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_file_id", "last_file_path"]
hint = "Callback: file renamed/moved successfully."

[[action]]
name = "FsOperationFailed"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_file_id"]
hint = "Filesystem operation failed. Workspace remains Active."

# --- Output Actions ---

[[action]]
name = "WorkspaceArchivedEvent"
kind = "output"
hint = "Emitted when workspace transitions to Archived."

[[invariant]]
name = "UsageBelowQuota"
assert = "status in ['Active'] => used_bytes <= quota_limit"

[[invariant]]
name = "FileCountNonNegative"
assert = "status in ['Active', 'Frozen', 'Archived'] => file_count >= 0"

# --- Filesystem Integrations (WASM) ---
