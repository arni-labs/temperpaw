# WorkspaceUsageBucket Entity — I/O Automaton Specification
#
# Bounded aggregate for file usage deltas. Buckets are keyed by workspace plus
# a coarse period or artifact batch so routine file writes do not mutate the
# Workspace actor.

[automaton]
name = "WorkspaceUsageBucket"
states = ["Active", "Sealed"]
initial = "Active"
allow_indefinite_states = ["Active"]
terminal = ["Sealed"]

[[state]]
name = "bytes_delta"
type = "counter"
initial = 0

[[state]]
name = "file_delta"
type = "counter"
initial = 0

[[action]]
name = "Create"
kind = "input"
from = ["Active"]
to = "Active"
params = ["workspace_id", "bucket_key", "artifact_batch_id"]
hint = "Create or identify a bounded usage bucket for a workspace."

[[action]]
name = "ApplyDelta"
kind = "input"
from = ["Active"]
to = "Active"
params = ["workspace_id", "bucket_key", "artifact_batch_id", "bytes_delta", "file_delta"]
effect = ["bytes_delta += params.bytes_delta", "file_delta += params.file_delta"]
hint = "Record a bounded usage delta without touching the Workspace actor."

[[action]]
name = "Seal"
kind = "input"
from = ["Active"]
to = "Sealed"
hint = "Seal this bucket after reconciliation or retention rollover."

[[invariant]]
name = "BytesDeltaNonNegative"
assert = "status in ['Active', 'Sealed'] => bytes_delta >= 0"

[[invariant]]
name = "FileDeltaNonNegative"
assert = "status in ['Active', 'Sealed'] => file_delta >= 0"
