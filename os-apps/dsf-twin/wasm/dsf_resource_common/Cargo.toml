[package]
name = "dsf-resource-common"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chain-proof-ready = { path = "../../../paw-patrol/wasm/chain_proof_ready", features = ["library"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
temper-wasm-sdk = { git = "https://github.com/arni-labs/temper.git", rev = "d559f33025e9939b86f2a92f0ee78f13e21f6f0c" }
