[[state_timeout]]
state = "RetrySelectedReconciling"
after_seconds = 300
on_timeout = "RetrySelectedReconcilingTimedOut"
max_occurrences = 20

[[state_timeout]]
state = "RetrySelectedObserved"
after_seconds = 30
on_timeout = "RetrySelectedVerify"
max_occurrences = 40

[[state_timeout]]
state = "RetrySelectedVerifying"
after_seconds = 300
on_timeout = "RetrySelectedVerifyingTimedOut"
max_occurrences = 40

[[invariant]]
name = "BoundedWrites"
assert = "execution_attempts <= 3"

[[invariant]]
name = "BoundedReconciliation"
assert = "reconciliation_attempts <= 20"

[[invariant]]
name = "BoundedVerification"
assert = "verification_attempts <= 40"
