[[state_timeout]]
state = "Active"
after_seconds = 300
on_timeout = "RefreshObservations"

[[state_timeout]]
state = "Refreshing"
after_seconds = 300
on_timeout = "CollectionTimedOut"

[[state_timeout]]
state = "RetrySelectedValidating"
after_seconds = 300
on_timeout = "RetrySelectedValidatingTimedOut"
