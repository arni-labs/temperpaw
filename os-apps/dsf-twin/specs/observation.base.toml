[[action.triggers]]
target_entity = "DsfTemplateTarget" # replaced per resource by generate.py
name = "project_resource_measured"
kind = "entity"
target_action = "Observe"

[action.triggers.args]
coverage = "'measured'"
observation_id = "Id"
provenance_ref = "evidence_ref"
observed_at_ms = "observed_at_ms"
expected_sequence = "expected_resource_sequence"
observed_configuration = "observed_configuration"
observed_revision = "observed_revision"
outcome = "outcome"

[action.triggers.resolve_target]
kind = "field"
id_field = "subject_id"

