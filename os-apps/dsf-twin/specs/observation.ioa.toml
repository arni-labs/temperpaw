[[action.triggers]]
name = "project_resource_inaccessible"
kind = "entity"
target_action = "ObserveUnavailable"
target_entity = "DsfMediaPipeline"
principal = "dsf-factory-runtime"

[action.triggers.args]
coverage = "'inaccessible'"
observation_id = "Id"
provenance_ref = "evidence_ref"
observed_at_ms = "observed_at_ms"
expected_sequence = "expected_resource_sequence"

[action.triggers.resolve_target]
kind = "field"
id_field = "subject_id"

[[action]]
name = "RecordMediaPipelineStale"
kind = "input"
from = ["Draft"]
to = "Stale"
params = [{ name = "subject_type", type = "string" }, { name = "subject_id", type = "string" }, { name = "source", type = "string" }, { name = "source_event_id", type = "string" }, { name = "query", type = "string" }, { name = "window_start", type = "string" }, { name = "window_end", type = "string" }, { name = "sample_kind", type = "string" }, { name = "outcome", type = "string" }, { name = "summary", type = "string" }, { name = "evidence_ref", type = "string" }, { name = "observed_at_ms", type = "counter" }, { name = "expected_resource_sequence", type = "counter" }]
effect = ["expected_resource_sequence = params.expected_resource_sequence", "observed_at_ms = params.observed_at_ms"]

[[action.constraints]]
kind = "param_nonempty"
param = "subject_type"

[[action.constraints]]
