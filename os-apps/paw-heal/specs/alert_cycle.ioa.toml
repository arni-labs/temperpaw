# AlertCycle — One self-healing attempt opened from a monitor alert.

[automaton]
name = "AlertCycle"
states = ["Created", "Triaging", "Fixed", "Merging", "Deploying", "Verifying", "Resolved", "Tuned", "Failed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Triaging", "Fixed", "Merging", "Deploying", "Verifying"]
terminal = ["Resolved", "Tuned", "Failed"]

[[state]]
name = "monitor_id"
type = "string"
initial = ""

[[state]]
name = "alert_payload"
type = "string"
initial = ""

[[state]]
name = "diagnosis"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "sre_agent_id"
type = "string"
initial = ""

[[state]]
name = "developer_agent_id"
type = "string"
initial = ""

[[state]]
name = "tuning_notes"
type = "string"
initial = ""

[[state]]
name = "merge_sha"
type = "string"
initial = ""

[[state]]
name = "deployment_url"
type = "string"
initial = ""

[[state]]
name = "check_count"
type = "string"
initial = "0"

[[state]]
name = "report_channel_entity_id"
type = "string"
initial = ""

[[state]]
name = "report_thread_id"
type = "string"
initial = ""

[[state]]
name = "agent_model"
type = "string"
initial = ""

[[state]]
name = "agent_provider"
type = "string"
initial = ""

[[action]]
name = "Open"
kind = "input"
from = ["Created"]
to = "Triaging"
params = ["monitor_id", "alert_payload", "report_channel_entity_id", "report_thread_id", "agent_model", "agent_provider"]
hint = "Open a triage cycle and optionally attach the SRE agent responsible for diagnosis."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "spawn_sre"
kind = "wasm"
module = "alert_opener"
on_failure = "Escalate"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
default_agent_model = "claude-sonnet-4-6"
default_sre_workdir = "/workspace/temperpaw-sre-webhook"
default_developer_workdir = "/workspace/temperpaw-self-heal"


[[action]]
name = "HealComplete"
kind = "input"
from = ["Triaging"]
to = "Fixed"
params = ["diagnosis", "pr_url", "developer_agent_id"]
hint = "Mark the alert as fixed and record the remediation PR."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "begin_cicd"
kind = "wasm"
module = "cicd_initiator"
on_failure = "Escalate"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "BeginMerge"
kind = "input"
from = ["Fixed"]
to = "Merging"
params = ["pr_url"]
hint = "Begin the merge phase after a fix PR is ready."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "check_merge_ready"
kind = "wasm"
module = "cicd_merger"
on_failure = "AlertPersists"

[action.triggers.config]
github_token = "{secret:github_token}"
temper_api_url = "{secret:temper_api_url}"
max_checks = "40"


[[action]]
name = "MergeComplete"
kind = "input"
from = ["Merging"]
to = "Deploying"
params = ["merge_sha"]
hint = "Record the merge SHA and transition into deployment tracking."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "check_deployment"
kind = "wasm"
module = "deployment_tracker"
on_failure = "AlertPersists"

[action.triggers.config]
github_token = "{secret:github_token}"
temper_api_url = "{secret:temper_api_url}"
max_checks = "40"


[[action]]
name = "DeployDetected"
kind = "input"
from = ["Deploying"]
to = "Verifying"
params = ["deployment_url"]
hint = "Record the deployment target that should be verified after merge."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "check_alert_resolution"
kind = "wasm"
module = "alert_verifier"
on_failure = "AlertPersists"

[action.triggers.config]
dd_api_key = "{secret:dd_api_key}"
dd_app_key = "{secret:dd_app_key}"
dd_site = "{secret:dd_site}"
temper_api_url = "{secret:temper_api_url}"
max_checks = "5"


[[action]]
name = "AlertResolved"
kind = "input"
from = ["Fixed", "Deploying", "Verifying"]
to = "Resolved"
params = ["diagnosis"]
hint = "Mark the alert resolved after post-deploy verification succeeds."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "report_outcome"
kind = "wasm"
module = "heal_reporter"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "AlertPersists"
kind = "input"
from = ["Fixed", "Merging", "Deploying", "Verifying"]
to = "Failed"
params = ["diagnosis"]
hint = "Mark the alert failed after deployment when the signal still persists."

[[action.triggers]]
name = "report_outcome"
kind = "wasm"
module = "heal_reporter"
config = { temper_api_url = "{secret:temper_api_url}" }

[[action]]
name = "TuneComplete"
kind = "input"
from = ["Triaging"]
to = "Tuned"
params = ["diagnosis", "tuning_notes"]
hint = "Mark the cycle as tuned when the monitor was adjusted instead of code being changed."

[[action.triggers]]
name = "report_outcome"
kind = "wasm"
module = "heal_reporter"
config = { temper_api_url = "{secret:temper_api_url}" }

[[action]]
name = "Escalate"
kind = "input"
from = ["Triaging"]
to = "Failed"
params = ["diagnosis"]
hint = "Escalate when the loop cannot safely remediate the issue."

[[action.triggers]]
name = "report_outcome"
kind = "wasm"
module = "heal_reporter"
config = { temper_api_url = "{secret:temper_api_url}" }

[[action]]
name = "CheckMergeReady"
kind = "internal"
from = ["Merging"]
to = "Merging"
params = []
hint = "Poll GitHub PR merge readiness. Self-loops until checks pass or max_checks exceeded."

[[action.triggers]]
name = "check_merge_ready"
kind = "wasm"
module = "cicd_merger"
on_failure = "AlertPersists"
config = { github_token = "{secret:github_token}", temper_api_url = "{secret:temper_api_url}", max_checks = "40" }

[[action]]
name = "CheckDeployment"
kind = "internal"
from = ["Deploying"]
to = "Deploying"
params = []
hint = "Poll GitHub deployments API for success."

[[action.triggers]]
name = "check_deployment"
kind = "wasm"
module = "deployment_tracker"
on_failure = "AlertPersists"
config = { github_token = "{secret:github_token}", temper_api_url = "{secret:temper_api_url}", max_checks = "40" }

[[action]]
name = "CheckAlertResolution"
kind = "internal"
from = ["Verifying"]
to = "Verifying"
params = []
hint = "Poll monitoring API for alert resolution."

[[action.triggers]]
name = "check_alert_resolution"
kind = "wasm"
module = "alert_verifier"
on_failure = "AlertPersists"
config = { dd_api_key = "{secret:dd_api_key}", dd_app_key = "{secret:dd_app_key}", dd_site = "{secret:dd_site}", temper_api_url = "{secret:temper_api_url}", max_checks = "5" }
