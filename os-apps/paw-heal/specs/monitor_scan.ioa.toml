# MonitorScan — tracks a Datadog monitor bootstrap or PR-delta scan.

[automaton]
name = "MonitorScan"
states = ["Created", "Scanning", "Complete", "Failed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Scanning"]
terminal = ["Complete", "Failed"]

[[state]]
name = "project_harness_id"
type = "string"
initial = ""

[[state]]
name = "scan_type"
type = "string"
initial = "bootstrap"

[[state]]
name = "commit_sha"
type = "string"
initial = ""

[[state]]
name = "monitors_created"
type = "counter"
initial = 0

[[state]]
name = "monitors_updated"
type = "counter"
initial = 0

[[state]]
name = "error_message"
type = "string"
initial = ""

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["project_harness_id", "scan_type", "commit_sha"]
hint = "Attach the monitor scan to a project harness and declare the scan scope."

[[action]]
name = "StartScan"
kind = "input"
from = ["Created"]
to = "Scanning"
hint = "Begin the monitor bootstrap or PR-delta scan."

[[action]]
name = "ScanComplete"
kind = "input"
from = ["Scanning"]
to = "Complete"
params = ["monitors_created", "monitors_updated"]
hint = "Record how many monitors were created and updated."

[[action]]
name = "ScanFailed"
kind = "input"
from = ["Scanning"]
to = "Failed"
params = ["error_message"]
hint = "Record the failure message for an incomplete scan."
