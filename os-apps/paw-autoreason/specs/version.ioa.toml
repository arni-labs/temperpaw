# Version -- A specific artifact version within a round.
#
# Labels: A (incumbent), B (revised), AB (synthesized).
#
# Lifecycle: Created -> Ready

[automaton]
name = "Version"
states = ["Created", "Ready"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created"]
terminal = ["Ready"]

[[state]]
name = "round_id"
type = "string"
initial = ""

[[state]]
name = "tournament_id"
type = "string"
initial = ""

# A | B | AB
[[state]]
name = "label"
type = "string"
initial = ""

# paw-fs File GUID of the version content
[[state]]
name = "content_file_id"
type = "string"
initial = ""

# --- Created ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["round_id", "tournament_id", "label", "content_file_id"]
hint = "Set version parameters."

[[action]]
name = "Finalize"
kind = "input"
from = ["Created"]
to = "Ready"
params = ["content_file_id"]
hint = "Mark version as ready for judging."
