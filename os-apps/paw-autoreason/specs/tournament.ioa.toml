# Tournament -- Iterative refinement via tournament structure.
#
# Implements NousResearch/autoreason: critique -> revise -> judge -> tally.
# Convergence detection: k consecutive incumbent (A) wins -> Converged.
# "Do nothing" is first-class — Version A always competes unchanged.
#
# Lifecycle: Created -> InRound -> Judging -> Tallying -> Converged | MaxRounds | Failed

[automaton]
name = "Tournament"
states = ["Created", "InRound", "Judging", "Tallying", "Converged", "MaxRounds", "Failed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "InRound", "Judging", "Tallying"]
terminal = ["Converged", "MaxRounds", "Failed"]

# paw-fs File GUID of the original artifact
[[state]]
name = "artifact_file_id"
type = "string"
initial = ""

# Current incumbent version (A) entity ID
[[state]]
name = "current_version_a_id"
type = "string"
initial = ""

# Current round number
[[state]]
name = "round_count"
type = "counter"
initial = 0

# Maximum rounds before stopping
[[state]]
name = "max_rounds"
type = "string"
initial = "10"

# How many consecutive rounds A (incumbent) has won
[[state]]
name = "consecutive_incumbent_wins"
type = "string"
initial = "0"

# Convergence threshold: stop after k consecutive A wins
[[state]]
name = "convergence_k"
type = "string"
initial = "2"

# Number of judges per round
[[state]]
name = "judge_count"
type = "string"
initial = "5"

# Temperature for author/critic/synthesizer agents
[[state]]
name = "author_temperature"
type = "string"
initial = "0.8"

[[state]]
name = "author_model"
type = "string"
initial = ""

[[state]]
name = "author_provider"
type = "string"
initial = ""

# Temperature for judge agents
[[state]]
name = "judge_temperature"
type = "string"
initial = "0.3"

# JSON array of judge configs for cross-model pool: [{ model, provider }]
[[state]]
name = "judge_config_json"
type = "string"
initial = "[]"

# paw-fs File GUID of the final winning version
[[state]]
name = "final_version_file_id"
type = "string"
initial = ""

# Domain context for agents to understand what they're refining
[[state]]
name = "domain_context"
type = "string"
initial = ""

# Error details
[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Created ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["artifact_file_id", "domain_context", "max_rounds", "convergence_k", "judge_count", "author_temperature", "author_model", "author_provider", "judge_temperature", "judge_config_json"]
hint = "Set tournament parameters."

[[action]]
name = "Begin"
kind = "input"
from = ["Created"]
to = "InRound"
params = []
hint = "Start the tournament — creates first version and round."

# --- InRound (referee agent orchestrating one round) ---

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "initialize_tournament"
kind = "wasm"
module = "initialize_tournament"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
odata_namespace = "Autoreason"


[[action]]
name = "RoundReady"
kind = "input"
from = ["InRound"]
params = ["current_version_a_id"]
hint = "Round setup complete, referee spawned."

[[action]]
name = "BeginJudging"
kind = "input"
from = ["InRound"]
to = "Judging"
params = []
hint = "Critique and revision done, judges spawned."

# --- Judging (judges evaluating in parallel) ---

[[action]]
name = "JudgmentSubmitted"
kind = "input"
from = ["Judging"]
params = []
hint = "A judge has submitted their ranking."

[[action]]
name = "AllJudged"
kind = "input"
from = ["Judging"]
to = "Tallying"
params = []
hint = "All judges have submitted. Trigger vote tally."

# --- Tallying (deterministic Borda count) ---

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "tally_votes"
kind = "wasm"
module = "tally_votes"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
odata_namespace = "Autoreason"


[[action]]
name = "NextRound"
kind = "input"
from = ["Tallying"]
to = "InRound"
params = ["current_version_a_id", "consecutive_incumbent_wins"]
hint = "Winner determined, starting next round."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "run_round"
kind = "wasm"
module = "run_round"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
odata_namespace = "Autoreason"


[[action]]
name = "Converge"
kind = "input"
from = ["Tallying"]
to = "Converged"
params = ["final_version_file_id"]
hint = "k consecutive incumbent wins — tournament converged."

[[action]]
name = "ReachMaxRounds"
kind = "input"
from = ["Tallying"]
to = "MaxRounds"
params = ["final_version_file_id"]
hint = "Maximum rounds reached without convergence."

# --- Error handling ---

[[action]]
name = "Fail"
kind = "input"
from = ["Created", "InRound", "Judging", "Tallying"]
to = "Failed"
params = ["error_message"]
hint = "Tournament failed."

# --- Integrations ---
