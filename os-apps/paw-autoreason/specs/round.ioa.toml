# Round -- One iteration of critique-revise-judge.
#
# Lifecycle: Active -> Complete

[automaton]
name = "Round"
states = ["Active", "Complete"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active"]
terminal = ["Complete"]

[[state]]
name = "tournament_id"
type = "string"
initial = ""

[[state]]
name = "round_number"
type = "string"
initial = "0"

# paw-fs File IDs for the three competing versions
[[state]]
name = "version_a_file_id"
type = "string"
initial = ""

[[state]]
name = "version_b_file_id"
type = "string"
initial = ""

[[state]]
name = "version_ab_file_id"
type = "string"
initial = ""

# paw-fs File ID of the critique
[[state]]
name = "critique_file_id"
type = "string"
initial = ""

# Winner: A | B | AB
[[state]]
name = "winner"
type = "string"
initial = ""

# JSON: { "A": score, "B": score, "AB": score }
[[state]]
name = "borda_scores_json"
type = "string"
initial = "{}"

# JSON: per-judge label randomization mapping
[[state]]
name = "label_mapping_json"
type = "string"
initial = "{}"

# --- Active ---

[[action]]
name = "Configure"
kind = "input"
from = ["Active"]
params = ["tournament_id", "round_number", "version_a_file_id"]
hint = "Set round parameters."

[[action]]
name = "RecordVersions"
kind = "input"
from = ["Active"]
params = ["version_b_file_id", "version_ab_file_id", "critique_file_id"]
hint = "Record B, AB versions and critique after referee completes."

[[action]]
name = "RecordResult"
kind = "input"
from = ["Active"]
to = "Complete"
params = ["winner", "borda_scores_json", "label_mapping_json"]
hint = "Record tally result."
