# Judgment -- One judge's evaluation of a round's versions.
#
# Judges see randomized labels (not A/B/AB) to prevent bias.
# Each judge's label mapping differs.
#
# Lifecycle: Created -> Submitted

[automaton]
name = "Judgment"
states = ["Created", "Submitted"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created"]
terminal = ["Submitted"]

[[state]]
name = "round_id"
type = "string"
initial = ""

[[state]]
name = "tournament_id"
type = "string"
initial = ""

# Session ID of the judge agent
[[state]]
name = "judge_session_id"
type = "string"
initial = ""

[[state]]
name = "judge_model"
type = "string"
initial = ""

[[state]]
name = "judge_provider"
type = "string"
initial = ""

# JSON array: ranking from best to worst using randomized labels
[[state]]
name = "ranking_json"
type = "string"
initial = "[]"

# Judge's reasoning for their ranking
[[state]]
name = "reasoning"
type = "string"
initial = ""

# JSON: { randomized_label: real_label } mapping for this judge
[[state]]
name = "randomized_labels_json"
type = "string"
initial = "{}"

# --- Created ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["round_id", "tournament_id", "judge_session_id", "judge_model", "judge_provider", "randomized_labels_json"]
hint = "Set judgment parameters."

[[action]]
name = "Submit"
kind = "input"
from = ["Created"]
to = "Submitted"
params = ["ranking_json", "reasoning"]
hint = "Judge submits their ranking."
