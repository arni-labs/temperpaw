# WorkCycle — Governed implementation loop for one planned change.

[automaton]
name = "WorkCycle"
states = ["Planning", "Planned", "InProgress", "Testing", "Reviewing", "Complete", "Failed"]
initial = "Planning"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Planning", "Planned", "InProgress", "Testing", "Reviewing"]
terminal = ["Complete", "Failed"]

[[state]]
name = "project_harness_id"
type = "string"
initial = ""

[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "planner_id"
type = "string"
initial = ""

[[state]]
name = "approver_id"
type = "string"
initial = ""

[[state]]
name = "plan_summary"
type = "string"
initial = ""

[[state]]
name = "test_summary"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "has_plan"
type = "bool"
initial = false

[[state]]
name = "tests_passed"
type = "bool"
initial = false

# --- Gate fields (bool for is_true guards) ---

[[state]]
name = "migrations_ok"
type = "bool"
initial = false

[[state]]
name = "typecheck_ok"
type = "bool"
initial = false

[[state]]
name = "unit_tests_ok"
type = "bool"
initial = false

[[state]]
name = "dst_ok"
type = "bool"
initial = false

[[state]]
name = "policy_gates_ok"
type = "bool"
initial = false

[[state]]
name = "e2e_ok"
type = "bool"
initial = false

[[state]]
name = "review_notes"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[action]]
name = "Configure"
kind = "input"
from = ["Planning"]
params = ["project_harness_id", "task_summary", "planner_id"]
hint = "Attach the work cycle to a harness and identify the planner for the change."

[[action]]
name = "WritePlan"
kind = "input"
from = ["Planning"]
to = "Planned"
params = ["plan_summary", "planner_id"]
effect = ["has_plan = true"]
hint = "Draft the plan before implementation can begin."

[[action]]
name = "StartWork"
kind = "input"
from = ["Planned"]
to = "InProgress"
guard = "has_plan"
hint = "Start implementation only after a plan exists."

[[action]]
name = "ReportMigrations"
kind = "input"
from = ["InProgress"]
effect = ["migrations_ok = true"]
hint = "Self-loop: record that migrations passed."

[[action]]
name = "ReportTypecheck"
kind = "input"
from = ["InProgress"]
effect = ["typecheck_ok = true"]
hint = "Self-loop: record that typechecking passed."

[[action]]
name = "ReportUnitTests"
kind = "input"
from = ["InProgress"]
effect = ["unit_tests_ok = true"]
hint = "Self-loop: record that unit tests passed."

[[action]]
name = "ReportDst"
kind = "input"
from = ["InProgress", "Testing"]
effect = ["dst_ok = true"]
hint = "Record that DST checks passed. Allowed in InProgress or Testing."

[[action]]
name = "ReportPolicyGates"
kind = "input"
from = ["InProgress", "Testing"]
effect = ["policy_gates_ok = true"]
hint = "Record that policy gates passed. Allowed in InProgress or Testing."

[[action]]
name = "ReportE2e"
kind = "input"
from = ["InProgress", "Testing"]
effect = ["e2e_ok = true"]
hint = "Record that end-to-end tests passed. Allowed in InProgress or Testing."

[[action]]
name = "UpdateSandbox"
kind = "input"
from = ["InProgress"]
params = ["sandbox_url"]
hint = "Record the sandbox URL of the SWE agent working on this cycle."

[[action]]
name = "BeginTesting"
kind = "input"
from = ["InProgress"]
to = "Testing"
guard = "migrations_ok && typecheck_ok && unit_tests_ok"
hint = "Move implementation into test execution. Requires migrations, typecheck, and unit tests to pass."

[[action]]
name = "PassTests"
kind = "input"
from = ["Testing"]
to = "Reviewing"
params = ["test_summary"]
effect = ["tests_passed = true"]
guard = "dst_ok && policy_gates_ok"
hint = "Only passing work should enter review. Requires DST and policy gates to pass."

[[action]]
name = "Approve"
kind = "input"
from = ["Reviewing"]
to = "Complete"
guard = "tests_passed"
params = ["approver_id", "pr_url"]
hint = "Approve the reviewed change after tests have passed."

[[action]]
name = "RequestChanges"
kind = "input"
from = ["Reviewing"]
to = "InProgress"
params = ["review_notes"]
effect = ["tests_passed = false"]
hint = "Send work back for changes. Resets tests_passed; other gate booleans are re-verified by gate_verifier on the next BeginTesting attempt."

[[action]]
name = "Fail"
kind = "input"
from = ["Planning", "Planned", "InProgress", "Testing", "Reviewing"]
to = "Failed"
params = ["error_message"]
hint = "Record a failed work cycle with the reason for failure."

[[invariant]]
name = "PlannedWorkHasPlan"
assert = "status in ['Planned', 'InProgress', 'Testing', 'Reviewing', 'Complete'] => has_plan"

[[invariant]]
name = "ReviewedWorkPassedTests"
assert = "status in ['Reviewing', 'Complete'] => tests_passed"

# --- Integrations ---
# Gate verification and reviewer spawning are PROJECT-SPECIFIC, not platform.
# Each project's reference config (e.g. projects/deep-sci-fi/) defines its own
# gate_verifier WASM and reviewer agent configuration.
# The WorkCycle spec provides the state machine and actions; projects wire
# their own integrations via the entity configuration at runtime.
