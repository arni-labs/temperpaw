# Harness — Development workflow contract for a target repository.

[automaton]
name = "Harness"
states = ["Created", "Configured", "Active", "Archived"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Configured", "Active"]
terminal = ["Archived"]

[[state]]
name = "repo_url"
type = "string"
initial = ""

[[state]]
name = "tech_stack"
type = "string"
initial = ""

[[state]]
name = "conventions"
type = "string"
initial = ""

[[state]]
name = "work_cycle_type"
type = "string"
initial = "WorkCycles"

[[state]]
name = "last_activated_at"
type = "string"
initial = ""

[[action]]
name = "Configure"
kind = "input"
from = ["Created", "Configured"]
to = "Configured"
params = ["repo_url", "tech_stack", "conventions", "work_cycle_type"]
hint = "Attach repository metadata and working conventions before the harness goes live."

[[action]]
name = "Activate"
kind = "input"
from = ["Configured"]
to = "Active"
params = ["last_activated_at"]
hint = "Turn on the project harness after the repository contract is configured."

[[action]]
name = "Archive"
kind = "input"
from = ["Configured", "Active"]
to = "Archived"
hint = "Archive the harness when the repository is no longer managed by Temper Paw."
