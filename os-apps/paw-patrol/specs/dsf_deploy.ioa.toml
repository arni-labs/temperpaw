# DsfDeploy — Deep Sci-Fi project deploy tool (ARN-441).
#
# Same class as TemperDeploy: a reusable project workflow the Effort records
# by id. Storage key is DsfDeploy until Temper app-qualifies types (ARN-28).
# Live WorkCycle ReleaseRun rows are not renamed.
#
# Side effects reuse release_run_lifecycle (merge via GitHub App install
# token, tenant github_token only as fallback; watch health_url git_sha on
# the computer, git-revert). Results remain on this deployment record.
# An Effort may link it as evidence without changing its own lifecycle.

[automaton]
name = "DsfDeploy"
states = ["Requested", "Merging", "Watching", "Healthy", "Unhealthy", "RolledBack", "Failed"]
initial = "Requested"

[[state]]
name = "effort_id"
type = "string"
initial = ""

[[state]]
name = "repo"
type = "string"
initial = ""

[[state]]
name = "pr_number"
type = "string"
initial = ""

[[state]]
name = "computer_id"
type = "string"
initial = ""

[[state]]
name = "health_url"
type = "string"
initial = ""

[[state]]
name = "max_checks"
type = "string"
initial = "60"

[[state]]
name = "base_branch"
type = "string"
initial = "main"

[[state]]
name = "merge_sha"
type = "string"
initial = ""

[[state]]
name = "expected_head_sha"
type = "string"
initial = ""

[[state]]
name = "head_sha"
type = "string"
initial = ""

[[state]]
name = "observed_sha"
type = "string"
initial = ""

[[state]]
name = "check_count"
type = "counter"
initial = 0

[[state]]
name = "degraded_streak"
type = "counter"
initial = 0

[[state]]
name = "revert_sha"
type = "string"
initial = ""

[[state]]
name = "reason"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[action]]
name = "Request"
kind = "input"
from = ["Requested"]
to = "Merging"
params = ["effort_id", "repo", "pr_number", "computer_id", "health_url", "max_checks", "expected_head_sha"]
hint = "Merge the DSF PR on the named computer, then watch health_url."

[[action.triggers]]
name = "dsf_deploy_merge"
kind = "wasm"
module = "release_run_lifecycle"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
github_token = "{secret:github_token}"
github_app_id = "{secret:github_app_id}"
github_app_private_key = "{secret:github_app_private_key}"
concurrent_entity_set = "DsfDeploys"

[[state_timeout]]
state = "Merging"
after_seconds = 600
on_timeout = "Fail"
args = { error_message = "'DsfDeploy stayed Merging for 10m (merge callback lost).'" }

[[state_timeout]]
state = "Requested"
after_seconds = 86400
on_timeout = "Fail"
args = { error_message = "'DsfDeploy was not Requested within 24h.'" }

[[action]]
name = "MergeSucceeded"
kind = "input"
from = ["Merging"]
to = "Watching"
params = ["merge_sha", "base_branch", "head_sha"]
hint = "Callback — the PR merged; watch until health_url serves merge_sha."

[[state_timeout]]
state = "Watching"
after_seconds = 30
on_timeout = "Check"
reset_on = ["Check", "CheckPending"]

[[action]]
name = "Check"
kind = "input"
from = ["Watching"]
to = "Watching"
effect = ["check_count += 1"]
hint = "One probe of health_url on the computer."

[[action.triggers]]
name = "dsf_deploy_check"
kind = "wasm"
module = "release_run_lifecycle"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
github_token = "{secret:github_token}"
github_app_id = "{secret:github_app_id}"
github_app_private_key = "{secret:github_app_private_key}"
concurrent_entity_set = "DsfDeploys"

[[action]]
name = "CheckPending"
kind = "input"
from = ["Watching"]
to = "Watching"
params = ["observed_sha", "degraded_streak"]
effect = ["degraded_streak = params.degraded_streak"]
hint = "Still rolling out, or briefly degraded."

[[action]]
name = "CheckHealthy"
kind = "input"
from = ["Watching"]
to = "Healthy"
params = ["observed_sha"]
hint = "health_url serves merge_sha. Reports the Effort verified."

[[action]]
name = "CheckUnhealthy"
kind = "input"
from = ["Watching"]
to = "Unhealthy"
params = ["reason", "observed_sha"]
hint = "Start git-revert rollback on the computer."

[[action.triggers]]
name = "dsf_deploy_rollback"
kind = "wasm"
module = "release_run_lifecycle"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
github_token = "{secret:github_token}"
github_app_id = "{secret:github_app_id}"
github_app_private_key = "{secret:github_app_private_key}"
concurrent_entity_set = "DsfDeploys"

[[state_timeout]]
state = "Unhealthy"
after_seconds = 600
on_timeout = "Fail"
args = { error_message = "'DsfDeploy stayed Unhealthy for 10m (rollback callback lost).'" }

[[action]]
name = "RollbackPushed"
kind = "input"
from = ["Unhealthy"]
to = "RolledBack"
params = ["revert_sha"]
hint = "Revert pushed. Effort returns to Merged."

[[action]]
name = "Fail"
kind = "input"
from = ["Requested", "Merging", "Watching", "Unhealthy"]
to = "Failed"
params = ["error_message"]
hint = "Step could not run. Effort Stalls — the world may be inconsistent."
