# Effort is a task record. It never authorizes a merge or starts a deployment.
# Legacy states remain readable; Update/Reopen/Complete/Cancel migrate old rows.
[automaton]
name = "Effort"
states = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
initial = "Open"
strict_action_params = true
allow_indefinite_states = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]

[[state]]
name = "intent_id"
type = "string"
initial = ""

[[state]]
name = "factory_case_id"
type = "string"
initial = ""

[[state]]
name = "intent_ref"
type = "string"
initial = ""

[[state]]
name = "spec_ref"
type = "string"
initial = ""

[[state]]
name = "plan_ref"
type = "string"
initial = ""

[[state]]
name = "decisions_ref"
type = "string"
initial = ""

[[state]]
name = "pm_issue_id"
type = "string"
initial = ""

[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "task_detail"
type = "string"
initial = ""

[[state]]
name = "risk_lane"
type = "string"
initial = ""

[[state]]
name = "repo"
type = "string"
initial = ""

[[state]]
name = "branch"
type = "string"
initial = ""

[[state]]
name = "pr_number"
type = "string"
initial = ""

[[state]]
name = "head_sha"
type = "string"
initial = ""

[[state]]
name = "deployment_id"
type = "string"
initial = ""

[[state]]
name = "e2e_summary"
type = "string"
initial = ""

[[state]]
name = "result_summary"
type = "string"
initial = ""

[[state]]
name = "pull_request_urls"
type = "list"
initial = []

[[state]]
name = "evidence"
type = "list"
initial = []

[[state]]
name = "ask_ids"
type = "list"
initial = []

[[state]]
name = "review_run_ids"
type = "list"
initial = []

[[state]]
name = "proof_packet_ids"
type = "list"
initial = []

# Historical context remains readable; none of these fields gates new work.

[[state]]
name = "plan_summary"
type = "string"
initial = ""

[[state]]
name = "resource_delivery_evidence"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[action]]
name = "Seed"
kind = "input"
from = ["Open"]
params = ["intent_id", "intent_ref", "factory_case_id", "task_summary", "task_detail", "risk_lane", "repo", "branch"]
hint = "Optional intake linkage. Direct Effort creation is also supported."

[[action]]
name = "Update"
kind = "input"
from = ["Open", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
to = "Open"
params = ["task_summary", "task_detail", "repo", "branch", "intent_ref"]
hint = "Record the objective and context. Documents are optional links."

[[action]]
name = "AttachPullRequest"
kind = "input"
from = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
params = ["pull_request_urls"]
effect = ["append(pull_request_urls, params.pull_request_urls)"]
hint = "Append one PR URL. Multiple PRs from the same repository are supported."

[[action]]
name = "RecordEvidence"
kind = "input"
from = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
params = ["evidence"]
effect = ["append(evidence, params.evidence)"]
hint = "Append a concise result, command output, screenshot or other evidence link."

[[action]]
name = "AttachAsk"
kind = "input"
from = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
params = ["ask_ids"]
effect = ["append(ask_ids, params.ask_ids)"]
hint = "Append one related Ask ID without blocking the effort."

[[action]]
name = "LinkPmIssue"
kind = "input"
from = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
params = ["pm_issue_id"]
hint = "Optionally link an existing project issue."

[[action]]
name = "Complete"
kind = "input"
from = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
to = "Done"
params = ["result_summary"]
hint = "Record the delivered result. This does not merge, deploy or claim independent verification."

[[action]]
name = "Cancel"
kind = "input"
from = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
to = "Cancelled"
params = ["result_summary"]
hint = "Record why the task was cancelled."

[[action]]
name = "Reopen"
kind = "input"
from = ["Open", "Done", "Cancelled", "Intended", "Specified", "Planned", "Building", "InReview", "Proving", "Merged", "Deploying", "ResourceMergeChecking", "ResourceVerifying", "Verified", "Stalled", "Abandoned"]
to = "Open"
params = []
hint = "Resume this same effort rather than creating a duplicate."
