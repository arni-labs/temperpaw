[package]
name = "release-run-lifecycle"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/arni-labs/temper.git", rev = "f2e24f4f954755abf2feeb467d07b1f5ac129604" }
wasm-helpers = { path = "../../../paw-agent/wasm/wasm-helpers" }
serde_json = "1"
rsa = { version = "0.9", default-features = false, features = ["pem", "sha2", "std"] }

# rsa → getrandom 0.2 compile_error!s on wasm32-unknown-unknown. JWT sign
# does not draw randomness; the custom backend exists only so the crate
# compiles. Do not put this on wasm-helpers (ARN-443).
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
