name = "paw-agent"
description = "Core agent lifecycle — souls, skills, sessions, memory, teams"
version = "0.1.0"
startup_install = "core"
dependencies = ["temperpaw/paw-fs@8d7b4bdefd41d785555c0e5cbfb3e38cb1fbd3d0"]

[[wasm_modules]]
name = "workspace_provisioner"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "context_preparer"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "provider_auth_gate"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "openai_codex_auth"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "provider_caller"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "provider_response_applier"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "agent_reply"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "emit_ots_trajectory"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "monty_repl"
target = "wasm32-wasip1"
criticality = "app-required"
startup_loading = "lazy"
provenance = "bundled-artifact"
import_class = "temper-host+wasi-preview1"

[[wasm_modules]]
name = "session_link_monitor"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "session_recoverer"
criticality = "app-required"
startup_loading = "lazy"

# Every other module a paw-agent spec triggers. The installer registers only
# declared modules; one left out here is never installed, and its trigger
# fails with "WASM module not found".
[[wasm_modules]]
name = "sandbox_provisioner"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "context_compactor"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "steering_checker"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "workspace_restorer"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "request_approval"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "request_plan_review"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "plan_approval_handler"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "plan_review_feedback_handler"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "cron_compute_next"
criticality = "app-required"
startup_loading = "lazy"
