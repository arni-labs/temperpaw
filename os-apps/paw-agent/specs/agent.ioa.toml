# Agent — Persistent agent identity (team member).
#
# An Agent represents a named role on a team with a soul, skills, and tools.
# Sessions are spawned from Agents to execute tasks.
#
# NOTE: This file is named agent_identity.ioa.toml to avoid conflicting with
# the existing agent.ioa.toml while it is being renamed to session.ioa.toml
# by the parallel agent. Once the rename is complete, this can be renamed to
# agent.ioa.toml.

[automaton]
name = "Agent"
states = ["Created", "Active", "Archived"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Active"]
terminal = ["Archived"]

# Identity
[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "role"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "soul_id"
type = "string"
initial = ""

[[state]]
name = "instructions_file_id"
type = "string"
initial = ""

[[state]]
name = "team_id"
type = "string"
initial = ""

[[state]]
name = "source_app_id"
type = "string"
initial = ""

# Session config (template for spawning sessions)
[[state]]
name = "model"
type = "string"
initial = ""

[[state]]
name = "provider"
type = "string"
initial = ""

[[state]]
name = "provider_options_json"
type = "string"
initial = ""
query_indexed = false

[[state]]
name = "temperature"
type = "string"
initial = "1.0"

[[state]]
name = "tools_enabled"
type = "string"
initial = ""

[[state]]
name = "max_turns"
type = "string"
initial = "200"

# Actions
[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
to = "Active"
params = ["name", "role", "description", "soul_id", "instructions_file_id", "team_id", "source_app_id", "model", "provider", "provider_options_json", "temperature", "tools_enabled", "max_turns"]
hint = "Set up the agent identity and session configuration."

[[action]]
name = "Update"
kind = "input"
from = ["Active"]
params = ["description", "instructions_file_id", "model", "provider", "provider_options_json", "temperature", "tools_enabled", "max_turns"]
hint = "Update agent configuration."

[[action]]
name = "Archive"
kind = "input"
from = ["Active"]
to = "Archived"
hint = "Archive this agent."
