# App — Installed application with provenance tracking.
#
# An App represents an installed capability package (entity types, WASM modules,
# agents, skills, policies). Created during os-app bootstrap with a UUID.
# Agents reference their source app via source_app_id.

[automaton]
name = "App"
states = ["Installed", "Archived"]
initial = "Installed"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Installed"]
terminal = ["Archived"]

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "version"
type = "string"
initial = ""

[[state]]
name = "app_guide_file_id"
type = "string"
initial = ""

# Actions
[[action]]
name = "Install"
kind = "input"
from = ["Installed"]
to = "Installed"
params = ["name", "description", "version", "app_guide_file_id"]
hint = "Create or update an installed app."

[[action]]
name = "Archive"
kind = "input"
from = ["Installed"]
to = "Archived"
hint = "Archive this app."
