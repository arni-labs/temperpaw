# --- Actions: OTS Trajectory Emission (ADR-0035) ---
# The emit_ots_trajectory integration dispatches MarkTrajectoryEmitted on success
# (passing both trajectory_id and trajectory_emission_status="emitted" as params,
# which the framework applies as field updates). On failure, the integration's
# on_failure hook fires TrajectoryEmissionFailed which records the error.

[[action]]
name = "MarkTrajectoryEmitted"
kind = "input"
from = ["Completed", "Failed", "Cancelled"]
params = ["trajectory_id", "trajectory_emission_status"]
hint = "emit_ots_trajectory succeeded — record the trajectory_id and mark emission complete."

[[action]]
name = "TrajectoryEmissionFailed"
kind = "input"
from = ["Completed", "Failed", "Cancelled"]
params = ["trajectory_emission_error", "trajectory_emission_status"]
hint = "emit_ots_trajectory POST failed. Records the error so the Evolution Engine can sweep failed emissions later."

[[action]]
name = "RetryTrajectoryEmission"
kind = "input"
from = ["Completed", "Failed", "Cancelled"]
guard = "trajectory_retry_count < 1"
hint = "Manually retry OTS emission once after a prior failure. Guarded to a single retry; further failures wait for Evolution Engine sweep."
effect = [
  { type = "increment", var = "trajectory_retry_count" },
  { type = "trigger", name = "emit_ots_trajectory" }
]

