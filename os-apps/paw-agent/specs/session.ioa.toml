params = ["provider_auth_status", "provider_auth_checked_at_ms", "provider_auth_error", "provider_auth_retry_count", "compaction_auth_retry_count"]
hint = "Codex provider auth is fresh, or this provider does not need Codex OAuth. Call the LLM provider."
effect = [{ type = "trigger", name = "call_provider" }]

