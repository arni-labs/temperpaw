# --- Actions: Per-state wake-up (ADR-0039) -----------------------------------
#
# These six self-loop actions wake a stalled session by re-triggering the
# integration that drives its current state. Fired by route_message when a
# Discord DM arrives on a session whose last_progress_at is > 60s stale
# (see os-apps/paw-channels/wasm/route_message/src/lib.rs).
#
# Each action increments progress_token so the Executing / CallingProvider /
# PreparingContext / Compacting / Steering state_timeouts see it
# as progress and do not fire TimeoutFail prematurely — this is the same
# semantic ProgressMade has, applied at the state-transition layer.
#
# The split into six actions (instead of one polymorphic Resume) is
# intentional: using only existing spec primitives (`increment` + `trigger`)
# keeps the IOA verification cascade trivial and avoids adding a new Effect
# variant to temper-spec. Six is the count of states that have declared
# drivers in Session today; if that grows past ~15 we'll revisit.

[[action]]
name = "ResumeTools"
kind = "input"
from = ["Executing"]
hint = "Wake a stalled run_tools. Self-loop. Fired by route_message when a DM arrives on an Executing session whose last_progress_at is stale."
effect = [
  { type = "increment", var = "progress_token" },
  { type = "trigger",   name = "run_tools" },
]

[[action]]
name = "ResumeProvider"
kind = "input"
from = ["CallingProvider"]
hint = "Wake a stalled call_provider. Self-loop."
effect = [
  { type = "increment", var = "progress_token" },
  { type = "trigger",   name = "call_provider" },
]

[[action]]
name = "ResumeContext"
kind = "input"
from = ["PreparingContext"]
hint = "Wake a stalled prepare_context. Self-loop."
effect = [
  { type = "increment", var = "progress_token" },
  { type = "trigger",   name = "prepare_context" },
]

[[action]]
name = "ResumeCompacting"
kind = "input"
from = ["Compacting"]
hint = "Wake a stalled compact_context. Self-loop."
effect = [
  { type = "increment", var = "progress_token" },
  { type = "trigger",   name = "compact_context" },
]

[[action]]
name = "ResumeSteering"
kind = "input"
from = ["Steering"]
hint = "Wake a stalled check_steering. Self-loop from the Steering state where steering-specific processing is active."
effect = [
  { type = "increment", var = "progress_token" },
  { type = "trigger",   name = "check_steering" },
]

