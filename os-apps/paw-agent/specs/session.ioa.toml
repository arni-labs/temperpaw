# --- Actions: Heartbeat + ProgressMade ---

[[action]]
name = "Heartbeat"
kind = "input"
from = ["PreparingContext", "EnsuringProviderAuth", "CallingProvider", "ApplyingProviderResponse", "Executing", "EnsuringCompactionAuth", "Steering", "Compacting", "WaitingForApproval", "Recovering"]
params = ["last_heartbeat_at"]
hint = "Pure liveness ping. Records last_heartbeat_at and drives Discord typing indicator (posted inline by the caller — see wasm-helpers::send_typing_indicator). Does NOT reset any state_timeout — callers that have actually advanced must dispatch ProgressMade instead. A session blocked in a stuck HTTP call can still emit Heartbeats and should die via state_timeout."

[[action]]
name = "ProgressMade"
kind = "input"
from = ["PreparingContext", "EnsuringProviderAuth", "CallingProvider", "ApplyingProviderResponse", "Executing", "EnsuringCompactionAuth", "Compacting", "Recovering"]
params = ["last_progress_at"]
hint = "Signal real forward progress (received first LLM chunk, completed a tool batch, wrote a context chunk, etc). Self-loop; increments progress_token and resets the state_timeout clock for the current state. Contrast with Heartbeat (liveness-only, does NOT reset timeouts)."
effect = [
  { type = "increment", var = "progress_token" },
]

[[action]]
name = "TimeoutFail"
kind = "input"
from = ["PreparingContext", "EnsuringProviderAuth", "CallingProvider", "ApplyingProviderResponse", "Executing", "EnsuringCompactionAuth", "Steering", "Compacting"]
to = "Failed"
params = ["error_message"]
hint = "Session timed out — no heartbeat within timeout period."
effect = [
  { type = "trigger", name = "deliver_reply" },
  { type = "trigger", name = "emit_ots_trajectory" }
]

