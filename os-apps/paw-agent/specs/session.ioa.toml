# Note: Completed/Failed/Cancelled are terminal for the session loop, but
# DeliveryFailed is a valid self-loop action from terminal states to record
# delivery failures. So we do NOT assert no_further_transitions.

[[invariant]]
name = "TurnCountNonNegative"
when = ["Created", "Provisioning", "PreparingContext", "EnsuringProviderAuth", "CallingProvider", "ApplyingProviderResponse", "Executing", "EnsuringCompactionAuth", "Compacting", "Steering", "WaitingForApproval", "Recovering", "Completed", "Failed", "Cancelled"]
assert = "turn_count >= 0"

[[state_timeout]]
state = "Created"
after_seconds = 60
on_timeout = "Fail"
params = { error_message = "session Configure never arrived within 60s" }

[[state_timeout]]
state = "Provisioning"
after_seconds = 180
on_timeout = "TimeoutFail"
reset_on = ["ProvisionPending"]
params = { error_message = "workspace/sandbox provisioning did not complete within 180s" }

[[state_timeout]]
state = "PreparingContext"
after_seconds = 120
on_timeout = "TimeoutFail"
reset_on = ["ProgressMade", "ResumeContext"]
params = { error_message = "context preparation did not complete within 120s" }

[[state_timeout]]
state = "EnsuringProviderAuth"
after_seconds = 60
on_timeout = "TimeoutFail"
reset_on = ["ProgressMade"]
params = { error_message = "provider auth check did not complete within 60s" }

[[state_timeout]]
state = "CallingProvider"
after_seconds = 600
on_timeout = "TimeoutFail"
reset_on = ["ProgressMade", "ResumeProvider"]
params = { error_message = "provider call made no progress within 600s" }

[[state_timeout]]
state = "ApplyingProviderResponse"
after_seconds = 60
on_timeout = "TimeoutFail"
params = { error_message = "applying provider response did not complete within 60s" }

[[state_timeout]]
state = "Executing"
after_seconds = 300
on_timeout = "TimeoutFail"
reset_on = ["ProgressMade", "CheckpointToolBatch", "ResumeTools"]
params = { error_message = "tool execution made no progress for 300s" }

[[state_timeout]]
state = "Steering"
after_seconds = 60
on_timeout = "TimeoutFail"
reset_on = ["ResumeSteering"]
params = { error_message = "steering check did not complete within 60s" }

[[state_timeout]]
state = "EnsuringCompactionAuth"
after_seconds = 60
on_timeout = "TimeoutFail"
reset_on = ["ProgressMade"]
params = { error_message = "compaction auth check did not complete within 60s" }

[[state_timeout]]
state = "Compacting"
after_seconds = 300
on_timeout = "TimeoutFail"
reset_on = ["ProgressMade", "ResumeCompacting"]
params = { error_message = "context compaction did not complete within 300s" }

[[state_timeout]]
state = "Recovering"
after_seconds = 120
on_timeout = "Fail"
max_occurrences = 3
params = { error_message = "recovery did not complete within 120s" }

# ============================================================================
# ADR-0036 / ADR-0051: admission control caps
#
# Values tuned from the 2026-04-17 Katagami incident (11 concurrent Session
# creates in 38s overwhelmed shared actors). Ops may override via the
# /_admin/admission/{tenant}/Session endpoint without a redeploy.
# ============================================================================

[admission]
max_concurrent_creates = 10
max_concurrent_actions = { "Configure" = 5, "ProviderAuthReady" = 3, "CompactionAuthReady" = 1 }
queue_depth = 100
queue_timeout_seconds = 30
