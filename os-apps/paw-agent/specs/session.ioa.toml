[[action]]
name = "HandleToolResults"
kind = "input"
from = ["Executing"]
to = "PreparingContext"
params = ["pending_tool_calls", "conversation", "session_leaf_id", "repl_file_id", "tool_spans_file_id", "sandbox_url", "sandbox_id", "sandbox_provider", "system_prompt_hash", "system_prompt_file_id", "pending_tool_context", "pending_decision_id"]
hint = "Tool results received. Increment turn, transition to PreparingContext, and assemble the next bounded provider turn."
effect = [
  { type = "increment", var = "turn_count" },
  { type = "trigger", name = "prepare_context" }
]

[[action]]
name = "CheckpointToolBatch"
kind = "input"
from = ["Executing"]
to = "Executing"
params = ["pending_tool_calls", "pending_tool_context", "repl_file_id", "session_leaf_id"]
hint = "monty_repl reached a tool-batch checkpoint boundary inside run_tools. Persist partial results via `pending_tool_context` and re-dispatch run_tools with the remainder. Self-loop on Executing; increments checkpoint_count for the runaway guard. See TemperPaw Track 1 Phase 3 / temperpaw#66."
effect = [
  { type = "increment", var = "checkpoint_count" },
  { type = "trigger", name = "run_tools" }
]

