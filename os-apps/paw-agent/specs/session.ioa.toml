hint = "Configure session. Auto-provisions after configuration. Resume fields (workspace_id, conversation_file_id, session_file_id, session_leaf_id) are accepted so continuations carry prior conversation state. Optional reply route fields preserve channel delivery context for terminal replies; optional GenAI parent trace fields preserve inbound distributed trace context."
