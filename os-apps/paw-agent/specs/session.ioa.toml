# Session Entity — Pi-compatible governed session loop via IOA state machine.
#
# The session turn cycle is expressed as state transitions with WASM integration
# triggers. No Rust while loop — the platform's dispatch pipeline drives
# iteration through callback chaining:
#   PreparingContext → (prepare_context) → EnsuringProviderAuth →
#   (provider_auth_gate) → CallingProvider → (call_provider) →
#   ApplyingProviderResponse → ProcessToolCalls/CheckSteering/RecordResult/RecordResultNoReply/RecordResultInlineReply
#   Non-Codex providers may fast-path from PreparingContext directly to
#   CallingProvider while recording provider_auth_status = "skipped".
#
# Pi architecture additions:
#   - Session tree: JSONL append-only tree with branching (session_file_id)
#   - Compaction: ApplyingProviderResponse → Compacting → PreparingContext (context_compactor WASM)
#   - Steering: ApplyingProviderResponse → Steering → PreparingContext or Completed via FinalizeResult/FinalizeResultNoReply (two-loop model)
#   - Soul/Skills/Memory: entity references for identity, capabilities, knowledge
#   - Subagents: parent/child entity relationships via parent_session_id
#   - Heartbeat: pure liveness ping (Discord typing + last_heartbeat_at); does NOT reset state_timeouts
#   - ProgressMade: real forward progress (bytes received, tool batch completed); resets state_timeouts
#
# Conversation history uses SessionEntry entities for hot turns, with legacy
# TemperFS JSONL session files still accepted for existing sessions.
# Budget enforced via turn_count guard. Tools governed by Cedar.

[automaton]
name = "Session"
states = ["Created", "Provisioning", "PreparingContext", "EnsuringProviderAuth", "CallingProvider", "ApplyingProviderResponse", "Executing", "EnsuringCompactionAuth", "Compacting", "Steering", "WaitingForApproval", "Recovering", "Completed", "Failed", "Cancelled"]
initial = "Created"
# ADR-0050 / ADR-0036: WaitingForApproval is human-blocked on a Cedar
# decision; a wall-clock timeout here would conflict with governance
# semantics. All other non-terminal states carry a [[state_timeout]] below.
# justification: Cedar approval is human-gated. A timeout would conflict
# with governance semantics (a denied decision is a decision; a timed-out
# one is a policy gap).
allow_indefinite_states = ["WaitingForApproval", "Completed", "Failed", "Cancelled"]

