# CronJob — Scheduled agent runs (declarative spawn).
#
# Self-scheduling via schedule_at effect. Trigger increments run_count and
# fires cron_compute_next WASM (cron parsing + template substitution).
# TriggerComplete declaratively spawns a Session via the platform's spawn
# effect with copy_fields, then schedules the next Trigger via schedule_at.
# Template substitution supports {{now}}, {{run_count}}, {{last_result}}.

[automaton]
name = "CronJob"
states = ["Created", "Active", "Paused", "Expired"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Active", "Paused"]
terminal = ["Expired"]

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "schedule"
type = "string"
initial = ""

[[state]]
name = "soul_id"
type = "string"
initial = ""

[[state]]
name = "system_prompt"
type = "string"
initial = ""

[[state]]
name = "user_message_template"
type = "string"
initial = ""

[[state]]
name = "user_message"
type = "string"
initial = ""

[[state]]
name = "model"
type = "string"
initial = ""

[[state]]
name = "provider"
type = "string"
initial = ""

[[state]]
name = "provider_options_json"
type = "string"
initial = ""
query_indexed = false

[[state]]
name = "temperature"
type = "string"
initial = "1.0"

[[state]]
name = "tools_enabled"
type = "string"
initial = "temper_create,temper_get,temper_list,temper_action,temper_patch,temper_submit_specs,temper_show_spec,temper_specs,temper_upload_wasm,temper_get_trajectories,temper_get_insights,temper_get_decisions,temper_poll_decision,temper_approve_decision,temper_deny_decision,temper_submit_policy,temper_list_policies,temper_get_policy,temper_update_policy,temper_delete_policy,temper_search_apps,temper_install_app,temper_publish_app,temper_update_app,temper_list_apps,temper_spawn_session,temper_list_sessions,temper_abort_session,temper_steer_session,temper_save_memory,temper_recall_memory,temper_write,temper_read,temper_run_coding_agent,temper_get_secret,temper_datadog_query,temper_railway,temper_vercel,temper_web_search,temper_web_fetch,temper_image_generate,read,write,edit,bash"

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[state]]
name = "max_turns"
type = "string"
initial = "20"

[[state]]
name = "last_run_at"
type = "string"
initial = ""

[[state]]
name = "next_run_at"
type = "string"
initial = ""

[[state]]
name = "run_count"
type = "counter"
initial = 0

[[state]]
name = "max_runs"
type = "string"
initial = "0"

[[state]]
name = "last_session_id"
type = "string"
initial = ""

[[state]]
name = "last_result"
type = "string"
initial = ""

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["name", "schedule", "soul_id", "system_prompt", "user_message_template", "model", "provider", "provider_options_json", "temperature", "tools_enabled", "sandbox_url", "max_turns", "max_runs"]
hint = "Configure the cron job with schedule and agent parameters."

[[action]]
name = "Activate"
kind = "input"
from = ["Created"]
to = "Active"
hint = "Start the cron schedule — computes first next_run_at."

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "cron_activate"
kind = "wasm"
module = "cron_compute_next"
on_failure = "ActivateFailed"

[action.triggers.config]
mode = "activate"


[[action]]
name = "ActivateComplete"
kind = "input"
from = ["Active"]
params = ["next_run_at"]
hint = "First next_run_at computed. Schedule initial trigger."
effect = ["schedule_at('Trigger', next_run_at)"]

[[action]]
name = "ActivateFailed"
kind = "input"
from = ["Active"]
params = ["error_message"]
hint = "Activation WASM failed. Entity stays Active but unscheduled."

[[action]]
name = "Pause"
kind = "input"
from = ["Active"]
to = "Paused"
hint = "Pause the cron schedule."

[[action]]
name = "Resume"
kind = "input"
from = ["Paused"]
to = "Active"
hint = "Resume the cron schedule — recomputes next_run_at."

[[action.triggers]]
name = "cron_activate"
kind = "wasm"
module = "cron_compute_next"
on_failure = "ActivateFailed"
config = { mode = "activate" }

[[action]]
name = "Trigger"
kind = "input"
from = ["Active"]
params = ["last_run_at"]
hint = "Fire the cron job — increments run count and computes next schedule + user message."
effect = ["run_count += 1"]

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "cron_compute_next"
kind = "wasm"
module = "cron_compute_next"
on_failure = "TriggerFailed"

[action.triggers.config]
mode = "trigger"


[[action]]
name = "TriggerComplete"
kind = "input"
from = ["Active"]
params = ["next_run_at", "user_message"]
hint = "Cron computation complete. Spawn Session with copied fields, schedule next run."
effect = ["spawn('Session', 'Configure', last_session_id, copy(system_prompt, user_message, model, provider, provider_options_json, temperature, tools_enabled, soul_id, sandbox_url, max_turns))", "schedule_at('Trigger', next_run_at)"]

[[action]]
name = "TriggerFailed"
kind = "input"
from = ["Active"]
params = ["error_message"]
hint = "Trigger WASM failed. Stays Active for next scheduled run."

[[action]]
name = "Expire"
kind = "input"
from = ["Active"]
to = "Expired"
hint = "Max runs reached or manually expired."
