# ToolHook — Before/after hooks for tool execution.
#
# Hooks are evaluated by tool_runner before/after executing tools.
# Supports block, log, and modify actions with regex tool matching.

[automaton]
name = "ToolHook"
states = ["Active", "Disabled"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active", "Disabled"]

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "hook_type"
type = "string"
initial = "before"

[[state]]
name = "tool_pattern"
type = "string"
initial = ".*"

[[state]]
name = "hook_action"
type = "string"
initial = "log"

[[state]]
name = "soul_id"
type = "string"
initial = ""

[[state]]
name = "priority"
type = "counter"
initial = 0

[[state]]
name = "cedar_enabled"
type = "string"
initial = "false"

[[state]]
name = "command_pattern"
type = "string"
initial = ""

[[state]]
name = "project_scope"
type = "string"
initial = ""

[[action]]
name = "Register"
kind = "input"
from = ["Active"]
params = ["name", "hook_type", "tool_pattern", "hook_action", "soul_id", "priority", "cedar_enabled", "command_pattern", "project_scope"]
hint = "Register a tool hook with pattern and action."

[[action]]
name = "Disable"
kind = "input"
from = ["Active"]
to = "Disabled"
hint = "Disable the hook."

[[action]]
name = "Enable"
kind = "input"
from = ["Disabled"]
to = "Active"
hint = "Re-enable the hook."
