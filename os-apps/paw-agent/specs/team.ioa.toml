# Team — Group of agents working on a project.

[automaton]
name = "Team"
states = ["Created", "Active", "Archived"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Active"]
terminal = ["Archived"]

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "harness_id"
type = "string"
initial = ""

[[state]]
name = "project_id"
type = "string"
initial = ""

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
to = "Active"
params = ["name", "description", "harness_id", "project_id"]
hint = "Set up the team and link to a harness."

[[action]]
name = "Update"
kind = "input"
from = ["Active"]
params = ["name", "description"]
hint = "Update team details."

[[action]]
name = "Archive"
kind = "input"
from = ["Active"]
to = "Archived"
hint = "Archive this team."
