# Memory — Cross-session persistent knowledge.
#
# Memories persist ACROSS agent runs, scoped to an agent_id (the persistent entity that learns).
# Types: user, feedback, project, reference (matching Claude Code taxonomy).
# Content stored inline (memories are small).

[automaton]
name = "Memory"
states = ["Active", "Archived"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active"]
terminal = ["Archived"]

[[state]]
name = "key"
type = "string"
initial = ""

[[state]]
name = "content"
type = "string"
initial = ""

[[state]]
name = "memory_type"
type = "string"
initial = "project"

[[state]]
name = "agent_id"
type = "string"
initial = ""

[[state]]
name = "soul_id"
type = "string"
initial = ""

[[state]]
name = "project_id"
type = "string"
initial = ""

[[action]]
name = "Save"
kind = "input"
from = ["Active"]
params = ["key", "content", "memory_type", "agent_id", "soul_id", "project_id"]
hint = "Save or initialize a memory entry."

[[action]]
name = "Update"
kind = "input"
from = ["Active"]
params = ["content"]
hint = "Update the memory content."

[[action]]
name = "Archive"
kind = "input"
from = ["Active"]
to = "Archived"
hint = "Archive the memory. It will no longer appear in agent prompts."

[[action]]
name = "Recall"
kind = "input"
from = ["Active"]
hint = "Read-only recall action for audit trail. No state mutation."
