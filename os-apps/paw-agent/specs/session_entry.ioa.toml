# SessionEntry -- Temper-native hot session log entry.
#
# SessionEntry is the operational source of truth for agent turn history. Each
# user, assistant, tool-result, compaction, or steering entry is recorded as its
# own small entity so ordinary turns do not rewrite and re-version a PawFS file.
# PawFS remains the governed artifact surface for exported transcripts, saved
# outputs, and larger durable files.

[automaton]
name = "SessionEntry"
states = ["Recorded"]
initial = "Recorded"
allow_indefinite_states = ["Recorded"]

# --- Declared keys (ADR-0153) ---
# (SessionId, EntryId) uniquely identifies a SessionEntry. The kernel indexes it
# for O(log n) present/absent reads, so the create read-back verify + parent-chain
# walks resolve without a scan (the 413, ARN-68). REQUIRES the kernel with [[key]]
# support deployed first.

[[key]]
name = "session_entry"
properties = ["SessionId", "EntryId"]

[[state]]
name = "session_id"
type = "string"
initial = ""

[[state]]
name = "entry_id"
type = "string"
initial = ""

[[state]]
name = "parent_entry_id"
type = "string"
initial = ""

[[state]]
name = "sequence"
type = "counter"
initial = 0

[[state]]
name = "entry_type"
type = "string"
initial = "message"

[[state]]
name = "role"
type = "string"
initial = ""

[[state]]
name = "content"
type = "string"
initial = ""
overflow_inline_max_bytes = 1048576

[[state]]
name = "content_file_id"
type = "string"
initial = ""

[[state]]
name = "content_file_version_id"
type = "string"
initial = ""

[[state]]
name = "extra_json"
type = "string"
initial = "{}"
overflow_inline_max_bytes = 131072

[[state]]
name = "tokens"
type = "counter"
initial = 0

[[field_invariant]]
name = "RecordedRequiresSessionAndEntryIds"
message = "SessionEntry.Recorded requires SessionId and EntryId"
assert = "Status == 'Recorded' => !empty(SessionId) && !empty(EntryId)"
