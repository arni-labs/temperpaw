[package]
name = "provider-response-applier"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/arni-labs/temper.git", rev = "d559f33025e9939b86f2a92f0ee78f13e21f6f0c" }
session-tree-lib = { path = "../session-tree-lib" }
session-turn-artifacts = { path = "../session-turn-artifacts" }
wasm-helpers = { path = "../wasm-helpers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
