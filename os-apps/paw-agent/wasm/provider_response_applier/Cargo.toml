[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/arni-labs/temper.git", rev = "997e418574fca8fb81b8e2270fba123d8c4dcbbf" }
session-tree-lib = { path = "../session-tree-lib" }
session-turn-artifacts = { path = "../session-turn-artifacts" }
wasm-helpers = { path = "../wasm-helpers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
