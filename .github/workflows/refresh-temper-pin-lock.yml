name: refresh-temper-pin-lock
on:
  push:
    branches: [cursor/temper-pin-blob-rss-5629]
    paths: [.github/workflows/refresh-temper-pin-lock.yml]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STACK_TOKEN }}
          ref: cursor/temper-pin-blob-rss-5629
      - name: Retarget the temper pin and drop this workflow
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          old = "c41e13702cb81a5693e8d9c69db09480733f70b4"
          new = "d65719bf3fd23f8f932a5775527fcf702df325d5"
          sdk = "aead3d22c769382523430c7f769a1aea8486d360"
          paths = [
              Path("crates/temperpaw/Cargo.toml"),
              Path("crates/paw-codex-worker/Cargo.toml"),
              Path("Cargo.lock"),
          ]
          for path in paths:
              text = path.read_text()
              print(f"before {path}: old={text.count(old)} new={text.count(new)}", flush=True)
              path.write_text(text.replace(old, new))
          lock = Path("Cargo.lock").read_text()
          toml = "".join(p.read_text() for p in paths[:2])
          print(
              f"after lock_new={lock.count(new)} lock_old={lock.count(old)} sdk={lock.count(sdk)} toml_new={toml.count(new)}",
              flush=True,
          )
          assert lock.count(new) == 36, lock.count(new)
          assert lock.count(old) == 0
          assert lock.count(sdk) == 2
          assert toml.count(new) == 11
          PY
          git rm -f .github/workflows/refresh-temper-pin-lock.yml
          git add crates/temperpaw/Cargo.toml crates/paw-codex-worker/Cargo.toml Cargo.lock
          git -c user.name='Rita Agafonova' -c user.email='36133358+rita-aga@users.noreply.github.com' commit -m "chore(deps): retarget temper pin to d65719bf3fd2"
          git push origin HEAD:cursor/temper-pin-blob-rss-5629
