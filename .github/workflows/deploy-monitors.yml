name: Deploy Datadog Monitors

on:
  workflow_dispatch:
    inputs:
      reconcile:
        description: "Delete TemperPaw-owned monitors that are absent from dd-monitors/temperpaw-monitors.json"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      dry_run:
        description: "Print planned changes without mutating Datadog"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy-monitors:
    runs-on: arni-ubuntu-4core
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Deploy monitors
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
          RECONCILE: ${{ inputs.reconcile }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$RECONCILE" = "true" ]; then
            args+=(--reconcile)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/deploy_monitors.py "${args[@]}"
