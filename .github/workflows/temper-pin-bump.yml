name: temper-pin-bump
run-name: ${{ inputs.release_id && format('temper pin {0} {1} {2}', inputs.release_id, inputs.step, inputs.step_token) || format('temper pin {0}', inputs.commit) }}

# The staging step of a kernel change: a commit on arni-labs/temper main reaches the main Temper by riding this
# repository's pin. One run does it all (scripts/temper_pin.sh says how):
#   pin      moves every temper rev here to the commit in one pull request on bot/temper-pin-<12>, merges it once its
#            checks are green (a version update takes no review), and names the main commit that pins it. When main's
#            revs already carry the commit it opens nothing. A red check fails the job naming the pull request,
#            which the caller sends to the change's maker to fix on that branch; the outcome annotation's `fix` is it.
#   image    waits for docker.yml's push run on that main commit (its image, sha-<7>).
#   staging  deploys that image to staging and checks it (railway-redeploy.yml), whose outcome names the staged commit.
#
# A caller passes the six inputs of every release step (release_id, step, step_token, pr, commit, ref); commit is the
# temper commit. The pull request is opened and merged with the GitHub App's token (FACTORY_APP_ID, FACTORY_APP_PRIVATE_KEY):
# a pull request opened or merged with the workflow's own token starts no workflow here, so its checks and its image
# would never run.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "The release, when a release line starts this run"
        required: false
        default: ""
      step:
        description: "The release step (stage)"
        required: false
        default: ""
      step_token:
        description: "The release's token for this attempt at the step"
        required: false
        default: ""
      pr:
        description: "The change's pull request address (on arni-labs/temper)"
        required: false
        default: ""
      commit:
        description: "The arni-labs/temper commit to pin: a whole sha on temper main"
        required: true
      ref:
        description: "Unused: the image is the pin's own"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    # Pins land one at a time: each starts from the main the one before left, so two never conflict on the same lines,
    # and one whose commit a pin before it already carries opens nothing.
    concurrency:
      group: temper-pin
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - name: The App's token
        id: app
        uses: actions/create-github-app-token@v2.2.2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      # Main as it is when this job starts, not when the run was asked for: a pin before this one may have landed.
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - name: Pin the commit and land the pull request
        id: pin
        env:
          COMMIT: ${{ inputs.commit }}
          CHANGE_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: bash scripts/temper_pin.sh pin

  image:
    needs: pin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Wait for its image
        id: image
        env:
          COMMIT: ${{ needs.pin.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/temper_pin.sh image

  staging:
    needs: [pin, image]
    uses: ./.github/workflows/railway-redeploy.yml
    secrets: inherit
    with:
      release_id: ${{ inputs.release_id }}
      step: stage
      step_token: ${{ inputs.step_token }}
      pr: ${{ inputs.pr }}
      commit: ${{ inputs.commit }}
      ref: ${{ needs.image.outputs.tag }}
      environment: staging
