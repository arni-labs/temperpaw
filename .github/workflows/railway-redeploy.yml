name: Railway Redeploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published GHCR tag to deploy: edge, latest, or sha-*"
        required: true
        default: edge
      expected_sha:
        description: "Optional full commit SHA the sha-* tag must name (refused for edge/latest)"
        required: false
        default: ""
      base_url:
        description: "Optional base URL to verify; falls back to TEMPERPAW_BASE_URL secret/variable"
        required: false
        default: ""
      poll_attempts:
        description: "Number of deployment-status and health polling attempts"
        required: true
        default: "60"
      poll_seconds:
        description: "Seconds between polling attempts"
        required: true
        default: "10"
      run_artifact_batch_e2e:
        description: "Run PawFS ArtifactBatch production E2E after the deployment proof"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: deploy-temperpaw-production
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BASE_URL_INPUT: ${{ inputs.base_url }}
      RUN_ARTIFACT_BATCH_E2E: ${{ inputs.run_artifact_batch_e2e }}
      TEMPERPAW_BASE_URL: ${{ secrets.TEMPERPAW_BASE_URL || vars.TEMPERPAW_BASE_URL }}
      POLL_ATTEMPTS: ${{ inputs.poll_attempts }}
      POLL_SECONDS: ${{ inputs.poll_seconds }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID || vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID || vars.RAILWAY_SERVICE_ID }}
      TEMPER_API_KEY: ${{ secrets.TEMPER_API_KEY }}
      RAILWAY_GRAPHQL_URL: https://backboard.railway.com/graphql/v2
    steps:
      - name: Validate inputs and secrets
        run: |
          set -euo pipefail

          # This value becomes a production source write, so the shape is
          # exact: edge, latest, or sha- followed by 7 to 40 lowercase hex.
          if ! [[ "${IMAGE_TAG}" =~ ^(edge|latest|sha-[0-9a-f]{7,40})$ ]]; then
            echo "image_tag must be edge, latest, or sha-<7..40 hex>" >&2
            exit 64
          fi
          # expected_sha is proven one way today: a sha-* tag must name that
          # build. /paw/version, which would corroborate it, returns 503
          # (ARN-508), and a mutable tag proves nothing about the build it
          # resolved to - so with edge/latest there is no proof to offer.
          if [ -n "${EXPECTED_SHA}" ]; then
            case "${IMAGE_TAG}" in
              sha-*)
                short="${IMAGE_TAG#sha-}"
                if [ "${EXPECTED_SHA:0:${#short}}" != "${short}" ]; then
                  echo "image_tag ${IMAGE_TAG} does not match expected_sha ${EXPECTED_SHA}" >&2
                  exit 64
                fi
                ;;
              *)
                echo "expected_sha cannot be verified for ${IMAGE_TAG}: use a sha-* tag (ARN-508)" >&2
                exit 64
                ;;
            esac
          fi

          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is required" >&2
            exit 65
          fi
          if [ -z "${RAILWAY_PROJECT_ID}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID}" ] || [ -z "${RAILWAY_SERVICE_ID}" ]; then
            echo "RAILWAY_PROJECT_ID, RAILWAY_ENVIRONMENT_ID, and RAILWAY_SERVICE_ID are required as secrets or variables" >&2
            exit 65
          fi
          base_url="${BASE_URL_INPUT:-${TEMPERPAW_BASE_URL:-}}"
          if [ -z "${base_url}" ]; then
            echo "base_url input or TEMPERPAW_BASE_URL secret/variable is required" >&2
            exit 65
          fi
          case "${base_url}" in
            http://*|https://*)
              ;;
            *)
              echo "base_url must start with http:// or https://" >&2
              exit 64
              ;;
          esac
          echo "BASE_URL=${base_url%/}" >> "${GITHUB_ENV}"

          if [ -n "${EXPECTED_SHA}" ] && ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character lowercase git SHA" >&2
            exit 64
          fi
          case "${RUN_ARTIFACT_BATCH_E2E}" in
            true|false)
              ;;
            *)
              echo "run_artifact_batch_e2e must be true or false" >&2
              exit 64
              ;;
          esac
          if [ "${RUN_ARTIFACT_BATCH_E2E}" = "true" ] && [ -z "${TEMPER_API_KEY}" ]; then
            echo "TEMPER_API_KEY secret is required when run_artifact_batch_e2e=true" >&2
            exit 65
          fi

          case "${POLL_ATTEMPTS}" in
            ''|*[!0-9]*)
              echo "poll_attempts must be an integer" >&2
              exit 64
              ;;
          esac
          case "${POLL_SECONDS}" in
            ''|*[!0-9]*)
              echo "poll_seconds must be an integer" >&2
              exit 64
              ;;
          esac

      - name: Set Railway deployment variables without implicit deploy
        run: |
          set -euo pipefail

          upsert_var() {
            local name="$1"
            local value="$2"

            response="$(jq -n \
              --arg projectId "${RAILWAY_PROJECT_ID}" \
              --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
              --arg serviceId "${RAILWAY_SERVICE_ID}" \
              --arg name "${name}" \
              --arg value "${value}" \
              '{
                query: "mutation($input: VariableUpsertInput!) { variableUpsert(input: $input) }",
                variables: {
                  input: {
                    projectId: $projectId,
                    environmentId: $environmentId,
                    serviceId: $serviceId,
                    name: $name,
                    value: $value,
                    skipDeploys: true
                  }
                }
              }' | curl -fsS \
                -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @- \
                "${RAILWAY_GRAPHQL_URL}")"

            if jq -e '.errors' >/dev/null <<<"${response}"; then
              jq -r '.errors[0].message // "Railway variableUpsert failed"' <<<"${response}" >&2
              exit 1
            fi
          }

          # Build identity lives in the image: BUILD_SHA and BUILD_VERSION are
          # baked (Dockerfile), and the entrypoint derives DD_VERSION and the
          # OTEL attributes from them. This workflow writes none of them; a
          # variable here could only shadow a per-build value with a constant.
          upsert_var IMAGE_TAG "${IMAGE_TAG}"

      - name: Set the service image
        run: |
          set -euo pipefail
          # The service source is a literal image reference. Redeploying the
          # previous deployment replays whatever image it was built from and
          # never consults IMAGE_TAG, which is how this workflow spent two days
          # reporting one tag while production ran another. Railway stages
          # this change; the next step starts the deployment.
          response="$(jq -n \
            --arg serviceId "${RAILWAY_SERVICE_ID}" \
            --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
            --arg image "ghcr.io/arni-labs/temperpaw:${IMAGE_TAG}" \
            '{
              query: "mutation($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }",
              variables: { serviceId: $serviceId, environmentId: $environmentId, input: { source: { image: $image } } }
            }' | curl -fsS -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data @- "${RAILWAY_GRAPHQL_URL}")"
          if jq -e '.errors' >/dev/null <<<"${response}"; then
            jq -r '.errors[0].message' <<<"${response}" >&2; exit 1
          fi
          echo "service source set to ghcr.io/arni-labs/temperpaw:${IMAGE_TAG}"

      - name: Start the deployment
        id: started
        run: |
          set -euo pipefail
          response="$(jq -n \
            --arg serviceId "${RAILWAY_SERVICE_ID}" \
            --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
            '{ query: "mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }",
               variables: { serviceId: $serviceId, environmentId: $environmentId } }' \
            | curl -fsS -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data @- "${RAILWAY_GRAPHQL_URL}")"
          started="$(jq -r '.data.serviceInstanceDeployV2 // empty' <<<"${response}")"
          if ! [[ "${started}" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "serviceInstanceDeployV2 returned no deployment id: ${response}" >&2; exit 1
          fi
          echo "deployment started: ${started}"
          echo "deployment_id=${started}" >> "${GITHUB_OUTPUT}"

      - name: Wait for that deployment to succeed
        env:
          STARTED: ${{ steps.started.outputs.deployment_id }}
        run: |
          set -euo pipefail
          target="ghcr.io/arni-labs/temperpaw:${IMAGE_TAG}"
          for attempt in $(seq 1 "${POLL_ATTEMPTS}"); do
            # A poll that does not answer is "not known yet" and costs one attempt.
            node="$(jq -n --arg serviceId "${RAILWAY_SERVICE_ID}" \
              '{ query: "query($serviceId: String!) { service(id: $serviceId) { serviceInstances { edges { node { environmentId source { image } latestDeployment { id status } } } } } }",
                 variables: { serviceId: $serviceId } }' \
              | curl -fsS -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data @- "${RAILWAY_GRAPHQL_URL}" \
              | jq -c --arg env "${RAILWAY_ENVIRONMENT_ID}" '.data.service.serviceInstances.edges[].node | select(.environmentId == $env)' 2>/dev/null || true)"
            if [ -z "${node}" ]; then
              echo "Attempt ${attempt}: Railway API did not answer; will retry"
              sleep "${POLL_SECONDS}"
              continue
            fi
            image="$(jq -r '.source.image // empty' <<<"${node}")"
            dep="$(jq -r '.latestDeployment.id // empty' <<<"${node}")"
            status="$(jq -r '.latestDeployment.status // empty' <<<"${node}")"
            # The assertion is bound to the deployment this run started.
            if [ "${dep}" = "${STARTED}" ] && [ "${image}" = "${target}" ] && [ "${status}" = "SUCCESS" ]; then
              echo "deployment ${dep} of ${image} is SUCCESS"; exit 0
            fi
            case "${status}" in FAILED|CRASHED|REMOVED)
              [ "${dep}" = "${STARTED}" ] && { echo "deployment ${dep} ended ${status}" >&2; exit 1; } ;;
            esac
            echo "Attempt ${attempt}: deployment=${dep:-none} status=${status:-none}"
            sleep "${POLL_SECONDS}"
          done
          echo "deployment ${STARTED} of ${target} did not reach SUCCESS within ${POLL_ATTEMPTS} attempts" >&2
          exit 1

      - name: Verify the process answers
        run: |
          set -euo pipefail
          # Railway has confirmed the requested image is what deployed. This
          # proves the process behind it serves: exactly 200 from /healthz.
          # /readyz is printed for the log; it folds optional integrations
          # (Discord today) into its answer and does not gate a deploy.
          for attempt in $(seq 1 "${POLL_ATTEMPTS}"); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${BASE_URL%/}/healthz" || true)"
            [ "${code:-000}" = "200" ] && { echo "/healthz 200 after ${attempt} attempt(s)"; break; }
            [ "${attempt}" -eq "${POLL_ATTEMPTS}" ] && { echo "/healthz never returned 200 (last ${code:-000})" >&2; exit 1; }
            sleep "${POLL_SECONDS}"
          done
          readyz="$(curl -sS -o /dev/null -w '%{http_code}' "${BASE_URL%/}/readyz" || true)"
          echo "/readyz ${readyz:-000} (informational)"

      - name: Check out repository for ArtifactBatch E2E
        if: ${{ inputs.run_artifact_batch_e2e == 'true' }}
        uses: actions/checkout@v6.0.2

      - name: Build packaged ArtifactBatch WASM for hash proof
        if: ${{ inputs.run_artifact_batch_e2e == 'true' }}
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          bash os-apps/paw-fs/wasm/artifact_batch_apply/build.sh

      - name: Run ArtifactBatch production E2E
        if: ${{ inputs.run_artifact_batch_e2e == 'true' }}
        env:
          TEMPER_BASE_URL: ${{ env.BASE_URL }}
          TEMPER_API_KEY: ${{ secrets.TEMPER_API_KEY }}
          TENANT_ID: default
          RUN_SUFFIX: gh-${{ github.run_id }}-${{ github.run_attempt }}
          PACKAGED_WASM_PATH: os-apps/paw-fs/wasm/artifact_batch_apply/artifact_batch_apply.wasm
        run: bash scripts/production_artifact_batch_e2e.sh
