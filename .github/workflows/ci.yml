name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - release
  schedule:
    - cron: "0 7 * * *"   # nightly full validation

# A new push to a pull request cancels its older run. Every push to main runs to the end, because it saves the caches
# pull requests restore.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: what a PR waits on. Target <5 min. (ARN-429)
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: WASM artifact packaging regression
        run: bash scripts/test-wasm-build-artifacts.sh
      - name: Channel continuation regression
        run: |
          python3 -m venv "$RUNNER_TEMP/route-message-tests"
          "$RUNNER_TEMP/route-message-tests/bin/pip" install wasmtime==38.0.0
          source os-apps/wasm-build-env.sh
          wasm_path="$(temperpaw_build_wasm "$PWD/os-apps/paw-channels/wasm/route_message" wasm32-wasip1)"
          "$RUNNER_TEMP/route-message-tests/bin/python" scripts/test-route-message-continuation.py "$wasm_path"
      - name: Release script regressions
        run: python3 scripts/test_railway_release.py
      - name: Datadog monitors file
        run: python3 scripts/check_monitors.py
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --locked -p temperpaw -p paw-codex-worker --all-targets -- -D warnings
      - name: Cargo check
        run: cargo check --locked -p temperpaw -p paw-codex-worker
      - name: Worker script syntax
        run: |
          for f in crates/paw-codex-worker/scripts/*.sh; do bash -n "$f"; done
      # Check RSA integrations against the deployment WASM target.
      - name: WASM rsa crates compile on wasm32-unknown-unknown
        run: |
          bash scripts/check-wasm-rsa-getrandom.sh
          cargo check --manifest-path os-apps/paw-patrol/wasm/release_run_lifecycle/Cargo.toml --target wasm32-unknown-unknown

  # Every Cargo workspace's tests, on every pull request and push. scripts/ci/rust_tests.py finds the workspaces on
  # disk: the root one (crates/*) and every os-app module and reference crate, each a workspace of its own. The root
  # tests load packaged os-app modules, so that job first builds every module the way a release does. Branch protection
  # requires `tests`, which gathers the three. (Until 28 Oct 2026 only `full` ran Rust tests, after merge, and only for
  # 13 of 73 workspaces that have tests: 40 of 53 pull requests in the month before landed with none run.)
  tests-root:
    name: cargo test (root workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The packaged modules and their stamps from main's latest build: an app whose sources a change leaves alone is
      # not built again. The nightly run builds every app.
      - uses: actions/cache/restore@v4
        with:
          path: |
            os-apps/**/*.wasm
            !os-apps/**/target/**
            ~/.cache/temperpaw-os-app-modules
          key: os-app-modules-${{ github.sha }}
          restore-keys: os-app-modules-
      - name: Every os-app module, built and packaged as a release builds it
        env:
          REUSE: ${{ github.event_name != 'schedule' && '--reuse' || '' }}
        run: |
          python3 scripts/ci/build_os_app_modules.py ${REUSE:+"$REUSE"}
          bash scripts/verify_route_message_wasm.sh
      - name: The modules' cache key, from their stamps
        id: modules
        if: github.ref == 'refs/heads/main'
        run: echo "key=os-app-modules-$(cat ~/.cache/temperpaw-os-app-modules/*.stamp | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            os-apps/**/*.wasm
            !os-apps/**/target/**
            ~/.cache/temperpaw-os-app-modules
          key: ${{ steps.modules.outputs.key }}
      - name: cargo test, the root workspace
        run: python3 scripts/ci/rust_tests.py root

  tests-others:
    name: cargo test (other workspaces ${{ matrix.part }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test, every other workspace in this part
        run: python3 scripts/ci/rust_tests.py others ${{ matrix.part }}/2

  tests:
    needs: [tests-root, tests-others]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every cargo test job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null

  # Dashboard build and executed smokes. Runs on merges (push to main/release) and nightly, never on pull requests.
  # (ARN-429)
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: cd dashboard && npm install
      - name: Smoke scripts (executed)
        run: |
          crates/paw-codex-worker/scripts/ci-actions-runtime-smoke.sh
          crates/paw-codex-worker/scripts/production-git-ancestry-guard-smoke.sh
      - name: Dashboard build
        run: cd dashboard && npm run build
