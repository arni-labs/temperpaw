name: Monitor Freshness (ADR-0052)

# Runs daily. Opens a GitHub issue for every [TemperPaw]/[Temper] monitor that
# has been in No-Data state for 7 consecutive days, per ADR-0052
# sub-decision 3.

on:
  schedule:
    # 07:17 UTC daily — offset from the hour to avoid GitHub cron stampede.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

jobs:
  monitor-freshness:
    runs-on: arni-ubuntu-4core
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor_freshness
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/monitor_freshness.py
