[workspace]
resolver = "2"
members = [
    "crates/temperpaw",
    "crates/temperpaw-cli",
    "crates/paw-transport",
    "crates/paw-codex-worker",
]
exclude = ["os-apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.28"
tracing-opentelemetry = "0.29"
axum = { version = "0.8", features = ["macros"] }
anyhow = "1"

# These dependencies are compilers the tests run, not just build-time code: the root tests compile packaged os-app
# modules through temper-wasm, and unoptimized Cranelift took 159 of the 265 seconds the root tests ran (44 dsf-twin
# modules in one test). Temper's workspace sets the same two. Application code stays unoptimized.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

# Full debug information across dozens of integration-test executables produces about 30 GiB of build artifacts.
# Omit it to keep test builds within the CI runner's disk budget.
[profile.test]
debug = 0


# Temper's own pprof-rs (temper's vendor/pprof/TEMPER.md): its sample table is 4.8 MB where upstream's is 77.5 MB, and
# Temper's continuous profiler holds it for good. A [patch] applies only in the workspace that declares it, so temper's
# own does not reach this build. Same rev as the temper pin; the pin bump moves both.
[patch.crates-io]
pprof = { git = "https://github.com/arni-labs/temper.git", rev = "951240ad03f07964a2e327c2649db36027b9de4e" }
