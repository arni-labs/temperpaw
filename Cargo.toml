[workspace]
resolver = "2"
members = [
    "crates/temperpaw",
    "crates/temperpaw-cli",
    "crates/paw-transport",
    "crates/paw-codex-worker",
]
exclude = ["os-apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.28"
tracing-opentelemetry = "0.29"
axum = { version = "0.8", features = ["macros"] }
anyhow = "1"
