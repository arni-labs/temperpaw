[package]
name = "temperpaw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Temper Paw — Agent daemon built on Temper platform"

[[bin]]
name = "temperpaw-server"
path = "src/main.rs"

[dependencies]
# Temper platform engine
temper-platform = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
temper-observe = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
temper-server = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb", features = ["observe"] }
temper-runtime = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
temper-jit = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
temper-authz = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
temper-store-postgres = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
temper-store-turso = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
# CSDL parsing for the targeted platform-identity spec registration (see identity_bootstrap.rs)
temper-spec = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }

# Paw transport (local)
paw-transport = { path = "../paw-transport" }

# Async runtime
tokio = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP server
axum = { workspace = true }
axum-extra = { version = "0.10", features = ["cookie"] }

# Logging & Observability
opentelemetry = { workspace = true }
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }
argon2 = "0.5"
jsonwebtoken = "9"
time = "0.3"

# Local environment loading
dotenvy = "0.15"

# Crypto / encoding (for vault key)
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
hex = "0.4"
hmac = "0.12"
rand = "0.9"
sha2 = "0.10"
urlencoding = "2.1"

# Static file serving (dashboard UI)
tower-http = { version = "0.6", features = ["fs"] }

# HTTP client (for soul bootstrap OData calls)
reqwest = { version = "0.12", features = ["json"] }

# Transport manager (cancellation tokens)
tokio-util = "0.7"

# UUID generation for agent IDs
uuid = { version = "1", features = ["v4"] }

# CLI subcommands
clap = { version = "4", features = ["derive"] }

# Beautiful TUI prompts (Rust port of @clack/prompts)
cliclack = "0.3"

[dev-dependencies]
dsf-resource-collect = { path = "../../os-apps/dsf-twin/wasm/dsf_resource_collect" }
temper-wasm = { git = "https://github.com/arni-labs/temper.git", rev = "5f831fc9d6471bb491db1e7f8f9c1017b87698cb" }
tempfile = "3"
toml = "0.8"
tower = "0.5"
