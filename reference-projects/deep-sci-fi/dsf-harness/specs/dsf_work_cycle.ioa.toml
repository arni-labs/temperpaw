# DsfWorkCycle — Deep Sci-Fi governed development work cycle.
#
# Each work cycle tracks one unit of work through the harness gates:
# Planning → Planned → InProgress → Testing → Reviewing → Complete
#
# Gate verification via WASM integrations:
#   BeginTesting → verify_level1_gates (migrations, typecheck, unit tests)
#   PassTests → verify_level2_gates (DST, policy gates)
#
# The Harness entity holds repo_url, tech_stack, conventions.
# DsfWorkCycle references it via project_harness_id.

[automaton]
name = "DsfWorkCycle"
states = ["Planning", "Planned", "InProgress", "Testing", "Reviewing", "Complete", "Failed"]
initial = "Planning"
terminal = ["Complete", "Failed"]

# Fields
[[state]]
name = "project_harness_id"
type = "string"
initial = ""

[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "planner_id"
type = "string"
initial = ""

[[state]]
name = "approver_id"
type = "string"
initial = ""

[[state]]
name = "plan_summary"
type = "string"
initial = ""

[[state]]
name = "test_summary"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "review_notes"
type = "string"
initial = ""

# Gate booleans
[[state]]
name = "has_plan"
type = "bool"
initial = false

[[state]]
name = "migrations_ok"
type = "bool"
initial = false

[[state]]
name = "typecheck_ok"
type = "bool"
initial = false

[[state]]
name = "unit_tests_ok"
type = "bool"
initial = false

[[state]]
name = "dst_ok"
type = "bool"
initial = false

[[state]]
name = "policy_gates_ok"
type = "bool"
initial = false

[[state]]
name = "tests_passed"
type = "bool"
initial = false

# --- Planning ---
[[action]]
name = "Configure"
kind = "input"
from = ["Planning"]
params = ["project_harness_id", "planner_id", "task_summary", "sandbox_url"]

[[action]]
name = "WritePlan"
kind = "input"
from = ["Planning"]
to = "Planned"
params = ["plan_summary"]
effect = ["has_plan = true"]

# --- Implementation ---
[[action]]
name = "StartWork"
kind = "input"
from = ["Planned"]
to = "InProgress"

# Gate reports (self-loops)
[[action]]
name = "ReportMigrations"
kind = "input"
from = ["InProgress"]
params = ["migrations_ok"]

[[action]]
name = "ReportTypecheck"
kind = "input"
from = ["InProgress"]
params = ["typecheck_ok"]

[[action]]
name = "ReportUnitTests"
kind = "input"
from = ["InProgress"]
params = ["unit_tests_ok"]

[[action]]
name = "ReportDst"
kind = "input"
from = ["InProgress", "Testing"]
params = ["dst_ok"]

[[action]]
name = "ReportPolicyGates"
kind = "input"
from = ["InProgress", "Testing"]
params = ["policy_gates_ok"]

# --- Testing ---
[[action]]
name = "BeginTesting"
kind = "input"
from = ["InProgress"]
to = "Testing"

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "verify_level1_gates"
kind = "wasm"
module = "gate_verifier"
on_failure = "Fail"

[action.triggers.config]
gate_level = "1"
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"


[[action]]
name = "PassTests"
kind = "input"
from = ["Testing"]
to = "Reviewing"
params = ["test_summary"]
effect = ["tests_passed = true"]

# --- Review ---

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "verify_level2_gates"
kind = "wasm"
module = "gate_verifier"
on_failure = "Fail"

[action.triggers.config]
gate_level = "2"
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"

[[action]]
name = "Approve"
kind = "input"
from = ["Reviewing"]
to = "Complete"
params = ["approver_id", "pr_url"]

[[action]]
name = "RequestChanges"
kind = "input"
from = ["Reviewing"]
to = "Planning"
params = ["review_notes"]
effect = ["tests_passed = false"]

[[action]]
name = "Fail"
kind = "input"
from = ["Planning", "Planned", "InProgress", "Testing", "Reviewing"]
to = "Failed"
params = ["error_message"]

# --- Integrations ---