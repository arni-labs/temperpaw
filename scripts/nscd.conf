# nscd for the TemperPaw image: a cache of host lookups and nothing else. The entrypoint
# (scripts/temperpaw-entrypoint.sh) starts it before the server. The server looks up the same few hosts again and
# again (its database, its telemetry endpoint, the services its apps call: each new connection is a new lookup), and
# without a cache every one goes to the container's resolver. With nscd, a repeat within the record's TTL is answered
# inside the container. The cache starts empty with each container. Measured with Temper's own server on a cloud
# sandbox: 100 starts, each opening a synced database and pushing one write, sent 806 lookups (1,612 packets) without
# nscd and 1 lookup with it.
#
# The whole file is written here rather than taken from Debian's, so each setting is a choice. nscd refuses to start
# on an option it does not know.

# A DNS answer is kept for the TTL of its record: for DNS, nscd uses the record's TTL and ignores
# positive-time-to-live (nscd.conf(5)). nscd prunes at most every 15 s, so an answer can be used up to 15 s past its
# TTL. positive-time-to-live covers only answers that carry no TTL, which here means /etc/hosts, and check-files
# drops those as soon as the file changes.
enable-cache            hosts   yes
positive-time-to-live   hosts   60
check-files             hosts   yes

# A name that does not resolve is never answered from the cache: it is asked again every time, so the cache can only
# make a lookup faster, never make one fail that would now succeed.
negative-time-to-live   hosts   0

# Kept by nscd alone. Nothing outlives it (its working file in /var/run/nscd is unlinked as soon as it is open), so a
# new nscd starts empty. Nothing is shared either: with `shared hosts yes` every process could map the whole cache,
# whereas over the socket a process gets only the answer it asked for. It also lets `nscd -g` count the hits.
persistent              hosts   no
shared                  hosts   no

# An entry that is still in use is looked up again when its TTL ends, so a lookup seldom waits on the resolver. An
# entry left unused through 5 of those refreshes is dropped. 5 is glibc's default and is what the measurement used.
reload-count            5

# No other cache: nothing here needs users, groups, services or netgroups cached, and a cached user or group goes
# stale when one is added.
enable-cache            passwd    no
enable-cache            group     no
enable-cache            services  no
enable-cache            netgroup  no
